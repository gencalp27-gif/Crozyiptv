<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>IHS PRO PLAYER</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-main: #09090b; --panel-bg: rgba(24, 24, 27, 0.7);
      --ihs-red: #ff1e27; --ihs-dark-red: #8b0000;
      --glass-border: rgba(255, 255, 255, 0.05);
      --text-main: #ededed; --text-muted: #a1a1aa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
    body {
      background-color: var(--bg-main); color: var(--text-main);
      font-family: 'Segoe UI', system-ui, sans-serif; height: 100vh; overflow: hidden;
    }
    .glass-panel {
      background: var(--panel-bg); backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
    }
    .ihs-pro-dashboard { display: flex; flex-direction: column; height: 100vh; }
    
    .brand-container { padding: 15px; display: flex; align-items: center; justify-content: center; gap: 10px; border-bottom: 1px solid var(--glass-border); }
    .crystal-logo {
      width: 25px; height: 25px; background: linear-gradient(135deg, #ff4b4b, var(--ihs-dark-red));
      transform: rotate(45deg); box-shadow: 0 0 15px rgba(255, 30, 39, 0.5); border: 1px solid #ff7a7a;
    }
    .brand-container h2 { font-size: 18px; font-weight: 800; letter-spacing: 2px; color: var(--ihs-red); }
    
    .top-bar { padding: 10px; display: flex; justify-content: space-between; align-items: center; z-index: 5; }
    .search-box { display: flex; align-items: center; flex: 1; background: rgba(0,0,0,0.5); border: 1px solid #333; border-radius: 8px; padding: 10px; }
    .search-box input { background: transparent; border: none; color: white; width: 100%; margin-left: 10px; font-size: 14px; }
    
    .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
    
    .player-wrapper { padding: 10px; }
    .video-container { position: relative; width: 100%; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid #222; }
    .video-container video { width: 100%; aspect-ratio: 16/9; object-fit: cover; }
    
    /* Navigasyon Barı (Geri Butonu ve Başlık) */
    .nav-bar { display: flex; align-items: center; padding: 10px 15px; gap: 10px; background: var(--panel-bg); border-bottom: 1px solid #222; border-top: 1px solid #222; }
    .back-btn { background: #222; color: #fff; border: 1px solid #333; padding: 6px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; display: none; }
    .back-btn:hover { background: rgba(255, 30, 39, 0.2); border-color: var(--ihs-red); }
    .nav-title { font-weight: bold; font-size: 14px; color: var(--ihs-red); flex: 1; text-align: right;}
    
    /* Klasör (Kategori) Tasarımı */
    .folder-grid { padding: 15px; display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; }
    .folder-card { background: var(--panel-bg); border: 1px solid var(--glass-border); border-radius: 12px; padding: 25px 15px; text-align: center; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .folder-card:active { transform: scale(0.95); border-color: var(--ihs-red); background: rgba(255,30,39,0.1); }
    .folder-card i { font-size: 35px; color: var(--ihs-red); margin-bottom: 12px; }
    .folder-name { font-weight: bold; font-size: 13px; color: white; }
    .folder-count { font-size: 11px; color: var(--text-muted); margin-top: 5px; }

    /* Kanal Grid Tasarımı */
    .channels-grid { padding: 15px; display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
    .channel-card { background: var(--panel-bg); border: 1px solid var(--glass-border); border-radius: 12px; padding: 15px; text-align: center; cursor: pointer; transition: 0.2s; }
    .channel-card:active { transform: scale(0.95); border-color: var(--ihs-red); }
    .channel-card img { width: 45px; height: 45px; object-fit: contain; margin-bottom: 10px; border-radius: 50%; background: #fff; padding: 5px; }
    .channel-name { font-weight: 600; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  </style>
</head>
<body>

<div class="ihs-pro-dashboard">
  <div class="brand-container glass-panel">
    <div class="crystal-logo"></div>
    <h2>IHS PRO</h2>
  </div>

  <header class="top-bar glass-panel">
    <div class="search-box">
      <i class="fas fa-search" style="color: var(--text-muted);"></i>
      <input type="text" id="search-input" placeholder="Kanal ara..." onkeyup="searchChannels()">
    </div>
  </header>

  <main class="main-content">
    <div class="player-wrapper">
      <div class="video-container">
        <video id="video-player" controls autoplay playsinline></video>
      </div>
    </div>
    
    <div class="nav-bar">
      <button class="back-btn" id="back-btn" onclick="showFolders()"><i class="fas fa-arrow-left"></i> Geri</button>
      <div class="nav-title" id="nav-title">Kategoriler</div>
    </div>

    <!-- Klasörler ve Kanallar İçin Alanlar -->
    <div class="folder-grid" id="folder-grid"></div>
    <div class="channels-grid" id="channels-grid" style="display: none;"></div>
  </main>
</div>

let allChannels = [];
let categories = new Set();
let currentCategory = '';
let hls = null;
const video = document.getElementById('video-player');

window.addEventListener('DOMContentLoaded', () => {
  parseContent(gomuluListe);
});

function parseContent(content) {
  const lines = content.split('\n');
  allChannels = []; 
  categories.clear(); 
  categories.add('Tümü'); // Ana klasör

  let currentChannel = {};

  for (let line of lines) {
    line = line.trim();
    if (!line) continue;
    if (line.startsWith('#EXTINF:')) {
      const logo = (line.match(/tvg-logo="([^"]+)"/) || [])[1] || 'https://via.placeholder.com/50?text=TV';
      const group = (line.match(/group-title="([^"]+)"/) || [])[1] || 'Diğer';
      const name = line.split(',').pop().trim();
      currentChannel = { name, logo, group: group.trim() };
      categories.add(currentChannel.group);
    } else if (line.startsWith('http')) {
      currentChannel.url = line;
      allChannels.push(currentChannel);
      currentChannel = {};
    }
  }
  showFolders(); // Sayfa açılır açılmaz klasörleri göster
}

function showFolders() {
  document.getElementById('folder-grid').style.display = 'grid';
  document.getElementById('channels-grid').style.display = 'none';
  document.getElementById('back-btn').style.display = 'none';
  document.getElementById('nav-title').innerText = 'Kategoriler';
  document.getElementById('search-input').value = ''; // Arama kutusunu temizle

  const grid = document.getElementById('folder-grid');
  grid.innerHTML = '';

  categories.forEach(cat => {
    const count = cat === 'Tümü' ? allChannels.length : allChannels.filter(c => c.group === cat).length;
    const card = document.createElement('div');
    card.className = 'folder-card';
    card.innerHTML = `
      <i class="fas fa-folder-open"></i>
      <div class="folder-name">${cat}</div>
      <div class="folder-count">${count} Kanal</div>
    `;
    card.onclick = () => openFolder(cat);
    grid.appendChild(card);
  });
}

function openFolder(cat) {
  currentCategory = cat;
  document.getElementById('folder-grid').style.display = 'none';
  document.getElementById('channels-grid').style.display = 'grid';
  document.getElementById('back-btn').style.display = 'block';
  document.getElementById('nav-title').innerText = cat;
  
  renderChannels();
}

function searchChannels() {
  const query = document.getElementById('search-input').value.toLowerCase();
  
  // Arama kutusu boşsa eski yerine dön
  if(query.trim() === '') {
     if(currentCategory) openFolder(currentCategory);
     else showFolders();
     return;
  }
  
  // Arama yapılıyorsa klasörleri gizle, tüm kanallarda arama yap
  document.getElementById('folder-grid').style.display = 'none';
  document.getElementById('channels-grid').style.display = 'grid';
  document.getElementById('back-btn').style.display = 'block';
  document.getElementById('nav-title').innerText = 'Arama Sonuçları';
  
  const grid = document.getElementById('channels-grid');
  grid.innerHTML = '';
  
  const filtered = allChannels.filter(c => c.name.toLowerCase().includes(query));
  
  filtered.forEach(c => {
    const card = document.createElement('div');
    card.className = 'channel-card';
    card.innerHTML = `<img src="${c.logo}" onerror="this.src='https://via.placeholder.com/50?text=TV'"><div class="channel-name" title="${c.name}">${c.name}</div>`;
    card.onclick = () => playStream(c.url);
    grid.appendChild(card);
  });
}

function renderChannels() {
  const grid = document.getElementById('channels-grid');
  grid.innerHTML = '';
  
  const filtered = currentCategory === 'Tümü' ? allChannels : allChannels.filter(c => c.group === currentCategory);
  
  filtered.forEach(c => {
    const card = document.createElement('div');
    card.className = 'channel-card';
    card.innerHTML = `<img src="${c.logo}" onerror="this.src='https://via.placeholder.com/50?text=TV'"><div class="channel-name" title="${c.name}">${c.name}</div>`;
    card.onclick = () => playStream(c.url);
    grid.appendChild(card);
  });
}

function playStream(url) {
  if (hls) hls.destroy();
  if (Hls.isSupported() && url.includes('.m3u8')) {
    hls = new Hls();
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
  } else {
    video.src = url;
    video.play();
  }
}
