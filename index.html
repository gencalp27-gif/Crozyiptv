<!DOCTYPE html>
<html lang="tr" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>IHS TV & VOD - SMART PLAYER</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    :root { --bg-main: #050505; --bg-card: #121212; --ihs-red: #e50914; --text-main: #ffffff; --text-muted: #888888; --border-color: #262626; --gold: #f5c518; }
    * { box-sizing: border-box; margin: 0; padding: 0; outline: none; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-main); color: var(--text-main); font-family: system-ui, -apple-system, sans-serif; height: 100dvh; overflow: hidden; transition: background-color 0.4s; }
    ::-webkit-scrollbar { width: 5px; height: 5px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: #444; border-radius: 5px; } ::-webkit-scrollbar-thumb:hover { background: var(--ihs-red); }

    /* SİNEMA MODU */
    body.cinema-mode { background-color: #000; }
    body.cinema-mode .sidebar-section { opacity: 0.03; pointer-events: none; filter: blur(4px); transition: 0.4s; }
    body.cinema-mode .player-section { box-shadow: 0 0 120px rgba(0,0,0,1); z-index: 999; }

    /* VIP GİRİŞ EKRANI */
    .security-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; background: radial-gradient(circle at center, #1a0505 0%, #000000 100%); z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .login-box { background: rgba(15, 15, 15, 0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(229, 9, 20, 0.3); padding: 40px; border-radius: 20px; display: flex; flex-direction: column; align-items: center; box-shadow: 0 20px 50px rgba(0,0,0,0.9); width: 90%; max-width: 380px; text-align: center; }
    .crystal-logo { width: 70px; height: 70px; background: linear-gradient(135deg, #ff1a1a, #8b0000); transform: rotate(45deg); box-shadow: 0 0 20px rgba(229, 9, 20, 0.5); border: 2px solid #ff4a4a; border-radius: 12px; margin-bottom: 30px; position: relative; animation: pulseLogo 2s infinite alternate; }
    .crystal-logo::after { content: "IHS"; position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: rotate(-45deg); display: flex; align-items: center; justify-content: center; color: white; font-weight: 900; font-size: 22px; letter-spacing: 2px; }
    @keyframes pulseLogo { from { box-shadow: 0 0 15px rgba(229,9,20,0.4); } to { box-shadow: 0 0 35px rgba(229,9,20,0.8); } }
    .security-title { font-size: 22px; font-weight: 900; letter-spacing: 4px; margin-bottom: 25px; color: #fff; }
    .input-group { position: relative; width: 100%; margin-bottom: 20px; }
    .input-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #888; font-size: 14px; }
    .password-input { background: #0a0a0a; border: 1px solid #333; border-radius: 10px; color: white; padding: 14px 45px; font-size: 15px; width: 100%; text-align: center; letter-spacing: 3px; transition: 0.3s; }
    .password-input:focus { border-color: var(--ihs-red); box-shadow: 0 0 15px rgba(229,9,20,0.2); outline: none; }
    .toggle-pw { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #888; cursor: pointer; font-size: 14px; }
    .toggle-pw:hover { color: #fff; }
    .login-btn { background: linear-gradient(90deg, #e50914, #b0060e); color: white; border: none; padding: 14px; border-radius: 10px; font-size: 14px; font-weight: 800; letter-spacing: 1px; cursor: pointer; width: 100%; transition: 0.3s; }
    .login-btn:hover { transform: scale(1.02); box-shadow: 0 5px 15px rgba(229,9,20,0.5); }
    .error-msg { color: #ff4a4a; font-size: 13px; font-weight: 700; margin-top: 15px; display: none; }
    .shake { animation: shakeAnim 0.4s; }
    @keyframes shakeAnim { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-5px); } }

    .ban-screen { display: none; background: #050505; position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; z-index: 99999; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: var(--ihs-red); }
    .ban-screen i { font-size: 60px; margin-bottom: 20px; }

    .app-wrapper { display: none; width: 100vw; height: 100dvh; overflow: hidden; }

    /* OYNATICI ALANI */
    .player-section { background: #000; z-index: 10; display: flex; flex-direction: column; position: relative; }
    .video-container { width: 100%; height: 100%; background: #000; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .video-container video { width: 100%; height: 100%; object-fit: contain; display: block; z-index: 1; }
    
    /* BÜTÜNLEŞİK ÜST BAŞLIK */
    .player-top-bar { position: absolute; top: 0; left: 0; right: 0; padding: 18px 20px 30px 20px; background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%); display: flex; justify-content: space-between; align-items: center; z-index: 22; opacity: 1; transition: opacity 0.35s ease; pointer-events: auto; }
    .pt-info { display: flex; align-items: center; gap: 12px; }
    .pt-badge { background: rgba(229,9,20,0.2); border: 1px solid var(--ihs-red); color: var(--ihs-red); font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 4px; display: flex; align-items: center; gap: 5px; text-transform: uppercase; }
    .pt-badge.movie { border-color: var(--gold); color: var(--gold); background: rgba(245,197,24,0.15); }
    .pt-title { font-size: 15px; font-weight: 700; color: #fff; text-shadow: 0 2px 4px #000; max-width: 280px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .pt-actions { display: flex; gap: 8px; }
    .pt-btn { background: rgba(18,18,18,0.7); backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,0.15); color: #fff; width: 36px; height: 36px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; transition: 0.2s; }
    .pt-btn:hover { background: var(--ihs-red); border-color: var(--ihs-red); transform: scale(1.08); }

    /* BÜTÜNLEŞİK ALT KONTROLLER */
    .custom-controls { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0) 100%); display: flex; flex-direction: column; padding: 40px 20px 15px 20px; z-index: 22; opacity: 1; transition: opacity 0.35s ease; }
    
    /* Otomatik Gizlenme */
    .video-container.idle .player-top-bar,
    .video-container.idle .custom-controls { opacity: 0 !important; pointer-events: none !important; }

    /* FİLM MODU: SÜRE ÇUBUĞU */
    .progress-container { display: flex; align-items: center; gap: 12px; width: 100%; margin-bottom: 12px; }
    .time-text { font-size: 12px; font-family: monospace; color: #ccc; min-width: 45px; text-align: center; }
    .seek-bar { flex: 1; -webkit-appearance: none; background: rgba(255,255,255,0.2); height: 5px; border-radius: 5px; outline: none; cursor: pointer; transition: height 0.2s; }
    .seek-bar:hover { height: 7px; }
    .seek-bar::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 15px; height: 15px; border-radius: 50%; background: var(--ihs-red); cursor: pointer; transition: 0.2s; box-shadow: 0 0 10px rgba(229,9,20,0.6); }

    /* BUTONLAR */
    .control-buttons { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    .controls-left, .controls-right { display: flex; align-items: center; gap: 16px; }
    .ctrl-btn { background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; transition: 0.2s; text-shadow: 0 2px 4px rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; }
    .ctrl-btn:hover { color: var(--ihs-red); transform: scale(1.1); }
    .ctrl-btn.play-btn { font-size: 26px; }

    /* CANLI TV MODU: KIRMIZI YANIP SÖNEN NOKTA */
    .live-indicator { display: none; align-items: center; gap: 8px; font-size: 13px; font-weight: 800; color: #eee; letter-spacing: 0.5px; }
    .live-dot { width: 10px; height: 10px; border-radius: 50%; background-color: var(--ihs-red); box-shadow: 0 0 10px var(--ihs-red); animation: pulseDot 1.5s infinite; }
    @keyframes pulseDot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.85); } }

    /* SES KONTROLÜ */
    .volume-box { display: flex; align-items: center; gap: 8px; position: relative; }
    .vol-slider { width: 70px; -webkit-appearance: none; background: rgba(255,255,255,0.25); height: 4px; border-radius: 4px; outline: none; cursor: pointer; }
    .vol-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #fff; cursor: pointer; }

    /* ÇİFT TIKLAMA BÖLGELERİ */
    .tap-zone { position: absolute; top: 0; width: 35%; height: 100%; z-index: 10; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; }
    .tap-left { left: 0; } .tap-right { right: 0; }
    .tap-indicator { background: rgba(0,0,0,0.7); color: #fff; font-size: 20px; font-weight: bold; padding: 12px 20px; border-radius: 25px; display: flex; flex-direction: column; align-items: center; gap: 4px; opacity: 0; transform: scale(0.85); transition: 0.2s ease-out; pointer-events: none; border: 1px solid rgba(255,255,255,0.1); }
    .tap-indicator.show { opacity: 1; transform: scale(1); animation: fadeOutTap 0.6s forwards; }
    @keyframes fadeOutTap { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } 100% { opacity: 0; transform: scale(1); } }

    /* OTOMATİK SIRADAKİ EKRANI */
    .auto-next-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 26; display: none; flex-direction: column; align-items: center; justify-content: center; color: #fff; backdrop-filter: blur(5px); }
    .auto-next-spinner { width: 55px; height: 55px; border: 4px solid rgba(255,255,255,0.1); border-top-color: var(--ihs-red); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 18px; position: relative; display: flex; align-items: center; justify-content: center; }
    .auto-next-count { position: absolute; font-size: 20px; font-weight: bold; }
    .auto-next-title { font-size: 14px; color: #aaa; margin-bottom: 5px; }
    .auto-next-name { font-size: 20px; font-weight: 800; max-width: 80%; text-align: center; }
    .cancel-next-btn { margin-top: 18px; background: transparent; border: 1px solid #555; color: #ccc; padding: 7px 18px; border-radius: 20px; cursor: pointer; transition: 0.2s; font-size: 13px; }
    .cancel-next-btn:hover { background: #333; color: #fff; }

    .loading-spinner { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.1); border-top-color: var(--ihs-red); border-radius: 50%; animation: spin 1s linear infinite; z-index: 15; display: none; }
    @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
    
    .error-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 16; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
    .error-overlay i { font-size: 45px; color: var(--ihs-red); margin-bottom: 15px; }
    .fallback-msg { color: #bbb; font-size: 14px; margin-top: 5px; font-weight: 600; }

    /* ORTAK LİSTE TASARIMI */
    .sidebar-section { display: flex; flex-direction: column; background: var(--bg-card); overflow: hidden; flex: 1; position: relative; min-width: 0; transition: 0.4s; }
    .tab-container { display: flex; background: var(--bg-main); border-bottom: 1px solid var(--border-color); flex-shrink: 0; }
    .tab-btn { flex: 1; padding: 15px 0; background: transparent; border: none; color: var(--text-muted); font-size: 13px; font-weight: bold; letter-spacing: 1px; cursor: pointer; transition: 0.3s; border-bottom: 3px solid transparent; }
    .tab-btn.active { color: #fff; border-bottom-color: var(--ihs-red); background: rgba(255,255,255,0.02); }

    .search-container { padding: 12px 15px; background: var(--bg-card); flex-shrink: 0; }
    .search-box { display: flex; align-items: center; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 10px 14px; transition: 0.3s; }
    .search-box:focus-within { border-color: var(--ihs-red); box-shadow: 0 0 10px rgba(229,9,20,0.2); }
    .search-box input { background: transparent; border: none; color: white; width: 100%; margin-left: 10px; font-size: 13px; }

    .categories-bar { display: flex; overflow-x: auto; padding: 0 15px 10px 15px; gap: 8px; border-bottom: 1px solid var(--border-color); -webkit-overflow-scrolling: touch; scroll-behavior: smooth; flex-shrink: 0; }
    .cat-btn { background: #1a1a1a; color: #aaa; border: 1px solid #333; padding: 8px 16px; border-radius: 20px; font-weight: 600; font-size: 12px; white-space: nowrap; cursor: pointer; transition: 0.2s; }
    .cat-btn:hover { border-color: #555; color: #fff; }
    .cat-btn.active { background: var(--ihs-red); color: #fff; border-color: var(--ihs-red); }
    .cat-btn.movie-cat { border-radius: 6px; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; padding: 8px 14px;}

    .category-menu { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(18, 18, 18, 0.98); z-index: 40; display: flex; flex-direction: column; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
    .category-menu.open { transform: translateY(0); }
    .cm-header { padding: 20px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
    .cm-header h3 { font-size: 16px; margin: 0; color: #fff; display: flex; align-items: center; gap: 10px;}
    .cm-close { background: none; border: none; color: #fff; font-size: 22px; cursor: pointer; transition: 0.2s;}
    .cm-close:hover { color: var(--ihs-red); transform: scale(1.1); }
    .cm-list { flex: 1; overflow-y: auto; padding: 15px; display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; align-content: start; padding-bottom: 40px;}
    .cm-item { background: #222; border: 1px solid #333; padding: 15px 10px; border-radius: 8px; text-align: center; font-size: 13px; font-weight: 700; color: #ddd; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; min-height: 60px;}
    .cm-item:hover, .cm-item.active { background: rgba(229,9,20,0.2); border-color: var(--ihs-red); color: #fff; box-shadow: 0 4px 10px rgba(229,9,20,0.3);}

    .content-area { flex: 1; overflow-y: auto; padding: 10px; -webkit-overflow-scrolling: touch; }
    
    .channel-row { display: flex; align-items: center; background: transparent; padding: 8px 12px; border-radius: 8px; cursor: pointer; transition: 0.2s; margin-bottom: 6px; border: 1px solid transparent; }
    .channel-row.active-channel { background: rgba(229, 9, 20, 0.15); border: 1px solid rgba(229, 9, 20, 0.3); border-left: 4px solid var(--ihs-red); }
    .channel-row:hover { background: rgba(255,255,255,0.05); }
    
    .channel-row img { width: 45px; height: 45px; object-fit: contain; background: #fff; border-radius: 6px; padding: 2px; margin-right: 15px; flex-shrink: 0; }
    .channel-row.movie-row img { width: 40px; height: 60px; object-fit: cover; background: #1a1a1a; padding: 0; border-radius: 4px; border: 1px solid #333; }
    
    .channel-row-name { flex: 1; font-weight: 600; font-size: 13px; color: #eee; display: flex; flex-direction: column; justify-content: center; }
    .row-rating { font-size: 11px; color: var(--gold); margin-top: 4px; font-weight: bold; display: flex; align-items: center; gap: 4px; }
    
    .fav-icon { font-size: 16px; color: #444; padding: 8px; transition: 0.3s; z-index: 2; }
    .fav-icon:hover { transform: scale(1.2); }
    .fav-icon.active { color: var(--ihs-red); text-shadow: 0 0 10px rgba(229,9,20,0.5); }

    /* İFRAME OYNATICI STİLLERİ */
    .iframe-wrapper { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 12; background: #000; }
    .iframe-wrapper iframe { width: 100%; height: 100%; border: none; display: block; }

    /* RESPONSIVE DÜZEN */
    @media (max-width: 899px) {
      .app-wrapper { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
      .player-section { width: 100%; flex-shrink: 0; }
      .video-container { aspect-ratio: 16/9; height: auto; }
      .sidebar-section { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
    }
    @media (min-width: 900px) {
      .app-wrapper { display: flex; flex-direction: row; height: 100dvh; overflow: hidden; }
      .player-section { width: 55%; height: 100dvh; flex-shrink: 0; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; }
      .video-container { flex: 1; height: 100%; }
      .sidebar-section { width: 45%; height: 100dvh; display: flex; flex-direction: column; }
    }
  </style>
</head>
<body>

  <!-- YENİ PREMIUM GİRİŞ EKRANI -->
  <div class="security-screen" id="security-screen">
    <div class="login-box" id="login-box">
        <div class="crystal-logo"></div>
        <div class="security-title">IHS PLAYER</div>
        <div class="input-group">
            <i class="fas fa-lock input-icon"></i>
            <input type="password" id="pass-input" class="password-input" placeholder="Giriş Şifresi">
            <i class="fas fa-eye-slash toggle-pw" id="toggle-pw"></i>
        </div>
        <button class="login-btn" onclick="checkPassword()">SİSTEMİ BAŞLAT</button>
        <div class="error-msg" id="error-msg"><i class="fas fa-exclamation-circle"></i> Şifre hatalı!</div>
    </div>
  </div>

  <div class="ban-screen" id="ban-screen"><i class="fas fa-ban"></i><h1>ERİŞİM ENGELLENDİ</h1></div>
  
  <div class="app-wrapper" id="app-wrapper">
    
    <!-- OYNATICI BÖLÜMÜ -->
    <div class="player-section" id="player-section">
      <div class="video-container" id="video-container">
        
        <!-- ÜST BAŞLIK VE BUTONLAR -->
        <div class="player-top-bar" id="player-top-bar">
          <div class="pt-info">
             <span class="pt-badge" id="pt-badge"><i class="fas fa-circle" style="font-size: 7px;"></i> CANLI</span>
             <span class="pt-title" id="pt-title">Yayın Bekleniyor</span>
          </div>
          <div class="pt-actions">
             <button class="pt-btn" onclick="toggleCinema()" title="Sinema Modu"><i class="fas fa-lightbulb"></i></button>
             <button class="pt-btn" onclick="togglePip()" title="Yüzen Ekran (PiP)"><i class="fas fa-clone"></i></button>
             <button class="pt-btn" onclick="requestCast()" title="TV'ye Yansıt"><i class="fas fa-tv"></i></button>
             <button class="pt-btn" onclick="toggleFullscreen()" title="Tam Ekran"><i class="fas fa-expand"></i></button>
          </div>
        </div>

        <!-- ÇİFT TIKLAMA HIZLI SARMA BÖLGELERİ -->
        <div class="tap-zone tap-left" id="tap-left">
           <div class="tap-indicator" id="ind-left"><i class="fas fa-backward"></i><span id="txt-left">-10s</span></div>
        </div>
        <div class="tap-zone tap-right" id="tap-right">
           <div class="tap-indicator" id="ind-right"><i class="fas fa-forward"></i><span id="txt-right">+10s</span></div>
        </div>

        <div class="loading-spinner" id="loading-spinner"></div>
        
        <div class="error-overlay" id="error-overlay">
            <i class="fas fa-exclamation-triangle"></i>
            <p>Bu İçeriğe Ulaşılamıyor</p>
            <div class="fallback-msg" id="fallback-msg">Yayın geçersiz veya sunucu kapalı.</div>
        </div>

        <!-- OTOMATİK SIRADAKİ EKRANI -->
        <div class="auto-next-overlay" id="auto-next-overlay">
            <div class="auto-next-spinner"><span class="auto-next-count" id="an-count">5</span></div>
            <div class="auto-next-title">Sıradaki İçerik Başlatılıyor...</div>
            <div class="auto-next-name" id="an-name">Kanal Adı</div>
            <button class="cancel-next-btn" onclick="cancelAutoNext()">İptal Et</button>
        </div>

        <!-- VİDEO -->
        <video id="video-player" playsinline webkit-playsinline></video>
        
        <!-- BÜTÜNLEŞİK ALT KONTROL PANELİ -->
        <div class="custom-controls" id="custom-controls">
          
          <!-- FİLM MODUNDA GÖRÜNEN İLERLEME ÇUBUĞU (Hata Düzeltildi) -->
          <div class="progress-container" id="progress-container">
            <span class="time-text" id="current-time">00:00</span>
            <input type="range" class="seek-bar" id="seek-bar" value="0" step="0.1">
            <span class="time-text" id="total-time">00:00</span>
          </div>

          <div class="control-buttons">
            <div class="controls-left">
              <button class="ctrl-btn" id="prev-btn" onclick="playPrevItem()" title="Önceki İçerik"><i class="fas fa-step-backward"></i></button>
              <button class="ctrl-btn play-btn" id="play-pause-btn" title="Oynat / Durdur"><i class="fas fa-play"></i></button>
              <button class="ctrl-btn" id="next-btn" onclick="playNextItem()" title="Sonraki İçerik"><i class="fas fa-step-forward"></i></button>
              
              <!-- SES KONTROLÜ -->
              <div class="volume-box">
                <button class="ctrl-btn" id="mute-btn" title="Sesi Aç/Kapat"><i class="fas fa-volume-up"></i></button>
                <input type="range" class="vol-slider" id="vol-slider" min="0" max="1" step="0.05" value="1">
              </div>
            </div>

            <div class="controls-right">
              <!-- CANLI TV'DE GÖRÜNEN CANLI YAYIN ROZETİ -->
              <div class="live-indicator" id="live-indicator">
                 <div class="live-dot"></div> CANLI YAYIN
              </div>
            </div>
          </div>
        </div>
        
      </div>
    </div>

    <!-- YAN MENÜ (ORTAK LİSTE) -->

function parseM3UContent(content, targetArray, targetCategories) {
  const lines = content.split('\n'); let currentObj = null;
  for (let i = 0; i < lines.length; i++) {
    let line = lines[i].trim(); if (!line) continue;
    if (line.startsWith('#EXTINF:')) {
      let group = (line.match(/group-title="([^"]+)"/) || [])[1] || 'Genel';
      let name = line.split(',').pop().trim();
      currentObj = { name, logo: (line.match(/tvg-logo="([^"]+)"/) || [])[1] || '', group }; 
      targetCategories.add(group);
    } else if (line.startsWith('http')) { 
      if (currentObj) { currentObj.url = line; targetArray.push(currentObj); currentObj = null; } 
    }
  }
}

function parseFlexibleM3U(content, targetArray, targetCategories) {
  const lines = content.split('\n'); let pendingMeta = null; let pendingUrl = null;
  for (let i = 0; i < lines.length; i++) {
    let line = lines[i].trim(); if (!line || line.startsWith('#EXTM3U')) continue;
    if (line.startsWith('#EXTINF:')) {
      let group = (line.match(/group-title="([^"]+)"/) || [])[1] || 'Genel';
      targetCategories.add(group);
      pendingMeta = { name: line.split(',').pop().trim(), logo: (line.match(/tvg-logo="([^"]+)"/) || [])[1] || '', group };
    } else if (line.startsWith('http')) { pendingUrl = line; }
    if (pendingMeta && pendingUrl) { targetArray.push({ ...pendingMeta, url: pendingUrl }); pendingMeta = null; pendingUrl = null; }
  }
}

  if (!video.paused) video.pause(); 
  currentMode = mode;
  document.getElementById('tab-tv').className = mode === 'TV' ? 'tab-btn active' : 'tab-btn';
  document.getElementById('tab-movie').className = mode === 'MOVIE' ? 'tab-btn active' : 'tab-btn';
  document.getElementById('search-input').placeholder = mode === 'MOVIE' ? "Film ara..." : "Kanal ara...";
  
  const isMovie = mode === 'MOVIE';
  document.getElementById('progress-container').style.display = isMovie ? 'flex' : 'none';
  document.getElementById('live-indicator').style.display = isMovie ? 'none' : 'flex';
  document.getElementById('pt-badge').className = isMovie ? 'pt-badge movie' : 'pt-badge';
  document.getElementById('pt-badge').innerHTML = isMovie ? '<i class="fas fa-film"></i> FİLM' : '<i class="fas fa-circle" style="font-size:7px;"></i> CANLI';

  document.getElementById('txt-right').innerText = isMovie ? '+10s' : 'Sonraki';

}

      const createBtn = (txt, isFav=false) => { 
        const btn = document.createElement('button'); btn.className = 'cat-btn' + (isFav ? ' cat-btn-fav' : '') + (currentCategory===txt ? ' active' : ''); 
        btn.innerHTML = isFav ? `<i class="fas fa-heart"></i> ${txt}` : txt; btn.onclick = () => { selectCategory(txt); }; catBar.appendChild(btn); 
      };
      createBtn('Favorilerim', true); createBtn('Tümü'); 
      Array.from(categoriesSet).sort(new Intl.Collator('tr').compare).forEach(cat => createBtn(cat));
  } else {
      // FİLMLER İÇİN ÖZEL "KATEGORİLER" AÇILIR MENÜSÜ BUTONU
      const btnAll = document.createElement('button'); btnAll.className = 'cat-btn movie-cat' + (currentCategory==='Tümü' ? ' active' : ''); 
      btnAll.innerText = 'Tümü'; btnAll.onclick = () => selectCategory('Tümü'); catBar.appendChild(btnAll);
      
      const btnMenu = document.createElement('button'); btnMenu.className = 'cat-btn movie-cat'; 
      btnMenu.innerHTML = `<i class="fas fa-list-ul"></i> Kategoriler`; btnMenu.onclick = openCategoryMenu; catBar.appendChild(btnMenu);
      
      if (currentCategory !== 'Tümü') { 
         const btnCurrent = document.createElement('button'); btnCurrent.className = 'cat-btn movie-cat active'; 
         btnCurrent.innerText = currentCategory; btnCurrent.onclick = () => openCategoryMenu(); catBar.appendChild(btnCurrent); 
      }
  }
}

function selectCategory(catName) { currentCategory = catName; document.getElementById('search-input').value = ''; renderCategoriesOnly(); renderContentList(true); }
function openCategoryMenu() { 
  const cmList = document.getElementById('cm-list'); cmList.innerHTML = ''; 
  Array.from(movieCategories).sort(new Intl.Collator('tr').compare).forEach(cat => { 
    const item = document.createElement('div'); item.className = 'cm-item' + (currentCategory === cat ? ' active' : ''); item.innerText = cat; 
    item.onclick = () => { selectCategory(cat); closeCategoryMenu(); }; cmList.appendChild(item); 
  }); 
  document.getElementById('category-menu').classList.add('open'); 
}
function closeCategoryMenu() { document.getElementById('category-menu').classList.remove('open'); }
function searchContent() { renderContentList(true); }
function toggleFavorite(e, channelName) { 
  e.stopPropagation(); const index = favorites.indexOf(channelName); 
  if (index > -1) favorites.splice(index, 1); else favorites.push(channelName); 
  localStorage.setItem('ihs_favorites', JSON.stringify(favorites)); renderContentList(true); 
}

// TMDB BAĞLANTISI (Film Afişleri ve Puanları İçin)
function processTmdbQueue() {
  if (isFetchingTmdb || tmdbQueue.length === 0) return;
  isFetchingTmdb = true;
  const { movie, row } = tmdbQueue.shift();
  let cleanName = movie.name.replace(/\(\d{4}\)/g, '').replace(/\[.*?\]/g, '').trim();

  fetch(`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_KEY}&query=${encodeURIComponent(cleanName)}&language=tr-TR`)
    .then(res => res.json())
    .then(data => {
      if (data && data.results && data.results.length > 0) {
        const item = data.results[0];
        if (item.poster_path) {
            const img = row.querySelector('img');
            if(img) img.src = `https://image.tmdb.org/t/p/w200${item.poster_path}`;
        }
        if (item.vote_average) {
             const nameDiv = row.querySelector('.channel-row-name');
             if(nameDiv && !nameDiv.innerHTML.includes('fa-star')) {
                 nameDiv.innerHTML += `<div class="row-rating"><i class="fas fa-star"></i> ${item.vote_average.toFixed(1)}</div>`;
             }
        }
      }
      isFetchingTmdb = false; setTimeout(processTmdbQueue, 150);
    }).catch(() => { isFetchingTmdb = false; setTimeout(processTmdbQueue, 150); });
}

const movieObserver = new IntersectionObserver((entries, observer) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      const row = entry.target; const movieIdx = row.getAttribute('data-movie-index');
      if (movieIdx !== null) {
        const movie = movies[movieIdx];
        if (movie && !movie.enriched) { movie.enriched = true; tmdbQueue.push({ movie, row }); processTmdbQueue(); }
      }
      observer.unobserve(row);
    }
  });
}, { rootMargin: '150px' });

// ORTAK TEK TİP DİKEY LİSTE RENDERLAYICI
function renderContentList(reset = false) {
  const contentArea = document.getElementById('content-area'); 
  const dataset = currentMode === 'TV' ? tvChannels : movies; 
  const query = document.getElementById('search-input').value.toLocaleLowerCase('tr-TR');
  
  if (reset) { 
    currentRenderCount = 0; contentArea.innerHTML = ''; 
    if (currentCategory === 'Favorilerim') { currentDisplayList = dataset.filter(c => favorites.includes(c.name)); } 
    else { currentDisplayList = currentCategory === 'Tümü' ? dataset : dataset.filter(c => c.group === currentCategory); } 
    if (query) currentDisplayList = currentDisplayList.filter(c => c.name.toLocaleLowerCase('tr-TR').includes(query)); 
  }

  const fragment = document.createDocumentFragment(); 
  const endIndex = Math.min(currentRenderCount + RENDER_CHUNK, currentDisplayList.length);
  
  for (let i = currentRenderCount; i < endIndex; i++) {
    const c = currentDisplayList[i]; const realIdx = dataset.indexOf(c); const safeName = c.name.replace(/</g, "&lt;").replace(/>/g, "&gt;"); 
    const isFav = favorites.includes(c.name); 
    
    const row = document.createElement('div'); 
    row.className = 'channel-row' + (currentMode === 'MOVIE' ? ' movie-row' : '') + (activeItemUrl === c.url ? ' active-channel' : ''); 
    row.setAttribute('data-url', c.url);
    
    let fallbackImg = currentMode === 'TV' 
      ? 'data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'150\' height=\'150\' fill=\'%23222\'><rect width=\'150\' height=\'150\'/><text x=\'50%\' y=\'50%\' fill=\'%23aaa\' font-size=\'16\' font-family=\'sans-serif\' dominant-baseline=\'middle\' text-anchor=\'middle\'>TV</text></svg>'
      : 'data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'100\' height=\'150\' fill=\'%23222\'><rect width=\'100\' height=\'150\'/><text x=\'50%\' y=\'50%\' fill=\'%23aaa\' font-size=\'12\' font-family=\'sans-serif\' dominant-baseline=\'middle\' text-anchor=\'middle\'>FİLM</text></svg>';
    let posterSrc = c.logo && c.logo.startsWith('http') ? c.logo : fallbackImg;
    
    row.innerHTML = `<img src="${posterSrc}" loading="lazy" onerror="this.src='${fallbackImg}'">
                     <div class="channel-row-name">${safeName}</div>
                     <i class="${isFav ? 'fas' : 'far'} fa-heart fav-icon ${isFav ? 'active' : ''}" onclick="toggleFavorite(event, '${safeName.replace(/'/g, "\\'")}')"></i>`; 
    
    row.onclick = () => playStream(c, realIdx); 
    
    if (currentMode === 'MOVIE') { row.setAttribute('data-movie-index', realIdx); movieObserver.observe(row); }
    fragment.appendChild(row);
  }
  contentArea.appendChild(fragment); currentRenderCount = endIndex;
}

function updateActiveCardUI() { 
  document.querySelectorAll('.channel-row').forEach(el => { 
    if(el.getAttribute('data-url') === activeItemUrl) el.classList.add('active-channel'); 
    else el.classList.remove('active-channel'); 
  }); 
}

// BÜTÜNLEŞİK KONTROL MEKANİZMASI (Canlı ve Film Ortak)
function setupUnifiedControls() {
    const playBtn = document.getElementById('play-pause-btn');
    const muteBtn = document.getElementById('mute-btn');
    const volSlider = document.getElementById('vol-slider');
    const seekBar = document.getElementById('seek-bar');
    const vContainer = document.getElementById('video-container');

    function togglePlay() { if (video.paused) video.play(); else video.pause(); }
    playBtn.onclick = (e) => { e.stopPropagation(); togglePlay(); };
    video.onclick = togglePlay;

    video.addEventListener('play', () => { playBtn.innerHTML = '<i class="fas fa-pause"></i>'; });
    video.addEventListener('pause', () => { playBtn.innerHTML = '<i class="fas fa-play"></i>'; });

    volSlider.oninput = (e) => { video.volume = e.target.value; video.muted = (video.volume === 0); updateVolIcon(); };
    muteBtn.onclick = (e) => { e.stopPropagation(); video.muted = !video.muted; volSlider.value = video.muted ? 0 : video.volume; updateVolIcon(); };
    function updateVolIcon() {
        if (video.muted || video.volume === 0) muteBtn.innerHTML = '<i class="fas fa-volume-mute"></i>';
        else if (video.volume < 0.5) muteBtn.innerHTML = '<i class="fas fa-volume-down"></i>';
        else muteBtn.innerHTML = '<i class="fas fa-volume-up"></i>';
    }

    // DİNAMİK SEEKBAR (SÜRE ÇUBUĞU) GÜNCELLEMESİ (HATA GİDERİLDİ)
    video.addEventListener('loadedmetadata', () => {
        if (currentMode === 'MOVIE' && video.duration && video.duration !== Infinity) {
            seekBar.max = video.duration; document.getElementById('total-time').innerText = formatTime(video.duration);
            const savedTime = localStorage.getItem('ihs_resume_' + activeItemUrl);
            if (savedTime && parseFloat(savedTime) < video.duration - 10) { video.currentTime = parseFloat(savedTime); }
        }
    });

    video.addEventListener('timeupdate', () => {
        if (currentMode === 'MOVIE' && video.duration && video.duration !== Infinity) {
            // Süre ilk saniyelerde yüklenmezse dinamik olarak çubuğu güncelle
            if (seekBar.max != video.duration) {
                seekBar.max = video.duration;
                document.getElementById('total-time').innerText = formatTime(video.duration);
            }
            if (!seekBar.active) {
                seekBar.value = video.currentTime;
                document.getElementById('current-time').innerText = formatTime(video.currentTime);
            }
            if (video.currentTime > 5) localStorage.setItem('ihs_resume_' + activeItemUrl, video.currentTime);
        }
    });

    // Mobil ve Web'de kusursuz sürükleme için "input" eklendi
    seekBar.addEventListener('input', (e) => {
        seekBar.active = true;
        document.getElementById('current-time').innerText = formatTime(e.target.value);
    });
    seekBar.addEventListener('change', (e) => {
        video.currentTime = e.target.value;
        seekBar.active = false;
    });
    seekBar.addEventListener('touchstart', () => { seekBar.active = true; });
    seekBar.addEventListener('touchend', (e) => { video.currentTime = e.target.value; seekBar.active = false; });

    video.addEventListener('ended', () => {
        if (currentDisplayList.length > 0 && activeChannelIndex > -1) {
            let nextIdx = activeChannelIndex + 1; if (nextIdx >= currentDisplayList.length) nextIdx = 0;
            const nextItem = currentDisplayList[nextIdx];
            document.getElementById('an-name').innerText = nextItem.name;
            document.getElementById('auto-next-overlay').style.display = 'flex';
            let count = 5; document.getElementById('an-count').innerText = count;
            autoNextTimer = setInterval(() => {
                count--; document.getElementById('an-count').innerText = count;
                if (count <= 0) { clearInterval(autoNextTimer); document.getElementById('auto-next-overlay').style.display = 'none'; playStream(nextItem, nextIdx); }
            }, 1000);
        }
    });

    let lastTapLeft = 0; let lastTapRight = 0;
    document.getElementById('tap-left').addEventListener('click', (e) => {
        const now = new Date().getTime();
        if (now - lastTapLeft < 300) { if (currentMode === 'MOVIE') { seekVideo(-10); animateTap('ind-left'); } else { playPrevItem(); animateTap('ind-left'); } }
        lastTapLeft = now;
    });
    document.getElementById('tap-right').addEventListener('click', (e) => {
        const now = new Date().getTime();
        if (now - lastTapRight < 300) { if (currentMode === 'MOVIE') { seekVideo(10); animateTap('ind-right'); } else { playNextItem(); animateTap('ind-right'); } }
        lastTapRight = now;
    });

    let idleTimeout;
    function resetIdle() {
        vContainer.classList.remove('idle'); clearTimeout(idleTimeout);
        idleTimeout = setTimeout(() => { if (!video.paused) vContainer.classList.add('idle'); }, 2500);
    }
    vContainer.addEventListener('mousemove', resetIdle);
    vContainer.addEventListener('touchstart', resetIdle);
    vContainer.addEventListener('mouseleave', () => { if (!video.paused) vContainer.classList.add('idle'); });

    document.addEventListener('keydown', (e) => {
        if (document.activeElement.tagName === 'INPUT') return;
        switch (e.code) {
            case 'Space': e.preventDefault(); togglePlay(); break;
            case 'KeyF': e.preventDefault(); toggleFullscreen(); break;
            case 'ArrowLeft': e.preventDefault(); if(currentMode==='MOVIE') seekVideo(-10); else playPrevItem(); break;
            case 'ArrowRight': e.preventDefault(); if(currentMode==='MOVIE') seekVideo(10); else playNextItem(); break;
            case 'ArrowUp': e.preventDefault(); video.volume = Math.min(1, video.volume + 0.1); volSlider.value = video.volume; updateVolIcon(); break;
            case 'ArrowDown': e.preventDefault(); video.volume = Math.max(0, video.volume - 0.1); volSlider.value = video.volume; updateVolIcon(); break;
        }
    });
}

function playNextItem() { if (currentDisplayList.length === 0) return; let nextIdx = activeChannelIndex + 1; if (nextIdx >= currentDisplayList.length) nextIdx = 0; playStream(currentDisplayList[nextIdx], nextIdx); }
function playPrevItem() { if (currentDisplayList.length === 0) return; let prevIdx = activeChannelIndex - 1; if (prevIdx < 0) prevIdx = currentDisplayList.length - 1; playStream(currentDisplayList[prevIdx], prevIdx); }
function seekVideo(amount) { if (video && video.duration) { video.currentTime = Math.max(0, Math.min(video.duration, video.currentTime + amount)); } }
function animateTap(id) { const el = document.getElementById(id); el.classList.remove('show'); void el.offsetWidth; el.classList.add('show'); }
function toggleCinema() { document.body.classList.toggle('cinema-mode'); }
function cancelAutoNext() { clearInterval(autoNextTimer); document.getElementById('auto-next-overlay').style.display = 'none'; }
function toggleFullscreen() { const vContainer = document.getElementById('video-container'); if (!document.fullscreenElement) vContainer.requestFullscreen().catch(()=>{}); else document.exitFullscreen(); }
function togglePip() { if (document.pictureInPictureElement) document.exitPictureInPicture(); else if (document.pictureInPictureEnabled) video.requestPictureInPicture().catch(()=>{}); }
function requestCast() { if (video.remote && video.remote.state !== 'disconnected') video.remote.prompt().catch(()=>{}); else if (video.webkitShowPlaybackTargetPicker) video.webkitShowPlaybackTargetPicker(); else alert("Yansıtma donanımı bulunamadı."); }

// BÜTÜNLEŞİK ÇALICI YÜRÜTÜCÜ 
function playStream(item, index) {
  activeItemUrl = item.url; activeChannelIndex = index; cancelAutoNext();
  document.getElementById('error-overlay').style.display = 'none'; document.getElementById('loading-spinner').style.display = 'block';
  
  const safeName = item.name.replace(/</g, "&lt;").replace(/>/g, "&gt;");
  document.getElementById('pt-title').innerText = safeName;

  if (hls) { hls.destroy(); hls = null; }
  const videoContainer = document.getElementById('video-container');
  let existingIframe = document.getElementById('ihs-iframe');
  if (existingIframe) existingIframe.remove();

  let embedUrl = item.url; let isEmbed = false;
  if (item.url) {
    if (item.url.includes('ok.ru/video/')) { embedUrl = `https://ok.ru/videoembed/${item.url.split('/video/')[1].split('?')[0]}`; isEmbed = true; } 
    else if (item.url.includes('vixolity.com/vs/') || item.url.includes('/embed/') || item.url.includes('player.php')) { isEmbed = true; } 
    else if (item.url.includes('youtube.com/watch?v=')) { embedUrl = `https://www.youtube.com/embed/${item.url.split('v=')[1].split('&')[0]}?autoplay=1`; isEmbed = true; } 
    else if (item.url.includes('youtu.be/')) { embedUrl = `https://www.youtube.com/embed/${item.url.split('youtu.be/')[1].split('?')[0]}?autoplay=1`; isEmbed = true; }
  }

  if (isEmbed) {
    video.style.display = 'none';
    document.getElementById('custom-controls').style.display = 'none';
    embedUrl += (embedUrl.includes('?') ? '&' : '?') + 'autoplay=1';

    const iframe = document.createElement('iframe');
    iframe.id = 'ihs-iframe'; iframe.src = embedUrl;
    iframe.style.width = '100%'; iframe.style.height = '100%'; iframe.style.border = 'none'; iframe.style.position = 'absolute'; iframe.style.top = '0'; iframe.style.left = '0'; iframe.style.zIndex = '5';
    iframe.allow = 'autoplay; encrypted-media; fullscreen; picture-in-picture';

    videoContainer.appendChild(iframe);
    document.getElementById('loading-spinner').style.display = 'none';
  } else {
    video.style.display = 'block';
    document.getElementById('custom-controls').style.display = 'flex';

    let targetUrl = item.url;
    if (Hls.isSupported() && (targetUrl.includes('.m3u8') || targetUrl.includes('.ts') || currentMode === 'TV')) {
      hls = new Hls({ enableWorker: true, lowLatencyMode: true });
      hls.on(Hls.Events.ERROR, (e, data) => {
        if (data.fatal) { document.getElementById('loading-spinner').style.display = 'none'; document.getElementById('error-overlay').style.display = 'flex'; }
      });
      hls.loadSource(targetUrl);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => { video.play().catch(()=>{}); document.getElementById('loading-spinner').style.display = 'none'; });
    } else {
      video.src = targetUrl;
      video.play().catch(() => { document.getElementById('error-overlay').style.display = 'flex'; document.getElementById('loading-spinner').style.display = 'none'; });
    }
  }
  updateActiveCardUI();
}

function formatTime(seconds) {
  if (isNaN(seconds)) return "00:00";
  const m = Math.floor(seconds / 60); const s = Math.floor(seconds % 60); const h = Math.floor(m / 60); const mm = m % 60;
  if (h > 0) return `${h}:${mm < 10 ? '0' + mm : mm}:${s < 10 ? '0' + s : s}`;
  return `${m}:${s < 10 ? '0' + s : s}`;
}
