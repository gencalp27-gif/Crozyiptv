<meta charset="UTF-8">
<meta name="google" content="notranslate">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<style>
:root{--bg:#050505;--card:#121212;--red:#e50914;--muted:#888;--line:#262626;--gold:#f5c518}
*{box-sizing:border-box;margin:0;padding:0;outline:none;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid var(--red);outline-offset:2px}
body{background:var(--bg);color:#fff;font-family:system-ui,-apple-system,sans-serif;height:100dvh;overflow:hidden;transition:background .4s}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:#444;border-radius:5px}::-webkit-scrollbar-thumb:hover{background:var(--red)}
body.cinema-mode{background:#000}
body.cinema-mode .sidebar{opacity:.03;pointer-events:none;filter:blur(4px)}
.sidebar{transition:.4s}

/* Giriş */
.security-screen{position:fixed;inset:0;background:radial-gradient(circle at center,#1a0505,#000);z-index:99999;display:flex;align-items:center;justify-content:center}
.login-box{background:rgba(15,15,15,.8);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(229,9,20,.3);padding:40px;border-radius:20px;display:flex;flex-direction:column;align-items:center;box-shadow:0 20px 50px rgba(0,0,0,.9);width:90%;max-width:380px;text-align:center}
.crystal-logo{width:70px;height:70px;background:linear-gradient(135deg,#ff1a1a,#8b0000);transform:rotate(45deg);border:2px solid #ff4a4a;border-radius:12px;margin-bottom:34px;position:relative;animation:pulseLogo 2s infinite alternate}
.crystal-logo::after{content:"IHS";position:absolute;inset:0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;letter-spacing:2px}
@keyframes pulseLogo{from{box-shadow:0 0 15px rgba(229,9,20,.4)}to{box-shadow:0 0 35px rgba(229,9,20,.8)}}
.security-title{font-size:20px;font-weight:900;letter-spacing:4px;margin-bottom:25px}
.input-group{position:relative;width:100%;margin-bottom:20px}
.input-icon{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:#888;font-size:14px}
.password-input{background:#0a0a0a;border:1px solid #333;border-radius:10px;color:#fff;padding:14px 45px;font-size:15px;width:100%;text-align:center;letter-spacing:3px;transition:.3s}
.password-input:focus{border-color:var(--red);box-shadow:0 0 15px rgba(229,9,20,.2)}
.toggle-pw{position:absolute;right:15px;top:50%;transform:translateY(-50%);color:#888;cursor:pointer;font-size:14px}
.login-btn{background:linear-gradient(90deg,#e50914,#b0060e);color:#fff;border:none;padding:14px;border-radius:10px;font-size:14px;font-weight:800;letter-spacing:1px;cursor:pointer;width:100%;transition:.3s}
.login-btn:hover{transform:scale(1.02);box-shadow:0 5px 15px rgba(229,9,20,.5)}
.error-msg{color:#ff4a4a;font-size:13px;font-weight:700;margin-top:15px;display:none}
.shake{animation:shakeAnim .4s}
@keyframes shakeAnim{0%,100%{transform:translateX(0)}25%,75%{transform:translateX(-5px)}50%{transform:translateX(5px)}}
.ban-screen{display:none;background:var(--bg);position:fixed;inset:0;z-index:99999;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--red)}
.ban-screen i{font-size:60px;margin-bottom:20px}

.app-wrapper{display:none;width:100vw;height:100dvh;overflow:hidden}

/* Oynatıcı */
.player-section{background:#000;z-index:10;position:relative}
.video-container{width:100%;height:100%;background:#000;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.video-container video{width:100%;height:100%;object-fit:contain;z-index:1}
.player-top-bar{position:absolute;top:0;left:0;right:0;padding:16px 18px 30px;background:linear-gradient(rgba(0,0,0,.9),transparent);display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:22;transition:opacity .35s}
.pt-info{display:flex;align-items:center;gap:12px;min-width:0}
.pt-badge{background:rgba(229,9,20,.2);border:1px solid var(--red);color:var(--red);font-size:11px;font-weight:800;padding:3px 8px;border-radius:4px;display:flex;align-items:center;gap:5px;flex-shrink:0}
.pt-badge.movie{border-color:var(--gold);color:var(--gold);background:rgba(245,197,24,.15)}
.pt-title{font-size:15px;font-weight:700;text-shadow:0 2px 4px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt-actions{display:flex;gap:8px;flex-shrink:0}
.pt-btn{background:rgba(18,18,18,.7);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.15);color:#fff;width:36px;height:36px;border-radius:8px;cursor:pointer;font-size:14px;transition:.2s}
.pt-btn:hover{background:var(--red);border-color:var(--red)}
.custom-controls{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(to top,rgba(0,0,0,.95),transparent);display:flex;flex-direction:column;padding:40px 20px 14px;z-index:22;transition:opacity .35s}
.video-container.idle .player-top-bar,.video-container.idle .custom-controls{opacity:0;pointer-events:none}
.video-container.idle{cursor:none}
.progress-container{display:none;align-items:center;gap:12px;width:100%;margin-bottom:12px}
.time-text{font-size:12px;font-family:monospace;color:#ccc;min-width:45px;text-align:center}
.seek-bar{flex:1;-webkit-appearance:none;appearance:none;background:rgba(255,255,255,.2);height:5px;border-radius:5px;cursor:pointer}
.seek-bar::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--red);box-shadow:0 0 10px rgba(229,9,20,.6)}
.seek-bar::-moz-range-thumb{width:15px;height:15px;border:0;border-radius:50%;background:var(--red)}
.control-buttons{display:flex;justify-content:space-between;align-items:center}
.controls-left{display:flex;align-items:center;gap:16px}
.ctrl-btn{background:none;border:none;color:#fff;font-size:18px;cursor:pointer;transition:.2s;text-shadow:0 2px 4px #000}
.ctrl-btn:hover{color:var(--red);transform:scale(1.1)}
.ctrl-btn.play-btn{font-size:26px;width:30px}
.live-indicator{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:#eee}
.live-dot{width:10px;height:10px;border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red);animation:pulseDot 1.5s infinite}
@keyframes pulseDot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.85)}}
.volume-box{display:flex;align-items:center;gap:8px}
.vol-slider{width:70px;-webkit-appearance:none;appearance:none;background:rgba(255,255,255,.25);height:4px;border-radius:4px;cursor:pointer}
.vol-slider::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff}
.vol-slider::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:#fff}
.tap-zone{position:absolute;top:60px;bottom:90px;width:35%;z-index:10;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none}
.tap-left{left:0}.tap-right{right:0}
.video-container.embed .tap-zone{display:none}
.tap-indicator{background:rgba(0,0,0,.7);font-size:18px;font-weight:700;padding:12px 20px;border-radius:25px;display:flex;flex-direction:column;align-items:center;gap:4px;opacity:0;pointer-events:none}
.tap-indicator.show{animation:fadeTap .6s forwards}
@keyframes fadeTap{0%{opacity:1;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}100%{opacity:0}}
.auto-next-overlay{position:absolute;inset:0;background:rgba(0,0,0,.85);z-index:26;display:none;flex-direction:column;align-items:center;justify-content:center;backdrop-filter:blur(5px)}
.an-ring{width:55px;height:55px;position:relative;margin-bottom:18px;display:flex;align-items:center;justify-content:center}
.an-ring::before{content:"";position:absolute;inset:0;border:4px solid rgba(255,255,255,.1);border-top-color:var(--red);border-radius:50%;animation:spinR 1s linear infinite}
.an-count{font-size:20px;font-weight:700}
.an-title{font-size:14px;color:#aaa;margin-bottom:5px}
.an-name{font-size:20px;font-weight:800;max-width:80%;text-align:center}
.cancel-next-btn{margin-top:18px;background:transparent;border:1px solid #555;color:#ccc;padding:7px 18px;border-radius:20px;cursor:pointer;font-size:13px}
.cancel-next-btn:hover{background:#333;color:#fff}
.loading-spinner{position:absolute;top:50%;left:50%;margin:-25px 0 0 -25px;width:50px;height:50px;border:4px solid rgba(255,255,255,.1);border-top-color:var(--red);border-radius:50%;animation:spinR 1s linear infinite;z-index:15;display:none;pointer-events:none}
@keyframes spinR{to{transform:rotate(360deg)}}
.error-overlay{position:absolute;inset:0;background:rgba(0,0,0,.9);z-index:16;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.error-overlay i{font-size:45px;color:var(--red);margin-bottom:15px}
.fallback-msg{color:#bbb;font-size:14px;margin-top:5px}
.retry-btn{margin-top:14px;background:var(--red);border:none;color:#fff;padding:8px 20px;border-radius:20px;font-weight:700;cursor:pointer}

/* Liste */
.sidebar{display:flex;flex-direction:column;background:var(--card);overflow:hidden;flex:1;min-width:0}
.tab-container{display:flex;background:var(--bg);border-bottom:1px solid var(--line);flex-shrink:0}
.tab-btn{flex:1;padding:15px 0;background:transparent;border:none;color:var(--muted);font-size:13px;font-weight:700;letter-spacing:1px;cursor:pointer;transition:.3s;border-bottom:3px solid transparent}
.tab-btn.active{color:#fff;border-bottom-color:var(--red);background:rgba(255,255,255,.02)}
.search-container{padding:12px 15px;flex-shrink:0}
.search-box{display:flex;align-items:center;background:#1a1a1a;border:1px solid #333;border-radius:8px;padding:10px 14px;transition:.3s}
.search-box:focus-within{border-color:var(--red);box-shadow:0 0 10px rgba(229,9,20,.2)}
.search-box input{background:transparent;border:none;color:#fff;width:100%;margin-left:10px;font-size:13px}
.categories-bar{display:flex;overflow-x:auto;padding:0 15px 10px;gap:8px;border-bottom:1px solid var(--line);flex-shrink:0;scroll-behavior:smooth}
.cat-btn{background:#1a1a1a;color:#aaa;border:1px solid #333;padding:8px 16px;border-radius:20px;font-weight:600;font-size:12px;white-space:nowrap;cursor:pointer;transition:.2s}
.cat-btn:hover{border-color:#555;color:#fff}
.cat-btn.active{background:var(--red);color:#fff;border-color:var(--red)}
.content-area{flex:1;overflow-y:auto;padding:10px;-webkit-overflow-scrolling:touch}
.empty{color:var(--muted);text-align:center;padding:40px 20px;font-size:14px}
.channel-row{display:flex;align-items:center;padding:8px 12px;border-radius:8px;cursor:pointer;transition:.2s;margin-bottom:6px;border:1px solid transparent}
.channel-row:hover{background:rgba(255,255,255,.05)}
.channel-row.active-channel{background:rgba(229,9,20,.15);border-color:rgba(229,9,20,.3);border-left:4px solid var(--red)}
.channel-row img{width:45px;height:45px;object-fit:contain;background:#fff;border-radius:6px;padding:2px;margin-right:15px;flex-shrink:0}
.channel-row.movie-row img{width:40px;height:60px;object-fit:cover;background:#1a1a1a;padding:0;border-radius:4px;border:1px solid #333}
.channel-row-name{flex:1;min-width:0;font-weight:600;font-size:13px;color:#eee;display:flex;flex-direction:column;justify-content:center}
.row-rating{font-size:11px;color:var(--gold);margin-top:4px;font-weight:700}
.fav-icon{font-size:16px;color:#444;padding:8px;transition:.3s}
.fav-icon:hover{transform:scale(1.2)}
.fav-icon.active{color:var(--red);text-shadow:0 0 10px rgba(229,9,20,.5)}

@media(max-width:899px){
 .app-wrapper{flex-direction:column}
 .player-section{width:100%;flex-shrink:0;padding-top:env(safe-area-inset-top,0)}
 .video-container{aspect-ratio:16/9;height:auto}
 .sidebar{min-height:0}
 .vol-slider{display:none}
}
@media(min-width:900px){
 .app-wrapper{flex-direction:row}
 .player-section{width:55%;height:100dvh;flex-shrink:0;border-right:1px solid var(--line)}
 .sidebar{width:45%;height:100dvh;flex:none}
}
.sidebar{position:relative}
.movie-only{display:none}body.movie-mode .movie-only{display:inline-block}
.speed-btn{font-size:13px!important;font-weight:800;min-width:40px}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%) translateY(10px);background:rgba(20,20,20,.94);border:1px solid #333;padding:9px 16px;border-radius:20px;font-size:13px;z-index:30;opacity:0;pointer-events:none;transition:.25s;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.category-menu{position:absolute;inset:0;background:rgba(18,18,18,.98);z-index:40;display:flex;flex-direction:column;transform:translateY(100%);visibility:hidden;transition:transform .35s,visibility .35s}
.category-menu.open{transform:none;visibility:visible}
.cm-header{padding:14px 16px;border-bottom:1px solid #333;display:flex;align-items:center;gap:12px}
.cm-header h3{font-size:15px;white-space:nowrap}
.cm-search{flex:1;min-width:0;background:#1a1a1a;border:1px solid #333;border-radius:8px;color:#fff;padding:8px 12px;font-size:13px}
.cm-close{background:none;border:none;color:#fff;font-size:22px;cursor:pointer}
.cm-close:hover{color:var(--red)}
.cm-list{flex:1;overflow-y:auto;padding:15px;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;align-content:start}
.cm-item{background:#222;border:1px solid #333;padding:12px 8px;border-radius:8px;text-align:center;font-size:13px;font-weight:700;color:#ddd;cursor:pointer;display:flex;flex-direction:column;gap:4px;justify-content:center;min-height:58px;transition:.2s}
.cm-item small{color:var(--muted);font-weight:500}
.cm-item:hover,.cm-item.active{background:rgba(229,9,20,.2);border-color:var(--red);color:#fff}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* --- M3U ayrıştırma (tek, esnek) --- */
function parseM3U(content, arr, cats) {
  const seen = new Set(arr.map(x => x.url));
  let meta = null;
  for (let raw of content.split('\n')) {
    const line = raw.trim();
    if (!line || line.startsWith('#EXTM3U')) continue;
    if (line.startsWith('#EXTINF:')) {
      const group = (line.match(/group-title="([^"]*)"/) || [])[1] || 'Genel';
      const logo = (line.match(/tvg-logo="([^"]*)"/) || [])[1] || '';
      const comma = line.indexOf(',', line.lastIndexOf('"'));
      meta = { name: line.slice(comma + 1).trim() || 'İsimsiz', logo, group };
    } else if (/^https?:/i.test(line) && meta) {
      if (!seen.has(line)) { seen.add(line); arr.push({ ...meta, url: line }); cats.add(meta.group); }
      meta = null;
    }
  }
}

function initApp() {
  parseM3U(tvData, tvChannels, tvCategories);
  loadMovies();
  setupControls(); setupExtras();
  switchMode(store.get('ihs_mode', 'TV') === 'MOVIE' ? 'MOVIE' : 'TV');
}
function loadMovies() {
  moviesState = 'loading';
  fetch('https://raw.githubusercontent.com/gencalp27-gif/Crozyiptv/main/film.m3u', { cache: 'no-cache' })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(t => { parseM3U(t, movies, movieCategories); moviesState = 'ok'; if (currentMode === 'MOVIE') { renderCategories(); renderList(true); } })
    .catch(() => { moviesState = 'error'; if (currentMode === 'MOVIE') renderList(true); });
}
function showEmpty(area, dataset) {
  if (currentMode === 'MOVIE' && !dataset.length && moviesState === 'error') {
    area.innerHTML = '<div class="empty">Film listesi yüklenemedi.<br><br><button class="retry-btn" id="reload-movies">Tekrar dene</button></div>';
    $('reload-movies').onclick = () => { area.innerHTML = '<div class="empty">Yükleniyor…</div>'; loadMovies(); };
    return;
  }
  area.innerHTML = '<div class="empty">' + (currentCategory === 'Favorilerim' ? 'Henüz favori yok. Kalp simgesine dokun.' : dataset.length ? 'Sonuç bulunamadı.' : 'Liste yükleniyor…') + '</div>';
}

function switchMode(mode) {

  $('progress-container').style.display = movie ? 'flex' : 'none';
  $('live-indicator').style.display = movie ? 'none' : 'flex';

  $('txt-right').textContent = movie ? '+10 sn' : 'Sonraki';
  currentCategory = 'Tümü'; $('search-input').value = '';
  renderCategories(); renderList(true);
}

function renderCategories() {
  const bar = $('categories-bar'); bar.innerHTML = '';
  const add = (txt, o = {}) => {
    const b = document.createElement('button');
    const active = o.active !== undefined ? o.active : currentCategory === txt;
    b.className = 'cat-btn' + (active ? ' active' : '');
    if (o.icon) b.innerHTML = '<i class="fas ' + o.icon + '"></i> ';
    b.appendChild(document.createTextNode(txt));
    b.onclick = o.onclick || (() => { currentCategory = txt; $('search-input').value = ''; renderCategories(); renderList(true); });
    bar.appendChild(b);
  };
  add('Favorilerim', { icon: 'fa-heart' }); add('Tümü');
  if (currentMode === 'TV') [...tvCategories].sort(new Intl.Collator('tr').compare).forEach(c => add(c));
  else {
    add('Kategoriler', { icon: 'fa-list-ul', active: false, onclick: openCategoryMenu });
    if (currentCategory !== 'Tümü' && currentCategory !== 'Favorilerim') add(currentCategory);
  }
}
function openCategoryMenu() { $('cm-search').value = ''; fillCategoryMenu(); $('category-menu').classList.add('open'); }
function closeCategoryMenu() { $('category-menu').classList.remove('open'); }
function fillCategoryMenu() {
  const q = $('cm-search').value.toLocaleLowerCase('tr-TR');
  const counts = {}; movies.forEach(m => counts[m.group] = (counts[m.group] || 0) + 1);
  const list = $('cm-list'); list.innerHTML = '';
  [...movieCategories].filter(c => c.toLocaleLowerCase('tr-TR').includes(q)).sort(new Intl.Collator('tr').compare).forEach(cat => {
    const d = document.createElement('div');
    d.className = 'cm-item' + (currentCategory === cat ? ' active' : '');
    d.appendChild(document.createTextNode(cat));
    const sm = document.createElement('small'); sm.textContent = counts[cat] + ' film'; d.appendChild(sm);
    d.onclick = () => { currentCategory = cat; $('search-input').value = ''; renderCategories(); renderList(true); closeCategoryMenu(); };
    list.appendChild(d);
  });
  if (!list.children.length) list.innerHTML = '<div class="empty" style="grid-column:1/-1">Kategori bulunamadı.</div>';
}

function toggleFavorite(e, url) {
  e.stopPropagation();
  const i = favorites.indexOf(url);
  if (i > -1) favorites.splice(i, 1); else favorites.push(url);
  store.set('ihs_favorites', JSON.stringify(favorites));
  const icon = e.currentTarget, on = i === -1;
  icon.className = (on ? 'fas' : 'far') + ' fa-heart fav-icon' + (on ? ' active' : '');
  if (currentCategory === 'Favorilerim' && !on) renderList(true);
}

/* --- TMDB (sonuç movie nesnesinde saklanır) --- */
function applyMeta(movie, row) {
  if (movie.poster) { const img = row.querySelector('img'); if (img) img.src = movie.poster; }
  if (movie.rating && !row.querySelector('.row-rating')) {
    const d = document.createElement('div'); d.className = 'row-rating';
    d.innerHTML = '<i class="fas fa-star"></i> ' + movie.rating;
    row.querySelector('.channel-row-name').appendChild(d);
  }
}
function processTmdb() {
  if (fetchingTmdb || !tmdbQueue.length) return;
  fetchingTmdb = true;
  const { movie, row } = tmdbQueue.shift();
  const clean = movie.name.replace(/\(\d{4}\)/g, '').replace(/\[.*?\]/g, '').trim();
  fetch(`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_KEY}&query=${encodeURIComponent(clean)}&language=tr-TR`)
    .then(r => r.json())
    .then(d => {
      const it = d && d.results && d.results[0];
      if (it) {
        if (it.poster_path) movie.poster = 'https://image.tmdb.org/t/p/w200' + it.poster_path;
        if (it.vote_average) movie.rating = it.vote_average.toFixed(1);
        applyMeta(movie, row);
      }
    })
    .catch(() => {})
    .finally(() => { fetchingTmdb = false; setTimeout(processTmdb, 150); });
}
const movieObserver = new IntersectionObserver(entries => {
  entries.forEach(en => {
    if (!en.isIntersecting) return;
    const row = en.target, movie = movies[row.dataset.mi];
    movieObserver.unobserve(row);
    if (movie && !movie.fetched) { movie.fetched = true; tmdbQueue.push({ movie, row }); processTmdb(); }
  });
}, { rootMargin: '150px' });

function renderList(reset) {
  const area = $('content-area');
  const dataset = currentMode === 'TV' ? tvChannels : movies;
  if (reset) {
    renderCount = 0; area.innerHTML = ''; area.scrollTop = 0;
    const q = $('search-input').value.toLocaleLowerCase('tr-TR');
    let list = currentCategory === 'Favorilerim' ? dataset.filter(c => favorites.includes(c.url))
             : currentCategory === 'Tümü' ? dataset : dataset.filter(c => c.group === currentCategory);
    if (q) list = list.filter(c => c.name.toLocaleLowerCase('tr-TR').includes(q));
    currentDisplayList = list;
    if (!list.length) {
      showEmpty(area, dataset);
      return;
    }
  }
  const movie = currentMode === 'MOVIE', fb = movie ? fbMovie : fbTV;
  const end = Math.min(renderCount + CHUNK, currentDisplayList.length);
  const frag = document.createDocumentFragment();
  for (let i = renderCount; i < end; i++) {
    const c = currentDisplayList[i];
    const isFav = favorites.includes(c.url);
    const row = document.createElement('div');
    row.className = 'channel-row' + (movie ? ' movie-row' : '') + (activeItem === c ? ' active-channel' : '');
    row.dataset.idx = i;
    const img = document.createElement('img');
    img.loading = 'lazy'; img.alt = '';
    img.onerror = () => { img.onerror = null; img.src = fb; };
    img.src = c.poster || (/^(https?:|data:)/.test(c.logo) ? c.logo : fb);
    const name = document.createElement('div');
    name.className = 'channel-row-name'; name.textContent = c.name;
    const fav = document.createElement('i');
    fav.className = (isFav ? 'fas' : 'far') + ' fa-heart fav-icon' + (isFav ? ' active' : '');
    fav.onclick = e => toggleFavorite(e, c.url);
    row.append(img, name, fav);
    row.onclick = () => playStream(c);
    if (movie) { row.dataset.mi = c._i = c._i ?? movies.indexOf(c); applyMeta(c, row); if (!c.fetched) movieObserver.observe(row); }
    frag.appendChild(row);
  }
  area.appendChild(frag); renderCount = end;
}
$('content-area').addEventListener('scroll', e => {
  const el = e.target;
  if (renderCount < currentDisplayList.length && el.scrollTop + el.clientHeight >= el.scrollHeight - 300) renderList(false);
});

function updateActiveUI() {
  document.querySelectorAll('.channel-row').forEach(el => el.classList.toggle('active-channel', currentDisplayList[el.dataset.idx] === activeItem));
}

/* --- Kontroller --- */
function togglePlay() { if (video.paused) video.play().catch(() => {}); else video.pause(); }
function toast(m) { const el = $('toast'); el.textContent = m; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 3200); }
function mediaEnd() {
  if (isFinite(video.duration) && video.duration > 0) return video.duration;
  const r = video.seekable; return r && r.length ? r.end(r.length - 1) : 0;
}
function seekBy(d) { seekTo(video.currentTime + d); }
function seekVideo(d) { seekBy(d); }
function seekTo(t) {
  const end = mediaEnd();
  if (!activeItem || !end) { toast('Süre bilgisi henüz yüklenmedi'); return; }
  t = Math.max(0, Math.min(end - 1, t));
  video.currentTime = t;
  clearTimeout(seekTimer);
  seekTimer = setTimeout(() => checkSeek(t, 0), 2500);
}
// Sunucu "Range" desteklemiyorsa sarma geri atar: algıla, proxy ile yeniden dene
function checkSeek(t, tries) {
  if (!activeItem) return;
  const diff = video.currentTime - t;
  if (diff >= -3 && diff < 20) return;
  if (video.seeking && tries < 3) { seekTimer = setTimeout(() => checkSeek(t, tries + 1), 2500); return; }
  if (!activeItem._seekProxy && !usedProxy && !embedFor(activeItem.url)) {
    activeItem._seekProxy = true;
    toast('Sarma desteklenmiyor, yedek yol deneniyor…');
    playStream(activeItem, true, t);
  } else toast('Bu kaynak ileri/geri sarmayı desteklemiyor');
}
function animateTap(id) { const el = $(id); el.classList.remove('show'); void el.offsetWidth; el.classList.add('show'); }
function step(dir) {
  if (!currentDisplayList.length) return;
  const base = activeIndex > -1 ? activeIndex : (dir > 0 ? -1 : 0);
  const n = (base + dir + currentDisplayList.length) % currentDisplayList.length;
  playStream(currentDisplayList[n]);
}
function cancelAutoNext() { clearInterval(autoNextTimer); $('auto-next-overlay').style.display = 'none'; }
function toggleFullscreen() {
  if (document.fullscreenElement || document.webkitFullscreenElement) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); }
  else if (vContainer.requestFullscreen) vContainer.requestFullscreen().catch(() => {});
  else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen();
}

function setupControls() {
  const playBtn = $('play-pause-btn'), muteBtn = $('mute-btn'), vol = $('vol-slider'), seek = $('seek-bar');
  let seeking = false, lastSave = 0;

  playBtn.onclick = e => { e.stopPropagation(); togglePlay(); };
  $('prev-btn').onclick = () => step(-1);
  $('next-btn').onclick = () => step(1);
  $('b-cinema').onclick = () => document.body.classList.toggle('cinema-mode');
  $('b-full').onclick = toggleFullscreen;
  $('b-pip').onclick = () => { if (document.pictureInPictureElement) document.exitPictureInPicture(); else if (document.pictureInPictureEnabled) video.requestPictureInPicture().catch(() => {}); };
  $('b-cast').onclick = () => {
    if (video.remote && video.remote.state !== 'disconnected') video.remote.prompt().catch(() => {});
    else if (video.webkitShowPlaybackTargetPicker) video.webkitShowPlaybackTargetPicker();
    else alert('Bu tarayıcıda yansıtma desteklenmiyor.');
  };
  $('cancel-next').onclick = cancelAutoNext;
  $('retry-btn').onclick = () => activeItem && playStream(activeItem);

  video.addEventListener('play', () => playBtn.innerHTML = '<i class="fas fa-pause"></i>');
  video.addEventListener('pause', () => playBtn.innerHTML = '<i class="fas fa-play"></i>');
  video.addEventListener('playing', () => { spinner.style.display = 'none'; $('error-overlay').style.display = 'none'; });
  video.addEventListener('waiting', () => { if (activeItem) spinner.style.display = 'block'; });
  video.addEventListener('error', () => { if (activeItem && !hls) showError(); });

  const volIcon = () => {
    const i = video.muted || video.volume === 0 ? 'mute' : video.volume < .5 ? 'down' : 'up';
    muteBtn.innerHTML = `<i class="fas fa-volume-${i}"></i>`;
  };
  vol.oninput = e => { video.volume = +e.target.value; video.muted = video.volume === 0; volIcon(); };
  muteBtn.onclick = e => { e.stopPropagation(); video.muted = !video.muted; vol.value = video.muted ? 0 : video.volume; volIcon(); };

  video.addEventListener('loadedmetadata', () => {
    if (currentMode !== 'MOVIE' || !activeItem) return;
    let t = pendingStart; pendingStart = 0;
    if (!t) t = parseFloat(store.get('ihs_resume_' + activeItem.url));
    const end = mediaEnd();
    if (t && end && t < end - 10) video.currentTime = t;
  });
  video.addEventListener('timeupdate', () => {
    if (currentMode !== 'MOVIE' || !activeItem) return;
    const end = mediaEnd();
    if (end && +seek.max !== end) { seek.max = end; $('total-time').textContent = formatTime(end); }
    if (!seeking) seek.value = video.currentTime;
    $('current-time').textContent = formatTime(video.currentTime);
    const now = Date.now();
    if (video.currentTime > 5 && now - lastSave > 5000) { lastSave = now; store.set('ihs_resume_' + activeItem.url, video.currentTime); }
  });
  seek.addEventListener('input', () => { seeking = true; $('current-time').textContent = formatTime(+seek.value); });
  seek.addEventListener('change', () => { seeking = false; seekTo(+seek.value); });

  video.addEventListener('ended', () => {
    if (currentMode === 'MOVIE' && activeItem) store.set('ihs_resume_' + activeItem.url, 0);
    if (!currentDisplayList.length || activeIndex < 0) return;
    const nextItem = currentDisplayList[(activeIndex + 1) % currentDisplayList.length];
    $('an-name').textContent = nextItem.name;
    $('auto-next-overlay').style.display = 'flex';
    let n = 5; $('an-count').textContent = n;
    clearInterval(autoNextTimer);
    autoNextTimer = setInterval(() => {
      $('an-count').textContent = --n;
      if (n <= 0) { cancelAutoNext(); playStream(nextItem); }
    }, 1000);
  });

  // Dokunma bölgeleri: tek dokunuş oynat/durdur, çift dokunuş atla
  const zone = (id, ind, dir) => {
    let last = 0, timer = null;
    $(id).addEventListener('click', () => {
      const now = Date.now();
      if (now - last < 300) {
        clearTimeout(timer); last = 0;
        if (currentMode === 'MOVIE') seekVideo(10 * dir); else step(dir);
        animateTap(ind);
      } else { last = now; timer = setTimeout(togglePlay, 300); }
    });
  };
  zone('tap-left', 'ind-left', -1); zone('tap-right', 'ind-right', 1);
  video.onclick = togglePlay;

  let idleT;
  const wake = () => { vContainer.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => { if (!video.paused) vContainer.classList.add('idle'); }, 2500); };
  vContainer.addEventListener('mousemove', wake);
  vContainer.addEventListener('touchstart', wake, { passive: true });
  vContainer.addEventListener('mouseleave', () => { if (!video.paused) vContainer.classList.add('idle'); });

  document.addEventListener('keydown', e => {
    const tag = document.activeElement.tagName;
    if (tag === 'INPUT' || tag === 'BUTTON') return;
    const k = e.code;
    if (k === 'Space') { e.preventDefault(); togglePlay(); }
    else if (k === 'KeyF') { e.preventDefault(); toggleFullscreen(); }
    else if (k === 'ArrowLeft') { e.preventDefault(); currentMode === 'MOVIE' ? seekBy(e.shiftKey ? -30 : -10) : step(-1); }
    else if (k === 'ArrowRight') { e.preventDefault(); currentMode === 'MOVIE' ? seekBy(e.shiftKey ? 30 : 10) : step(1); }
    else if (k === 'ArrowUp' || k === 'ArrowDown') {
      e.preventDefault();
      video.volume = Math.max(0, Math.min(1, video.volume + (k === 'ArrowUp' ? .1 : -.1)));
      vol.value = video.volume; video.muted = false; volIcon();
    }
  });
}

function setupExtras() {
  $('back10').onclick = () => seekBy(-10);
  $('fwd10').onclick = () => seekBy(10);
  const speeds = [1, 1.25, 1.5, 2, 0.75];
  $('speed-btn').onclick = () => {
    const n = speeds[(speeds.indexOf(video.playbackRate) + 1) % speeds.length];
    video.playbackRate = n; $('speed-btn').textContent = n + 'x';
  };
  // Canlı yayın takılırsa 15 sn sonra otomatik yenile (en fazla 3 kez)
  let stallT = null;
  video.addEventListener('waiting', () => {
    if (!activeItem) return;
    clearTimeout(stallT);
    stallT = setTimeout(() => {
      if (video.paused || video.readyState >= 3) return;
      if (currentMode === 'TV' && stallN++ < 3) { toast('Bağlantı yenileniyor…'); playStream(activeItem, usedProxy); }
      else if (currentMode === 'MOVIE') toast('Bağlantı yavaş, tampon bekleniyor…');
    }, 15000);
  });
  video.addEventListener('playing', () => { clearTimeout(stallT); stallN = 0; });
  window.addEventListener('offline', () => toast('İnternet bağlantısı kesildi'));
  window.addEventListener('online', () => {
    toast('Bağlantı geri geldi');
    if (activeItem && $('error-overlay').style.display === 'flex') playStream(activeItem, usedProxy);
  });
  $('cm-close').onclick = closeCategoryMenu;
  $('cm-search').addEventListener('input', fillCategoryMenu);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCategoryMenu(); });
  if ('mediaSession' in navigator) {
    const set = (a, f) => { try { navigator.mediaSession.setActionHandler(a, f); } catch {} };
    set('play', () => video.play()); set('pause', () => video.pause());
    set('previoustrack', () => step(-1)); set('nexttrack', () => step(1));
    set('seekbackward', () => { if (currentMode === 'MOVIE') seekBy(-10); });
    set('seekforward', () => { if (currentMode === 'MOVIE') seekBy(10); });
  }
}

/* --- Oynatma --- */
function showError() { spinner.style.display = 'none'; $('error-overlay').style.display = 'flex'; }
function stopPlayback() {
  cancelAutoNext();
  if (hls) { hls.destroy(); hls = null; }
  const f = $('ihs-iframe'); if (f) f.remove();
  video.pause(); video.removeAttribute('src'); video.load();
  video.playbackRate = 1; $('speed-btn').textContent = '1x';
  vContainer.classList.remove('embed');
  video.style.display = 'block'; $('custom-controls').style.display = 'flex';
  spinner.style.display = 'none'; $('error-overlay').style.display = 'none';
}

function embedFor(url) {
  let m;
  if (url.includes('ok.ru/video/')) return 'https://ok.ru/videoembed/' + url.split('/video/')[1].split('?')[0];
  if ((m = url.match(/youtube\.com\/watch\?v=([^&]+)/)) || (m = url.match(/youtu\.be\/([^?]+)/))) return 'https://www.youtube.com/embed/' + m[1];
  if (url.includes('vixolity.com/vs/') || url.includes('/embed/') || url.includes('player.php')) return url;
  return null;
}
const viaProxy = u => PROXY_BASE + encodeURIComponent(u);

function playStream(item, forceProxy, startAt) {
  usedProxy = !!forceProxy; pendingStart = startAt || 0;
  stopPlayback();
  if (item !== activeItem) stallN = 0;
  activeItem = item; activeIndex = currentDisplayList.indexOf(item);
  $('pt-title').textContent = item.name;
  if ('mediaSession' in navigator && window.MediaMetadata) navigator.mediaSession.metadata = new MediaMetadata({ title: item.name, artist: 'IHS TV' });
  spinner.style.display = 'block';
  updateActiveUI();

  const embed = embedFor(item.url);
  if (embed) {
    vContainer.classList.add('embed');
    video.style.display = 'none'; $('custom-controls').style.display = 'none';
    const f = document.createElement('iframe');
    f.id = 'ihs-iframe';
    f.src = embed + (embed.includes('?') ? '&' : '?') + 'autoplay=1';
    f.allow = 'autoplay; encrypted-media; fullscreen; picture-in-picture';
    f.allowFullscreen = true;
    f.style.cssText = 'width:100%;height:100%;border:0;position:absolute;inset:0;z-index:5';
    vContainer.appendChild(f);
    spinner.style.display = 'none';
    return;
  }

  // https sayfada http kaynak engellenir: otomatik proxy
  let src = item.url;
  if (location.protocol === 'https:' && src.startsWith('http:')) { src = viaProxy(src); usedProxy = true; }
  if (forceProxy && !src.startsWith(PROXY_BASE)) src = viaProxy(item.url);

  const isHls = /\.m3u8|\.ts(\?|$)/.test(item.url) || currentMode === 'TV';
  if (isHls && window.Hls && Hls.isSupported()) {
    let netRetries = 0, mediaRetries = 0;
    hls = new Hls({ enableWorker: true, lowLatencyMode: false });
    hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
    hls.on(Hls.Events.ERROR, (_, d) => {
      if (!d.fatal) return;
      if (d.type === Hls.ErrorTypes.NETWORK_ERROR) {
        if (netRetries++ < 2) { hls.startLoad(); return; }
        if (!usedProxy) { playStream(item, true); return; }   // CORS ise proxy ile bir kez daha dene
      } else if (d.type === Hls.ErrorTypes.MEDIA_ERROR && mediaRetries++ < 2) { hls.recoverMediaError(); return; }
      showError();
    });
    hls.loadSource(src);
    hls.attachMedia(video);
  } else {
    video.src = src;   // mp4 veya iOS'un yerel HLS desteği
    video.play().catch(() => {});
  }
}

function formatTime(s) {
  if (!isFinite(s)) return '0:00';
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = Math.floor(s % 60);
  const p = n => String(n).padStart(2, '0');
  return h ? `${h}:${p(m)}:${p(sec)}` : `${m}:${p(sec)}`;
}
</script>
</body>
