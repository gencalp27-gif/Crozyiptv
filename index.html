<!DOCTYPE html>
<html lang="tr" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>IHS TV - ULTIMATE</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-main: #000000; 
      --bg-card: #121212;
      --ihs-red: #e50914;
      --text-main: #ffffff; 
      --text-muted: #888888;
      --border-color: #262626;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; outline: none; -webkit-tap-highlight-color: transparent; }
    
    body {
      background-color: var(--bg-main); color: var(--text-main);
      font-family: system-ui, -apple-system, sans-serif; 
      height: 100vh; overflow: hidden; 
    }

    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg-main); }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--ihs-red); }

    /* GÜVENLİK VE BAN EKRANI */
    .security-screen, .ban-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg-main); z-index: 99999; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
    }
    .ban-screen { display: none; background: #050505; }
    .security-logo {
      width: 70px; height: 70px; background: linear-gradient(135deg, #ff4b4b, #8b0000);
      transform: rotate(45deg); box-shadow: 0 0 20px rgba(229, 9, 20, 0.5);
      border: 2px solid #ff7a7a; margin-bottom: 40px;
    }
    .security-title { font-size: 22px; font-weight: 900; letter-spacing: 3px; margin-bottom: 25px; }
    .password-input {
      background: var(--bg-card); border: 1px solid #333; border-radius: 8px;
      color: white; padding: 12px 20px; font-size: 16px; width: 250px; text-align: center;
      margin-bottom: 15px; letter-spacing: 2px;
    }
    .password-input:focus { border-color: var(--ihs-red); }
    .login-btn {
      background: var(--ihs-red); color: white; border: none; padding: 12px 40px;
      border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.2s;
    }
    .login-btn:active { transform: scale(0.95); }
    .error-msg { color: var(--ihs-red); font-size: 13px; font-weight: bold; margin-top: 15px; display: none; }
    .ban-screen i { font-size: 70px; color: var(--ihs-red); margin-bottom: 20px; }
    .ban-screen h1 { color: #fff; font-size: 24px; letter-spacing: 2px; margin-bottom: 10px;}
    .ban-screen p { color: var(--text-muted); font-size: 14px; }

    /* ANA UYGULAMA */
    .app-wrapper { display: none; height: 100vh; flex-direction: column; }

    /* OYNATICI VE OSD */
    .player-section { background: var(--bg-main); z-index: 10; display: flex; flex-direction: column; position: relative;}
    .video-container { width: 100%; background: #000; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .video-container video { width: 100%; height: 100%; object-fit: contain; display: block; cursor: pointer; }

    /* TV Zapping OSD (Ekranda Beliren Kanal Bilgisi) */
    .tv-osd {
      position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.8);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 15px 20px;
      display: flex; align-items: center; gap: 15px; z-index: 30;
      opacity: 0; transform: translateX(-20px); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
    }
    .tv-osd.show { opacity: 1; transform: translateX(0); }
    .osd-logo { width: 50px; height: 50px; background: #fff; padding: 3px; border-radius: 8px; object-fit: contain; }
    .osd-info h2 { font-size: 22px; margin: 0 0 5px 0; color: #fff; text-shadow: 2px 2px 4px #000;}
    .osd-info span { font-size: 12px; font-weight: bold; color: var(--ihs-red); background: rgba(229,9,20,0.1); padding: 3px 8px; border-radius: 4px; border: 1px solid rgba(229,9,20,0.3); }

    /* VİDEO İÇİ KANAL MENÜSÜ (YENİ EKLENDİ) */
    .video-channel-menu {
      position: absolute; top: 0; right: -320px; width: 300px; height: 100%;
      background: rgba(10, 10, 10, 0.95); z-index: 25; padding: 15px;
      display: flex; flex-direction: column; transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border-left: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(5px);
    }
    .video-channel-menu.open { right: 0; }
    .vcm-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 10px; }
    .vcm-header h3 { font-size: 16px; margin: 0; color: #fff; display: flex; align-items: center; gap: 10px;}
    .vcm-close { background: none; border: none; color: #fff; cursor: pointer; font-size: 20px; transition: 0.2s; }
    .vcm-close:hover { color: var(--ihs-red); transform: scale(1.1); }
    
    .vcm-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding-right: 5px; }
    .vcm-list::-webkit-scrollbar { width: 4px; }
    .vcm-list .channel-row { background: rgba(255,255,255,0.03); border: 1px solid transparent; border-radius: 8px; padding: 8px 10px; }
    .vcm-list .channel-row:hover { background: rgba(255,255,255,0.1); border-color: #444; }
    .vcm-list .channel-row.active-channel { background: rgba(229, 9, 20, 0.25); border-left: 3px solid var(--ihs-red); border-radius: 4px; }
    .vcm-list img { width: 35px; height: 35px; object-fit: contain; margin-right: 12px; border-radius: 4px; background: #fff; padding: 2px; }
    .vcm-list .channel-row-name { font-size: 13px; font-weight: 600; color: #ddd; }

    /* Video Hata ve Yükleme */
    .loading-spinner {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.2);
      border-top-color: var(--ihs-red); border-radius: 50%;
      animation: spin 1s linear infinite; z-index: 15; display: none;
    }
    @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
    
    .error-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); z-index: 16; display: none; 
      flex-direction: column; align-items: center; justify-content: center; text-align: center;
    }
    .error-overlay i { font-size: 45px; color: var(--ihs-red); margin-bottom: 15px; }
    .error-overlay p { color: #fff; font-weight: bold; font-size: 16px; margin-bottom: 8px;}
    .error-overlay span { color: var(--text-muted); font-size: 13px; }

    /* Özel Kontroller */
    .custom-controls {
      position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
      display: flex; align-items: center; justify-content: space-between; padding: 25px 20px 15px 20px; z-index: 20; opacity: 1; transition: opacity 0.4s ease;
    }
    .video-container.idle .custom-controls { opacity: 0; pointer-events: none; }
    /* Menu açıkken kontroller kaybolmasın */
    .video-container.menu-open .custom-controls { opacity: 1; pointer-events: auto; }

    .controls-left, .controls-right { display: flex; align-items: center; gap: 20px; }
    .control-btn { background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; transition: 0.2s; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
    .control-btn:hover { color: var(--ihs-red); transform: scale(1.1); }
    .control-btn.play-btn { font-size: 24px; }

    .now-playing-bar { display: none; padding: 10px 15px; align-items: center; gap: 12px; background: #0a0a0a; border-bottom: 1px solid var(--border-color); }
    .now-playing-logo { width: 35px; height: 35px; border-radius: 6px; background: #fff; padding: 2px; object-fit: contain; }
    .now-playing-info { flex: 1; }
    .now-playing-title { font-weight: 700; font-size: 14px; margin-bottom: 2px; }
    .live-badge { font-size: 10px; font-weight: bold; color: var(--ihs-red); display: flex; align-items: center; gap: 4px; }
    .live-dot { width: 6px; height: 6px; background: var(--ihs-red); border-radius: 50%; animation: pulse 1.5s infinite; }

    /* YAN MENÜ VE LİSTE */
    .sidebar-section { display: flex; flex-direction: column; background: var(--bg-main); overflow: hidden; flex:1;}
    .search-container { padding: 10px 15px; background: var(--bg-main); }
    .search-box { display: flex; align-items: center; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 6px; padding: 8px 12px; }
    .search-box input { background: transparent; border: none; color: white; width: 100%; margin-left: 10px; font-size: 13px; }

    .categories-bar { display: flex; overflow-x: auto; padding: 0 15px 10px 15px; gap: 6px; border-bottom: 1px solid var(--border-color); -webkit-overflow-scrolling: touch; }
    .cat-btn { background: var(--bg-card); color: var(--text-muted); border: 1px solid var(--border-color); padding: 6px 12px; border-radius: 15px; font-weight: 600; font-size: 12px; white-space: nowrap; cursor: pointer; }
    .cat-btn.active { background: var(--ihs-red); color: #fff; border-color: var(--ihs-red); }
    .cat-btn-fav { color: #ffeb3b; border-color: #333; }
    .cat-btn-fav.active { background: #ffeb3b; color: #000; border-color: #ffeb3b; }

    .channel-list { flex: 1; overflow-y: auto; padding: 5px 10px; display: flex; flex-direction: column; gap: 4px; -webkit-overflow-scrolling: touch; }
    .channel-row { display: flex; align-items: center; background: transparent; padding: 6px 10px; border-radius: 6px; cursor: pointer; transition: 0.1s; }
    .channel-row.active-channel { background: rgba(229, 9, 20, 0.2); border-left: 3px solid var(--ihs-red); }
    .channel-row:hover { background: rgba(255,255,255,0.05); }
    .channel-row img { width: 32px; height: 32px; object-fit: contain; background: #fff; border-radius: 4px; padding: 2px; margin-right: 12px; }
    .channel-row-name { flex: 1; font-weight: 500; font-size: 13px; color: #ddd; }
    .fav-icon { font-size: 15px; color: #333; padding: 8px; }
    .fav-icon.active { color: var(--ihs-red); }

    @media (max-width: 899px) {
      .player-section { flex-shrink: 0; box-shadow: 0 4px 10px rgba(0,0,0,0.5); border-bottom: 1px solid #222;}
      .video-container { aspect-ratio: 16/9; }
      .tv-osd { top: 10px; left: 10px; padding: 10px; }
      .osd-logo { width: 35px; height: 35px; }
      .osd-info h2 { font-size: 16px; }
      .video-channel-menu { width: 240px; right: -260px; }
    }
    @media (min-width: 900px) {
      .app-wrapper { flex-direction: row; }
      .player-section { flex: 1; border-right: 1px solid var(--border-color); }
      .video-container { flex: 1; overflow: hidden; background: #000; }
      .sidebar-section { width: 350px; flex-shrink: 0; }
    }
  </style>
</head>
<body>

  <!-- BAN & GÜVENLİK EKRANI -->
  <div class="ban-screen" id="ban-screen">
    <i class="fas fa-ban"></i>
    <h1>ERİŞİM ENGELLENDİ</h1>
    <p>Güvenlik ihlali sebebiyle bu cihaz engellendi.</p>
  </div>
  <div class="security-screen" id="security-screen">
    <div class="security-logo"></div>
    <div class="security-title">IHS PRIVATE</div>
    <input type="password" id="pass-input" class="password-input" placeholder="Şifrenizi Girin">
    <button class="login-btn" onclick="checkPassword()">GİRİŞ YAP</button>
    <div class="error-msg" id="error-msg"></div>
  </div>

  <!-- ANA UYGULAMA -->
  <div class="app-wrapper" id="app-wrapper">
    <div class="player-section">
      <div class="video-container" id="video-container">
        
        <!-- VİDEO İÇİ KANAL MENÜSÜ -->
        <div class="video-channel-menu" id="video-channel-menu">
          <div class="vcm-header">
            <h3><i class="fas fa-list-ul"></i> Kanallar</h3>
            <button class="vcm-close" id="vcm-close-btn"><i class="fas fa-times"></i></button>
          </div>
          <div class="vcm-list" id="vcm-list"></div>
        </div>

        <!-- TV ZAPPING OSD -->
        <div class="tv-osd" id="tv-osd">
          <img id="osd-logo" class="osd-logo" src="" alt="logo">
          <div class="osd-info">
            <h2 id="osd-title">Kanal</h2>
            <span><i class="fas fa-circle" style="font-size: 8px;"></i> CANLI</span>
          </div>
        </div>

        <div class="loading-spinner" id="loading-spinner"></div>
        <div class="error-overlay" id="error-overlay">
          <i class="fas fa-exclamation-triangle"></i>
          <p>Yayın Bağlantısı Koptu</p>
          <span id="error-countdown">Sonraki kanala geçiliyor... (3)</span>
        </div>

        <video id="video-player" playsinline></video>
        <div class="custom-controls" id="custom-controls">
          <div class="controls-left">
            <button class="control-btn play-btn" id="play-pause-btn"><i class="fas fa-play"></i></button>
            <button class="control-btn" id="mute-btn"><i class="fas fa-volume-up"></i></button>
            <!-- LİSTE AÇMA BUTONU -->
            <button class="control-btn" id="channel-menu-btn" title="Kanal Listesi" style="margin-left: 10px;"><i class="fas fa-list-ul"></i></button>
          </div>
          <div class="controls-right">
            <button class="control-btn" id="pip-btn"><i class="fas fa-clone"></i></button>
            <button class="control-btn" id="fullscreen-btn"><i class="fas fa-expand"></i></button>
          </div>
        </div>
      </div>
      
      <div class="now-playing-bar" id="now-playing-bar">
        <img id="np-logo" class="now-playing-logo" src="" alt="logo">
        <div class="now-playing-info">
          <div class="now-playing-title" id="np-title">-</div>
          <div class="live-badge"><div class="live-dot"></div> CANLI YAYIN</div>
        </div>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="search-container">
        <div class="search-box">
          <i class="fas fa-search" style="color: var(--text-muted);"></i>
          <input type="text" id="search-input" placeholder="Kanal ara..." oninput="searchChannels()">
        </div>
      </div>
      <div class="categories-bar" id="categories-bar"></div>
      <div class="channel-list" id="channel-list"></div>
    </div>
  </div>

<script>
// =========================================
// 1. GÜVENLİK SİSTEMİ
// =========================================
const GECERLI_SIFRE = "ihspro"; 
let hataliGirisSayisi = parseInt(localStorage.getItem('ihs_hata') || '0');
const isBanned = localStorage.getItem('ihs_banned') === 'true';

window.addEventListener('DOMContentLoaded', () => {
  if (isBanned) {
    document.getElementById('security-screen').style.display = 'none';
    document.getElementById('ban-screen').style.display = 'flex';
  }
});
document.getElementById("pass-input").addEventListener("keypress", (e) => { if (e.key === "Enter") checkPassword(); });

function checkPassword() {
  if (isBanned) return;
  const girilenSifre = document.getElementById('pass-input').value;
  const errorText = document.getElementById('error-msg');

  if (girilenSifre === GECERLI_SIFRE) {
    localStorage.setItem('ihs_hata', '0');
    document.getElementById('security-screen').style.display = 'none';
    document.getElementById('app-wrapper').style.display = 'flex';
    initIptvApp(); 
  } else {
    hataliGirisSayisi++; localStorage.setItem('ihs_hata', hataliGirisSayisi.toString());
    if (hataliGirisSayisi >= 2) {
      localStorage.setItem('ihs_banned', 'true');
      document.getElementById('security-screen').style.display = 'none'; document.getElementById('ban-screen').style.display = 'flex';
    } else {
      errorText.innerText = "Hatalı şifre! Son 1 hakkınız kaldı."; errorText.style.display = 'block';
    }
  }
}

// =========================================
// 2. IPTV MOTORU & OSD & AUTO-SKIP
// =========================================
let allChannels = []; let categories = new Set(); let currentCategory = 'Tüm Kanallar';
let activeChannelIndex = -1; let currentDisplayList = [];
let hls = null; let favorites = JSON.parse(localStorage.getItem('ihs_favorites')) || [];
const video = document.getElementById('video-player');
let osdTimeout; let skipTimeout;

const gomuluListe = `
#EXTM3U

https://hls.4utv.live/hls/stream.m3u8

https://turkmedya-live.ercdn.net/tv24/tv24.m3u8

https://turkmedya-live.ercdn.net/tv360/tv360.m3u8

https://rnttwmjcin.turknet.ercdn.net/lcpmvefbyo/ahaber/ahaber.m3u8
#EXTINF:-1 tvg-logo="https://i.imgur.com/ZhkZzLf.png" group-title="Turkey",A Spor
https://rnttwmjcin.turknet.ercdn.net/lcpmvefbyo/aspor/aspor.m3u8
#EXTINF:-1 tvg-logo="https://i.imgur.com/mgDCKiy.png" group-title="Turkey",Aksu TV
https://live.artidijitalmedya.com/artidijital_aksutv/aksutv/playlist.m3u8
#EXTINF:-1 tvg-logo="https://i.imgur.com/HyVUwFC.png" group-title="Turkey",ATV
https://rnttwmjcin.turknet.ercdn.net/lcpmvefbyo/atv/atv_1080p.m3u8
#EXTINF:-1 tvg-logo="https://upload.wikimedia.org/wikipedia/commons/thumb/4/43/Diyanet_TV_logo.svg/960px-Diyanet_TV_logo.svg.png" group-title="Turkey",Diyanet TV
https://eustr73.mediatriple.net/videoonlylive/mtikoimxnztxlive/broadcast_5e3bf95a47e07.smil/playlist.m3u8
#EXTINF:-1 tvg-logo="https://www.dsmart.com.tr/epg/images/0x60/5ffc18c6cfef0b15933a8b65" group-title="Turkey",Ekoturk
https://cdn.ekoturk.net/hls/master.m3u8
#EXTINF:-1 tvg-logo="https://upload.wikimedia.org/wikipedia/commons/thumb/e/ef/GZT_logo.svg/960px-GZT_logo.svg.png" group-title="Turkey",GZT
https://gzttv-live.lg.mncdn.com/gzttv/gzttv/playlist.m3u8
#EXTINF:-1 tvg-logo="https://i.imgur.com/xM0HA30.png" group-title="Turkey",Halk TV
https://halktv-live.daioncdn.net/halktv/halktv.m3u8
#EXTINF:-1 tvg-logo="https://www.htspor.com/images/manifest/social-share-logo.png" group-title="Turkey",HTSpor
https://ciner.daioncdn.net/ht-spor/ht-spor.m3u8?app=web

https://demiroren.daioncdn.net/kanald/kanald.m3u8?app=kanald_web&ce=3

https://uycyyuuzyh.turknet.ercdn.net/nphindgytw/nowtv/nowtv.m3u8

https://dogus.daioncdn.net/ntv/ntv.m3u8?app=ntv_web

https://tv-trt1.medya.trt.com.tr/master.m3u8
#EXTINF:-1 tvg-logo="https://upload.wikimedia.org/wikipedia/commons/thumb/7/72/TRT_Haber_Eyl%C3%BCl_2020_Logo.svg/960px-TRT_Haber_Eyl%C3%BCl_2020_Logo.svg.png" group-title="Turkey",TRT Haber
https://tv-trthaber.medya.trt.com.tr/master.m3u8
`;

function initIptvApp() {
  const lines = gomuluListe.split('\n');
  let currentChannel = {};
  for (let i = 0; i < lines.length; i++) {
    let line = lines[i].trim();
    if (!line) continue;
    if (line.startsWith('#EXTINF:')) {
      const logo = (line.match(/tvg-logo="([^"]+)"/) || [])[1] || 'https://via.placeholder.com/150?text=TV';
      const group = (line.match(/group-title="([^"]+)"/) || [])[1] || 'Diğer';
      currentChannel = { id: i, name: line.split(',').pop().trim(), logo, group };
      categories.add(group);
    } else if (line.startsWith('http')) {
      currentChannel.url = line;
      allChannels.push(currentChannel);
    }
  }
  renderCategories(); renderChannels(); initPlayerControls(); initKeyboardControls();
}

function renderCategories() {
  const bar = document.getElementById('categories-bar'); bar.innerHTML = '';
  const fragment = document.createDocumentFragment();
  
  const createBtn = (txt, icon, catName, isFav) => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn' + (isFav ? ' cat-btn-fav' : '') + (currentCategory===catName ? ' active' : '');
    btn.innerHTML = icon ? `<i class="fas ${icon}"></i> ${txt}` : txt;
    btn.onclick = () => { currentCategory = catName; document.getElementById('search-input').value = ''; renderCategories(); renderChannels(); };
    fragment.appendChild(btn);
  };
  createBtn('Favoriler', 'fa-heart', 'Favorilerim', true);
  createBtn('Tüm Kanallar', null, 'Tüm Kanallar', false);
  categories.forEach(cat => createBtn(cat, null, cat, false));
  bar.appendChild(fragment);
}

function toggleFavorite(e, channelName) {
  e.stopPropagation(); 
  const index = favorites.indexOf(channelName);
  if (index > -1) favorites.splice(index, 1); else favorites.push(channelName);
  localStorage.setItem('ihs_favorites', JSON.stringify(favorites));
  renderChannels(document.getElementById('search-input').value.toLowerCase()); 
}

function searchChannels() { renderChannels(document.getElementById('search-input').value.toLowerCase()); }

function renderChannels(searchQuery = '') {
  const list = document.getElementById('channel-list'); list.innerHTML = '';
  
  currentDisplayList = currentCategory === 'Favorilerim' ? allChannels.filter(c => favorites.includes(c.name)) 
               : currentCategory === 'Tüm Kanallar' ? allChannels : allChannels.filter(c => c.group === currentCategory);
  if (searchQuery) currentDisplayList = currentDisplayList.filter(c => c.name.toLowerCase().includes(searchQuery));
  
  const fragment = document.createDocumentFragment();
  currentDisplayList.forEach((c, index) => {
    const isFav = favorites.includes(c.name);
    const isActive = (activeChannelIndex === index);
    const row = document.createElement('div');
    row.className = 'channel-row' + (isActive ? ' active-channel' : '');
    row.innerHTML = `<img src="${c.logo}" loading="lazy" onerror="this.src='https://via.placeholder.com/150?text=TV'">
                     <div class="channel-row-name">${c.name}</div>
                     <i class="${isFav ? 'fas' : 'far'} fa-heart fav-icon ${isFav ? 'active' : ''}" onclick="toggleFavorite(event, '${c.name.replace(/'/g, "\\'")}')"></i>`;
    row.onclick = () => playStream(c, index);
    fragment.appendChild(row);
  });
  list.appendChild(fragment);
  
  // VCM (Video İçin Menü) listesini de güncelle
  populateVideoChannelMenu();
}

function playStream(channelObj, indexInList) {
  activeChannelIndex = indexInList;
  renderChannels(document.getElementById('search-input').value.toLowerCase()); 
  
  clearTimeout(skipTimeout);
  document.getElementById('error-overlay').style.display = 'none';
  document.getElementById('loading-spinner').style.display = 'block';
  
  document.getElementById('now-playing-bar').style.display = 'flex';
  document.getElementById('np-logo').src = channelObj.logo;
  document.getElementById('np-title').innerText = channelObj.name;

  showOSD(channelObj.name, channelObj.logo);

  if (hls) hls.destroy();
  if (Hls.isSupported() && channelObj.url.includes('.m3u8')) {
    hls = new Hls({enableWorker: true, lowLatencyMode: true});
    
    hls.on(Hls.Events.ERROR, function (event, data) {
      if (data.fatal) {
        document.getElementById('loading-spinner').style.display = 'none';
        document.getElementById('error-overlay').style.display = 'flex';
        let countdown = 3;
        document.getElementById('error-countdown').innerText = `Sonraki kanala geçiliyor... (${countdown})`;
        skipTimeout = setInterval(() => {
          countdown--;
          document.getElementById('error-countdown').innerText = `Sonraki kanala geçiliyor... (${countdown})`;
          if(countdown <= 0) { clearInterval(skipTimeout); playNextChannel(); }
        }, 1000);
      }
    });

    hls.loadSource(channelObj.url); hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, function() { video.play(); document.getElementById('loading-spinner').style.display = 'none';});
  } else { 
    video.src = channelObj.url; video.play(); 
    document.getElementById('loading-spinner').style.display = 'none';
  }
}

function playNextChannel() {
  if(currentDisplayList.length === 0) return;
  let nextIdx = activeChannelIndex + 1;
  if (nextIdx >= currentDisplayList.length) nextIdx = 0; 
  playStream(currentDisplayList[nextIdx], nextIdx);
}
function playPrevChannel() {
  if(currentDisplayList.length === 0) return;
  let prevIdx = activeChannelIndex - 1;
  if (prevIdx < 0) prevIdx = currentDisplayList.length - 1; 
  playStream(currentDisplayList[prevIdx], prevIdx);
}

function showOSD(name, logo) {
  const osd = document.getElementById('tv-osd');
  document.getElementById('osd-logo').src = logo;
  document.getElementById('osd-title').innerText = name;
  osd.classList.add('show');
  clearTimeout(osdTimeout);
  osdTimeout = setTimeout(() => { osd.classList.remove('show'); }, 3000);
}

function initKeyboardControls() {
  document.addEventListener('keydown', (e) => {
    if(document.activeElement.tagName === 'INPUT') return; 
    switch(e.code) {
      case 'Space': e.preventDefault(); if (video.paused) video.play(); else video.pause(); break;
      case 'KeyF': e.preventDefault(); document.getElementById('fullscreen-btn').click(); break;
      case 'KeyM': e.preventDefault(); document.getElementById('mute-btn').click(); break;
      case 'ArrowUp': e.preventDefault(); playPrevChannel(); break;
      case 'ArrowDown': e.preventDefault(); playNextChannel(); break;
    }
  });
}

// =========================================
// VİDEO İÇİ KANAL MENÜSÜ FONKSİYONLARI
// =========================================
const vcmMenu = document.getElementById('video-channel-menu');
const vContainer = document.getElementById('video-container');

document.getElementById('channel-menu-btn').onclick = (e) => {
  e.stopPropagation(); // Videonun durmasını engelle
  populateVideoChannelMenu();
  vcmMenu.classList.add('open');
  vContainer.classList.add('menu-open'); // Kontrollerin kaybolmasını engelle
};

document.getElementById('vcm-close-btn').onclick = (e) => {
  e.stopPropagation();
  vcmMenu.classList.remove('open');
  vContainer.classList.remove('menu-open');
};

function populateVideoChannelMenu() {
  const vList = document.getElementById('vcm-list');
  vList.innerHTML = '';
  const fragment = document.createDocumentFragment();
  
  currentDisplayList.forEach((c, index) => {
    const isActive = (activeChannelIndex === index);
    const row = document.createElement('div');
    row.className = 'channel-row' + (isActive ? ' active-channel' : '');
    row.innerHTML = `
      <img src="${c.logo}" loading="lazy" onerror="this.src='https://via.placeholder.com/150?text=TV'">
      <div class="channel-row-name">${c.name}</div>
    `;
    row.onclick = (e) => { 
      e.stopPropagation();
      playStream(c, index); 
      vcmMenu.classList.remove('open'); 
      vContainer.classList.remove('menu-open');
    };
    fragment.appendChild(row);
  });
  vList.appendChild(fragment);
}


function initPlayerControls() {
  const playBtn = document.getElementById('play-pause-btn');
  const muteBtn = document.getElementById('mute-btn');
  const fsBtn = document.getElementById('fullscreen-btn');
  const pipBtn = document.getElementById('pip-btn');

  if (!document.pictureInPictureEnabled) pipBtn.style.display = 'none';

  function togglePlay(e) {
    // Eğer video içi menü açıksa videoya tıklandığında menüyü kapat
    if (vcmMenu.classList.contains('open')) {
      vcmMenu.classList.remove('open');
      vContainer.classList.remove('menu-open');
      return;
    }
    if (video.paused) video.play(); else video.pause(); 
  }
  playBtn.onclick = (e) => { e.stopPropagation(); togglePlay(); };
  video.onclick = togglePlay;

  muteBtn.onclick = (e) => { e.stopPropagation(); video.muted = !video.muted; muteBtn.innerHTML = video.muted ? '<i class="fas fa-volume-mute"></i>' : '<i class="fas fa-volume-up"></i>'; };

  fsBtn.onclick = (e) => {
    e.stopPropagation();
    if (!document.fullscreenElement) { if (vContainer.requestFullscreen) vContainer.requestFullscreen(); else if (vContainer.webkitRequestFullscreen) vContainer.webkitRequestFullscreen(); } 
    else { if (document.exitFullscreen) document.exitFullscreen(); else if (document.webkitExitFullscreen) document.webkitExitFullscreen(); }
  };
  video.ondblclick = fsBtn.onclick;

  pipBtn.onclick = async (e) => { e.stopPropagation(); try { if (document.pictureInPictureElement) await document.exitPictureInPicture(); else await video.requestPictureInPicture(); } catch (err) {} };

  video.addEventListener('play', () => { playBtn.innerHTML = '<i class="fas fa-pause"></i>'; });
  video.addEventListener('pause', () => { playBtn.innerHTML = '<i class="fas fa-play"></i>'; });

  let timeout;
  function resetControls() {
    vContainer.classList.remove('idle'); clearTimeout(timeout);
    timeout = setTimeout(() => { if (!video.paused && !vcmMenu.classList.contains('open')) vContainer.classList.add('idle'); }, 3000);
  }
  vContainer.addEventListener('mousemove', resetControls); vContainer.addEventListener('touchstart', resetControls);
  vContainer.addEventListener('mouseleave', () => { if (!video.paused && !vcmMenu.classList.contains('open')) vContainer.classList.add('idle'); });
}
</script>
