<!DOCTYPE html>
<html lang="tr" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>IHS TV & VOD - ULTIMATE</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    :root { --bg-main: #050505; --bg-card: #121212; --ihs-red: #e50914; --text-main: #ffffff; --text-muted: #888888; --border-color: #262626; --gold: #f5c518; }
    * { box-sizing: border-box; margin: 0; padding: 0; outline: none; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-main); color: var(--text-main); font-family: system-ui, -apple-system, sans-serif; height: 100dvh; overflow: hidden; }
    ::-webkit-scrollbar { width: 5px; height: 5px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: #444; border-radius: 5px; } ::-webkit-scrollbar-thumb:hover { background: var(--ihs-red); }

    .security-screen, .ban-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; background: var(--bg-main); z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    .ban-screen { display: none; background: #050505; }
    .security-logo { width: 70px; height: 70px; background: linear-gradient(135deg, #ff4b4b, #8b0000); transform: rotate(45deg); box-shadow: 0 0 20px rgba(229, 9, 20, 0.5); border: 2px solid #ff7a7a; margin-bottom: 40px; }
    .security-title { font-size: 22px; font-weight: 900; letter-spacing: 3px; margin-bottom: 25px; }
    .password-input { background: var(--bg-card); border: 1px solid #333; border-radius: 8px; color: white; padding: 12px 20px; font-size: 16px; width: 250px; text-align: center; margin-bottom: 15px; letter-spacing: 2px; }
    .password-input:focus { border-color: var(--ihs-red); }
    .login-btn { background: var(--ihs-red); color: white; border: none; padding: 12px 40px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .login-btn:active { transform: scale(0.95); }
    .error-msg { color: var(--ihs-red); font-size: 13px; font-weight: bold; margin-top: 15px; display: none; }

    .app-wrapper { display: none; width: 100vw; height: 100dvh; overflow: hidden; }

    /* OYNATICI BÖLÜMÜ */
    .player-section { background: #000; z-index: 10; display: flex; flex-direction: column; position: relative; }
    .video-container { width: 100%; background: #000; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; aspect-ratio: 16/9; }
    .video-container video { width: 100%; height: 100%; object-fit: contain; display: block; cursor: pointer; }
    video::-webkit-media-controls, video::-webkit-media-controls-enclosure { display: none !important; }
    .video-container.pseudo-fullscreen { position: fixed !important; top: 0 !important; left: 0 !important; right: 0 !important; bottom: 0 !important; width: 100vw !important; height: 100dvh !important; z-index: 999999 !important; background: #000 !important; }

    .fade-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 14; opacity: 0; pointer-events: none; transition: opacity 0.4s ease; }
    .fade-overlay.active { opacity: 1; }

    .stats-panel { position: absolute; top: 15px; right: 15px; background: rgba(10, 10, 10, 0.6); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 12px 15px; z-index: 22; display: none; flex-direction: column; gap: 8px; min-width: 180px; box-shadow: 0 4px 15px rgba(0,0,0,0.8); }
    .stats-header { font-size: 11px; font-weight: bold; color: var(--text-muted); border-bottom: 1px solid #333; padding-bottom: 5px; margin-bottom: 5px; display: flex; justify-content: space-between;}
    .stat-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
    .stat-label { color: #aaa; }
    .stat-value { font-family: monospace; font-weight: bold; color: #4CAF50; letter-spacing: 0.5px;}

    .tv-osd { position: absolute; top: 20px; left: 20px; background: rgba(10, 10, 10, 0.5); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 15px 20px; display: flex; align-items: flex-start; gap: 15px; z-index: 30; opacity: 0; transform: translateX(-20px); transition: all 0.4s ease; pointer-events: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5); min-width: 280px; }
    .tv-osd.show { opacity: 1; transform: translateX(0); }
    .osd-logo { width: 55px; height: 55px; background: rgba(255,255,255,0.9); padding: 4px; border-radius: 10px; object-fit: contain; }
    .osd-info { display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .osd-info h2 { font-size: 20px; margin: 0; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.8); display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden;}
    .osd-badges { display: flex; gap: 10px; align-items: center; margin-bottom: 4px;}
    .osd-badge { font-size: 11px; font-weight: bold; color: var(--ihs-red); background: rgba(229,9,20,0.15); padding: 2px 6px; border-radius: 4px; border: 1px solid rgba(229,9,20,0.3); display: flex; align-items: center; gap: 5px; }
    .osd-clock { font-size: 12px; font-weight: 600; color: #ccc; font-family: monospace; }
    
    .epg-container { width: 100%; display: none; flex-direction: column; }
    .epg-title { font-size: 11px; color: #ddd; margin-bottom: 3px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px;}
    .epg-bar { width: 100%; height: 4px; background: rgba(255,255,255,0.2); border-radius: 4px; overflow: hidden; }
    .epg-progress { height: 100%; background: var(--ihs-red); border-radius: 4px; transition: width 1s linear; }

    /* VİDEO İÇİ KANAL LİSTESİ */
    .video-channel-menu { position: absolute; top: 0; right: -320px; width: 300px; height: 100%; background: rgba(10, 10, 10, 0.9); backdrop-filter: blur(20px); z-index: 25; padding: 15px; display: flex; flex-direction: column; transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1); border-left: 1px solid rgba(255,255,255,0.05); }
    .video-channel-menu.open { right: 0; }
    .vcm-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
    .vcm-header h3 { font-size: 16px; margin: 0; color: #fff; display: flex; align-items: center; gap: 10px;}
    .vcm-close { background: none; border: none; color: #fff; cursor: pointer; font-size: 20px; transition: 0.2s; }
    .vcm-close:hover { color: var(--ihs-red); transform: scale(1.1); }
    .vcm-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding-right: 5px; }
    .vcm-list .channel-row { background: rgba(255,255,255,0.03); border: 1px solid transparent; border-radius: 8px; padding: 8px 10px; cursor: pointer; display: flex; align-items: center;}
    .vcm-list .channel-row:hover { background: rgba(255,255,255,0.1); border-color: #444; }
    .vcm-list .channel-row.active-channel { background: rgba(229, 9, 20, 0.25); border-left: 3px solid var(--ihs-red); border-radius: 4px; }
    .vcm-list img { width: 35px; height: 35px; object-fit: contain; margin-right: 12px; border-radius: 4px; background: #fff; padding: 2px; }
    .vcm-list .channel-row-name { font-size: 13px; font-weight: 600; color: #ddd; flex:1;}

    .loading-spinner { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.1); border-top-color: var(--ihs-red); border-radius: 50%; animation: spin 1s linear infinite; z-index: 15; display: none; }
    @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
    .error-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 16; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    .error-overlay i { font-size: 45px; color: var(--ihs-red); margin-bottom: 15px; }
    .fallback-msg { color: #aaa; font-size: 13px; margin-top: 10px; font-style: italic; }

    /* OYNATICI KONTROLLERİ */
    .custom-controls { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0) 100%); display: flex; flex-direction: column; padding: 40px 20px 20px 20px; z-index: 20; opacity: 1; transition: opacity 0.4s ease; }
    .video-container.idle .custom-controls { opacity: 0; pointer-events: none; }
    .video-container.menu-open .custom-controls { opacity: 1; pointer-events: auto; }
    
    .progress-container { display: none; align-items: center; gap: 12px; width: 100%; margin-bottom: 15px; }
    .time-text { font-size: 12px; font-family: monospace; color: #ccc; min-width: 45px; text-align: center; }
    .seek-bar { flex: 1; -webkit-appearance: none; background: rgba(255,255,255,0.2); height: 5px; border-radius: 5px; outline: none; cursor: pointer; transition: height 0.2s; }
    .seek-bar:hover { height: 7px; }
    .seek-bar::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--ihs-red); cursor: pointer; transition: 0.2s; box-shadow: 0 0 10px rgba(229,9,20,0.5); }
    .seek-bar::-webkit-slider-thumb:hover { transform: scale(1.3); }

    .control-buttons { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    .controls-left, .controls-right { display: flex; align-items: center; gap: 18px; }
    .control-btn { background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; transition: 0.2s; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
    .control-btn:hover { color: var(--ihs-red); transform: scale(1.1); }
    .control-btn.play-btn { font-size: 26px; margin: 0 5px; }

    /* FİLM DETAY MODALI */
    .movie-detail-modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,15,15,0.98); z-index: 50; display: none; flex-direction: column; padding: 20px; overflow-y: auto; backdrop-filter: blur(10px); }
    .movie-detail-modal.open { display: flex; }
    .mdm-close { align-self: flex-end; background: #222; border: 1px solid #444; color: #fff; width: 35px; height: 35px; border-radius: 50%; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; margin-bottom: 10px; }
    .mdm-close:hover { background: var(--ihs-red); border-color: var(--ihs-red); }
    .mdm-content { display: flex; gap: 20px; align-items: flex-start; }
    .mdm-poster { width: 120px; aspect-ratio: 2/3; object-fit: cover; border-radius: 8px; border: 1px solid #333; flex-shrink: 0; }
    .mdm-info { display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .mdm-title { font-size: 18px; font-weight: 800; color: #fff; }
    .mdm-meta { display: flex; gap: 10px; align-items: center; font-size: 12px; color: var(--gold); font-weight: bold; }
    .mdm-desc { font-size: 13px; color: #bbb; line-height: 1.4; margin-top: 5px; }
    .mdm-play-btn { background: var(--ihs-red); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; margin-top: 15px; width: fit-content; transition: 0.2s; }
    .mdm-play-btn:hover { transform: scale(1.05); }

    /* LİSTE / SİDEBAR BÖLÜMÜ */
    .sidebar-section { display: flex; flex-direction: column; background: var(--bg-card); overflow: hidden; flex: 1; position: relative; min-width: 0; }
    .tab-container { display: flex; background: var(--bg-main); border-bottom: 1px solid var(--border-color); flex-shrink: 0; }
    .tab-btn { flex: 1; padding: 15px 0; background: transparent; border: none; color: var(--text-muted); font-size: 13px; font-weight: bold; letter-spacing: 1px; cursor: pointer; transition: 0.3s; border-bottom: 3px solid transparent; }
    .tab-btn.active { color: #fff; border-bottom-color: var(--ihs-red); background: rgba(255,255,255,0.02); }

    .search-container { padding: 12px 15px; background: var(--bg-card); flex-shrink: 0; }
    .search-box { display: flex; align-items: center; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 10px 14px; transition: 0.3s; }
    .search-box:focus-within { border-color: var(--ihs-red); box-shadow: 0 0 10px rgba(229,9,20,0.2); }
    .search-box input { background: transparent; border: none; color: white; width: 100%; margin-left: 10px; font-size: 13px; }

    .categories-bar { display: flex; overflow-x: auto; padding: 0 15px 10px 15px; gap: 8px; border-bottom: 1px solid var(--border-color); -webkit-overflow-scrolling: touch; scroll-behavior: smooth; flex-shrink: 0; }
    .cat-btn { background: #1a1a1a; color: #aaa; border: 1px solid #333; padding: 8px 16px; border-radius: 20px; font-weight: 600; font-size: 12px; white-space: nowrap; cursor: pointer; transition: 0.2s; }
    .cat-btn:hover { border-color: #555; color: #fff; }
    .cat-btn.active { background: var(--ihs-red); color: #fff; border-color: var(--ihs-red); }
    .cat-btn.movie-cat { border-radius: 6px; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; padding: 8px 14px;}

    .category-menu { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(18, 18, 18, 0.98); z-index: 40; display: flex; flex-direction: column; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
    .category-menu.open { transform: translateY(0); }
    .cm-header { padding: 20px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
    .cm-header h3 { font-size: 16px; margin: 0; color: #fff; display: flex; align-items: center; gap: 10px;}
    .cm-close { background: none; border: none; color: #fff; font-size: 22px; cursor: pointer; transition: 0.2s;}
    .cm-close:hover { color: var(--ihs-red); transform: scale(1.1); }
    .cm-list { flex: 1; overflow-y: auto; padding: 15px; display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; align-content: start; padding-bottom: 40px;}
    .cm-item { background: #222; border: 1px solid #333; padding: 15px 10px; border-radius: 8px; text-align: center; font-size: 13px; font-weight: 700; color: #ddd; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; min-height: 60px;}
    .cm-item:hover, .cm-item.active { background: rgba(229,9,20,0.2); border-color: var(--ihs-red); color: #fff; box-shadow: 0 4px 10px rgba(229,9,20,0.3);}

    .content-area { flex: 1; overflow-y: auto; padding: 10px; -webkit-overflow-scrolling: touch; }
    
    .channel-row { display: flex; align-items: center; background: transparent; padding: 8px 12px; border-radius: 8px; cursor: pointer; transition: 0.2s; margin-bottom: 6px; border: 1px solid transparent; }
    .channel-row.active-channel { background: rgba(229, 9, 20, 0.15); border: 1px solid rgba(229, 9, 20, 0.3); border-left: 4px solid var(--ihs-red); }
    .channel-row:hover { background: rgba(255,255,255,0.05); }
    .channel-row img { width: 40px; height: 40px; object-fit: contain; background: #fff; border-radius: 6px; padding: 3px; margin-right: 15px; flex-shrink: 0; }
    .channel-row-name { flex: 1; font-weight: 600; font-size: 13px; color: #eee; }
    .fav-icon { font-size: 16px; color: #444; padding: 8px; transition: 0.3s; }
    .fav-icon:hover { transform: scale(1.2); }
    .fav-icon.active { color: var(--ihs-red); text-shadow: 0 0 10px rgba(229,9,20,0.5); }

    /* NETFLIX DÜZENİ */
    .netflix-row-container { margin-bottom: 20px; }
    .netflix-row-title { font-size: 14px; font-weight: 700; color: #fff; margin: 0 0 8px 8px; display: flex; justify-content: space-between; align-items: baseline; }
    .see-all { font-size: 11px; color: #aaa; cursor: pointer; font-weight: normal; margin-right: 15px; transition: color 0.2s;}
    .see-all:hover { color: var(--ihs-red); }
    
    .netflix-row { display: flex; gap: 10px; overflow-x: auto; padding: 5px 8px; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; align-items: flex-start; }
    .netflix-row::-webkit-scrollbar { height: 4px; }
    .netflix-row::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    .netflix-row .movie-card { flex: 0 0 110px; scroll-snap-align: start; }

    .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; padding: 10px; }
    .movie-card { border-radius: 8px; overflow: hidden; position: relative; aspect-ratio: 2 / 3; background: #1a1a1a; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s, border 0.2s; border: 1px solid #333; flex-shrink: 0; }
    .movie-card:hover { transform: scale(1.03); z-index: 2; border-color: var(--ihs-red); box-shadow: 0 5px 15px rgba(229,9,20,0.5); }
    .movie-card.active-movie { border-color: var(--ihs-red); box-shadow: 0 0 12px rgba(229,9,20,0.8); transform: scale(1.03); z-index: 2; }
    
    .movie-poster-wrap { width: 100%; height: 100%; position: absolute; top: 0; left: 0; display: flex; align-items: center; justify-content: center; background: #111; pointer-events: none; }
    .movie-title-fallback { position: absolute; width: 100%; padding: 10px; text-align: center; font-size: 11px; font-weight: 700; color: #555; z-index: 0; }
    .movie-poster { width: 100%; height: 100%; object-fit: cover; object-position: center top; z-index: 1; transition: opacity 0.3s; opacity: 0; }
    
    .movie-title-overlay { position: absolute; bottom: 0; left: 0; width: 100%; padding: 25px 6px 8px 6px; background: linear-gradient(to top, rgba(0,0,0,0.95), transparent); color: #fff; font-size: 10px; font-weight: 700; z-index: 2; text-align: center; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.2; text-shadow: 1px 1px 2px #000; pointer-events: none; }
    .movie-rating { position: absolute; top: 5px; left: 5px; background: rgba(0,0,0,0.75); backdrop-filter: blur(4px); color: var(--gold); font-size: 9px; font-weight: bold; padding: 2px 5px; border-radius: 4px; z-index: 3; display: none; align-items: center; gap: 3px; pointer-events: none; }
    
    .play-icon-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; opacity: 0; transition: 0.2s; backdrop-filter: blur(1px); z-index: 3; pointer-events: none; }
    .movie-card:hover .play-icon-overlay { opacity: 1; }
    .play-icon-overlay i { font-size: 30px; color: white; text-shadow: 0 0 10px var(--ihs-red); }

    /* RESPONSIVE YERLEŞİM */
    @media (max-width: 899px) {
      .app-wrapper { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
      .player-section { width: 100%; flex-shrink: 0; }
      .sidebar-section { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
    }
    @media (min-width: 900px) {
      .app-wrapper { display: flex; flex-direction: row; height: 100dvh; overflow: hidden; }
      .player-section { width: 55%; height: 100dvh; flex-shrink: 0; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; }
      .video-container { flex: 1; aspect-ratio: auto; }
      .sidebar-section { width: 45%; height: 100dvh; display: flex; flex-direction: column; }
    }
  </style>
</head>
<body>

  <div class="ban-screen" id="ban-screen"><i class="fas fa-ban"></i><h1>ERİŞİM ENGELLENDİ</h1></div>
  <div class="security-screen" id="security-screen">
    <div class="security-logo"></div>
    <div class="security-title">IHS PRIVATE</div>
    <input type="password" id="pass-input" class="password-input" placeholder="Şifrenizi Girin">
    <button class="login-btn" onclick="checkPassword()">GİRİŞ YAP</button>
    <div class="error-msg" id="error-msg"></div>
  </div>

  <div class="app-wrapper" id="app-wrapper">
    
    <!-- OYNATICI BÖLÜMÜ -->
    <div class="player-section">
      <div class="video-container" id="video-container">
        <div class="fade-overlay" id="fade-overlay"></div>

        <div class="stats-panel" id="stats-panel">
          <div class="stats-header"><span>YAYIN BİLGİSİ</span> <i class="fas fa-satellite-dish" style="color:var(--ihs-red)"></i></div>
          <div class="stat-row"><span class="stat-label">Çözünürlük:</span><span class="stat-value" id="stat-res">Bekleniyor</span></div>
          <div class="stat-row"><span class="stat-label">Kare Hızı:</span><span class="stat-value" id="stat-fps">Bekleniyor</span></div>
          <div class="stat-row"><span class="stat-label">Bit Hızı:</span><span class="stat-value" id="stat-bit">Bekleniyor</span></div>
        </div>

        <div class="video-channel-menu" id="video-channel-menu">
          <div class="vcm-header">
            <h3><i class="fas fa-list-ul"></i> İçerikler</h3>
            <button class="vcm-close" id="vcm-close-btn"><i class="fas fa-times"></i></button>
          </div>
          <div class="vcm-list" id="vcm-list"></div>
        </div>

        <div class="tv-osd" id="tv-osd">
          <img id="osd-logo" class="osd-logo" src="" alt="logo">
          <div class="osd-info">
            <h2 id="osd-title">Kanal / Film</h2>
            <div class="osd-badges">
              <span id="osd-badge" class="osd-badge"><i class="fas fa-circle" style="font-size: 8px;"></i> CANLI</span>
              <span class="osd-clock" id="osd-clock">00:00</span>
            </div>
            <div class="epg-container" id="epg-container">
                <div class="epg-title" id="epg-title">Yayın Akışı Bekleniyor...</div>
                <div class="epg-bar"><div class="epg-progress" id="epg-progress"></div></div>
            </div>
          </div>
        </div>

        <div class="loading-spinner" id="loading-spinner"></div>
        <div class="error-overlay" id="error-overlay">
            <i class="fas fa-exclamation-triangle"></i>

function startClock() {
  const clockEl = document.getElementById('osd-clock');
  clockInterval = setInterval(() => { 
    clockEl.innerText = new Date().toLocaleTimeString('tr-TR', { hour:'2-digit', minute:'2-digit' }); 
  }, 1000);
}

function parseM3UContent(content, targetArray, targetCategories) {
  const lines = content.split('\n'); 
  let currentObj = null;
  for (let i = 0; i < lines.length; i++) {
    let line = lines[i].trim(); 
    if (!line) continue;
    if (line.startsWith('#EXTINF:')) {
      const logoMatch = line.match(/tvg-logo="([^"]+)"/);
      const groupMatch = line.match(/group-title="([^"]+)"/);
      let finalGroup = groupMatch ? groupMatch[1] : 'Genel';
      let name = line.split(',').pop().trim();
      currentObj = { name, logo: logoMatch ? logoMatch[1] : '', group: finalGroup }; 
      targetCategories.add(finalGroup);
    } else if (line.startsWith('http')) { 
      if (currentObj) { currentObj.url = line; targetArray.push(currentObj); currentObj = null; } 
    }
  }
}

  const lines = content.split('\n');
  let pendingMeta = null;
  let pendingUrl = null;

  for (let i = 0; i < lines.length; i++) {
    let line = lines[i].trim();
    if (!line || line.startsWith('#EXTM3U')) continue;

    if (line.startsWith('#EXTINF:')) {
      const logoMatch = line.match(/tvg-logo="([^"]+)"/);
      const groupMatch = line.match(/group-title="([^"]+)"/);
      let group = groupMatch ? groupMatch[1] : 'Genel';
      let name = line.split(',').pop().trim();
      let logo = logoMatch ? logoMatch[1] : '';

      targetCategories.add(group);
      pendingMeta = { name, logo, group };
    } else if (line.startsWith('http')) {
      pendingUrl = line;
    }

    if (pendingMeta && pendingUrl) {
      targetArray.push({
        name: pendingMeta.name,
        logo: pendingMeta.logo,
        group: pendingMeta.group,
        url: pendingUrl
      });
      pendingMeta = null;
      pendingUrl = null;
    }
  }
}

function processTmdbQueue() {
  if (isFetchingTmdb || tmdbQueue.length === 0) return;
  isFetchingTmdb = true;
  const { movie, imgEl, ratingEl } = tmdbQueue.shift();
  
  let cleanName = movie.name.replace(/\(\d{4}\)/g, '').replace(/\[.*?\]/g, '').trim();
  
  if (tmdbCache[cleanName]) {
    applyTmdbData(tmdbCache[cleanName], movie, imgEl, ratingEl);
    isFetchingTmdb = false;
    setTimeout(processTmdbQueue, 100);
    return;
  }

  fetch(`https://api.themoviedb.org/3/search/movie?api_key=${TMDB_KEY}&query=${encodeURIComponent(cleanName)}&language=tr-TR`)
    .then(res => res.json())
    .then(data => {
      if (data && data.results && data.results.length > 0) {
        const item = data.results[0];
        const info = {
          poster: item.poster_path ? `https://image.tmdb.org/t/p/w500${item.poster_path}` : movie.logo,
          rating: item.vote_average ? item.vote_average.toFixed(1) : '',
          overview: item.overview || 'Bu içerik için detaylı açıklama bulunmuyor.'
        };
        tmdbCache[cleanName] = info;
        applyTmdbData(info, movie, imgEl, ratingEl);
      } else {
        if (movie.logo) {
          imgEl.src = movie.logo;
          imgEl.style.opacity = '1';
        }
        movie.overview = 'Bu içerik için detaylı açıklama bulunmuyor.';
      }
      isFetchingTmdb = false;
      setTimeout(processTmdbQueue, 150);
    })
    .catch(() => {
      isFetchingTmdb = false;
      setTimeout(processTmdbQueue, 150);
    });
}

function applyTmdbData(info, movie, imgEl, ratingEl) {
  movie.overview = info.overview;
  if (info.poster && imgEl) {
    imgEl.src = info.poster;
    imgEl.style.opacity = '1';
  }
  if (info.rating && ratingEl) {
    ratingEl.innerHTML = `<i class="fas fa-star" style="font-size:9px;"></i> ${info.rating}`;
    ratingEl.style.display = 'flex';
    movie.rating = info.rating;
  }
}

const movieObserver = new IntersectionObserver((entries, observer) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      const card = entry.target;
      const movieIdx = card.getAttribute('data-movie-index');
      if (movieIdx !== null) {
        const movie = movies[movieIdx];
        const imgEl = card.querySelector('.movie-poster');
        const ratingEl = card.querySelector('.movie-rating');
        if (movie && (!movie.enriched || !imgEl.src)) {
          movie.enriched = true;
          tmdbQueue.push({ movie, imgEl, ratingEl });
          processTmdbQueue();
        }
      }
      observer.unobserve(card);
    }
  });
}, { rootMargin: '150px' });

function createMovieCard(c, index) {
    const safeName = c.name.replace(/</g, "&lt;").replace(/>/g, "&gt;"); 
    const card = document.createElement('div'); 
    card.className = 'movie-card' + (activeItemUrl === c.url ? ' active-movie' : ''); 
    card.setAttribute('data-url', c.url);
    card.setAttribute('data-movie-index', index);
    
    const initialPoster = c.logo && c.logo.startsWith('http') ? c.logo : '';
    
    card.innerHTML = `
      <div class="movie-poster-wrap">
        <div class="movie-title-fallback">${safeName}</div>
        <div class="movie-rating"><i class="fas fa-star" style="font-size:9px;"></i></div>
        <img class="movie-poster" src="${initialPoster}" loading="lazy" onload="this.style.opacity='1'" onerror="this.style.opacity='0'">
        <div class="movie-title-overlay">${safeName}</div>
        <div class="play-icon-overlay"><i class="fas fa-play-circle"></i></div>
      </div>
    `;
    
    card.onclick = (e) => {
      e.stopPropagation();
      openMovieDetail(c, index);
    }; 
    
    movieObserver.observe(card);
    if(initialPoster) {
      setTimeout(() => {
        const img = card.querySelector('.movie-poster');
        if(img) img.style.opacity = '1';
      }, 50);
    }
    
    return card;
}

function renderContentList(reset = false) {
  const contentArea = document.getElementById('content-area'); 
  const dataset = currentMode === 'TV' ? tvChannels : movies; 
  const query = document.getElementById('search-input').value.toLocaleLowerCase('tr-TR');
  
  if (reset) { 
    currentRenderCount = 0; 
    contentArea.innerHTML = ''; 
    if (currentCategory === 'Favorilerim') { 
      currentDisplayList = dataset.filter(c => favorites.includes(c.name)); 
    } else { 
      currentDisplayList = currentCategory === 'Tümü' ? dataset : dataset.filter(c => c.group === currentCategory); 
    } 
    if (query) currentDisplayList = currentDisplayList.filter(c => c.name.toLocaleLowerCase('tr-TR').includes(query)); 
    populateVideoChannelMenu(); 
  }

  if (currentMode === 'MOVIE' && currentCategory === 'Tümü' && query === '') {
      contentArea.className = 'content-area'; 
      if(!reset) return; 
      Array.from(movieCategories).sort(new Intl.Collator('tr').compare).forEach(cat => {
          const catMovies = movies.filter(m => m.group === cat); 
          if(catMovies.length === 0) return;
          const rowCont = document.createElement('div'); 
          rowCont.className = 'netflix-row-container'; 
          rowCont.innerHTML = `<div class="netflix-row-title">${cat} <span class="see-all" onclick="selectCategory('${cat}')">Tümünü Gör <i class="fas fa-chevron-right"></i></span></div>`;
          const row = document.createElement('div'); 
          row.className = 'netflix-row'; 
          const limit = Math.min(catMovies.length, 30); 
          for(let i = 0; i < limit; i++) { 
            const realIdx = movies.indexOf(catMovies[i]);
            row.appendChild(createMovieCard(catMovies[i], realIdx)); 
          } 
          rowCont.appendChild(row); 
          contentArea.appendChild(rowCont);
      }); 
      return;
  }

  contentArea.className = currentMode === 'TV' ? 'content-area' : 'content-area movie-grid'; 
  const fragment = document.createDocumentFragment(); 
  const endIndex = Math.min(currentRenderCount + RENDER_CHUNK, currentDisplayList.length);
  
  for (let i = currentRenderCount; i < endIndex; i++) {
    const c = currentDisplayList[i]; 
    const realIdx = dataset.indexOf(c);
    const safeName = c.name.replace(/</g, "&lt;").replace(/>/g, "&gt;"); 
    
    if(currentMode === 'TV') {
      const isFav = favorites.includes(c.name); 
      const row = document.createElement('div'); 
      row.className = 'channel-row' + (activeItemUrl === c.url ? ' active-channel' : ''); 
      row.setAttribute('data-url', c.url);
      row.innerHTML = `<img src="${c.logo}" loading="lazy" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'150\' height=\'150\' fill=\'%23222\'><rect width=\'150\' height=\'150\'/><text x=\'50%\' y=\'50%\' fill=\'%23aaa\' font-size=\'16\' font-family=\'sans-serif\' dominant-baseline=\'middle\' text-anchor=\'middle\'>TV</text></svg>'"><div class="channel-row-name">${safeName}</div><i class="${isFav ? 'fas' : 'far'} fa-heart fav-icon ${isFav ? 'active' : ''}" onclick="toggleFavorite(event, '${safeName.replace(/'/g, "\\'")}')"></i>`; 
      row.onclick = () => playStream(c, realIdx); 
      fragment.appendChild(row);
    } else { 
      fragment.appendChild(createMovieCard(c, realIdx)); 
    }
  }
  contentArea.appendChild(fragment); 
  currentRenderCount = endIndex;
}

function playStream(item, index) {
  fadeOverlay.classList.add('active');
  setTimeout(() => {
    activeItemUrl = item.url; 
    activeChannelIndex = index; 
    document.getElementById('error-overlay').style.display = 'none'; 
    document.getElementById('loading-spinner').style.display = 'block';
    
    const safeName = item.name.replace(/</g, "&lt;").replace(/>/g, "&gt;"); 
    const osd = document.getElementById('tv-osd'); 
    document.getElementById('osd-logo').src = item.logo || 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="150" height="150" fill="%23222"><rect width="150" height="150"/><text x="50%" y="50%" fill="%23aaa" font-size="16" font-family="sans-serif" dominant-baseline="middle" text-anchor="middle">TV</text></svg>'; 
    document.getElementById('osd-title').innerText = safeName;
    
    if(currentMode === 'TV') { 
      const randProg = Math.floor(Math.random() * 60) + 20; 
      document.getElementById('epg-title').innerText = "Şu An Oynayan: " + safeName + " Canlı Yayını"; 
      document.getElementById('epg-progress').style.width = randProg + "%"; 
    }
    
    osd.classList.add('show'); 
    clearTimeout(osdTimeout); 
    osdTimeout = setTimeout(() => { osd.classList.remove('show'); }, 4000);
    
    if (hls) hls.destroy(); 

    const videoContainer = document.getElementById('video-container');
    let existingIframe = document.getElementById('embed-iframe');
    if (existingIframe) existingIframe.remove();
    
    // EVRENSEL AKILLI EMBED / IFRAME KONTROLÜ (Canlı TV ve Filmler için ortak)
    let embedUrl = "";
    let isEmbed = false;

    if (item.url) {
      if (item.url.includes('ok.ru/video/')) {
        const okId = item.url.split('/video/')[1].split('?')[0];
        embedUrl = `https://ok.ru/videoembed/${okId}`;
        isEmbed = true;
      } else if (item.url.includes('vixolity.com/vs/')) {
        embedUrl = item.url;
        isEmbed = true;
      } else if (item.url.includes('youtube.com/watch?v=')) {
        const ytId = item.url.split('v=')[1].split('&')[0];
        embedUrl = `https://www.youtube.com/embed/${ytId}?autoplay=1`;
        isEmbed = true;
      } else if (item.url.includes('youtu.be/')) {
        const ytId = item.url.split('youtu.be/')[1].split('?')[0];
        embedUrl = `https://www.youtube.com/embed/${ytId}?autoplay=1`;
        isEmbed = true;
      } else if (item.url.includes('/embed/') || item.url.includes('player.php') || item.url.includes('youtube.com/embed/')) {
        embedUrl = item.url;
        isEmbed = true;
      }
    }

    if (isEmbed) {
      video.style.display = 'none';
      document.getElementById('custom-controls').style.display = 'none';
      
      const iframe = document.createElement('iframe');
      iframe.id = 'embed-iframe';
      iframe.src = embedUrl;
      iframe.style.width = '100%';
      iframe.style.height = '100%';
      iframe.style.border = 'none';
      iframe.style.position = 'absolute';
      iframe.style.top = '0';
      iframe.style.left = '0';
      iframe.style.zIndex = '12';
      iframe.allow = 'autoplay; encrypted-media; fullscreen; picture-in-picture';
      iframe.setAttribute('allowfullscreen', 'true');
      
      videoContainer.appendChild(iframe);
      document.getElementById('loading-spinner').style.display = 'none';
      fadeOverlay.classList.remove('active');
    } else {
      video.style.display = 'block';
      document.getElementById('custom-controls').style.display = 'flex';
      
      let targetUrl = item.url;
      let finalUrl = PROXY_BASE + encodeURIComponent(targetUrl);

      if (Hls.isSupported() && (targetUrl.includes('.m3u8') || currentMode === 'TV')) {
        hls = new Hls({
          enableWorker: true,
          xhrSetup: function (xhr, url) {
            const proxiedUrl = url.startsWith(PROXY_BASE) ? url : PROXY_BASE + encodeURIComponent(url);
            xhr.open('GET', proxiedUrl, true);
          }
        }); 
        hls.on(Hls.Events.ERROR, (e, data) => { if (data.fatal) handleStreamError(); });
        hls.loadSource(finalUrl); 
        hls.attachMedia(video); 
        hls.on(Hls.Events.MANIFEST_PARSED, () => { video.play().catch(e => console.log(e)); });
      } else { 
        video.src = finalUrl; 
        video.play().catch(e => { console.error(e); handleStreamError(); }); 
      }
    }
    updateActiveCardUI(); 
  }, 400); 
}

function handleStreamError() { 
  document.getElementById('loading-spinner').style.display = 'none'; 
  fadeOverlay.classList.remove('active'); 
  document.getElementById('error-overlay').style.display = 'flex'; 
  document.getElementById('fallback-msg').innerText = "CORS engeli veya sunucu yanıt vermiyor."; 
}

function formatTime(seconds) { 
  if(isNaN(seconds)) return "00:00"; 
  const m = Math.floor(seconds / 60); const s = Math.floor(seconds % 60); const h = Math.floor(m / 60); const mm = m % 60; 
  if(h > 0) return `${h}:${mm < 10 ? '0'+mm : mm}:${s < 10 ? '0'+s : s}`; 
  return `${m}:${s < 10 ? '0'+s : s}`; 
}

function playNextChannel() { if(currentDisplayList.length === 0 || currentMode === 'MOVIE') return; let nextIdx = activeChannelIndex + 1; if (nextIdx >= currentDisplayList.length) nextIdx = 0; playStream(currentDisplayList[nextIdx], nextIdx); }
function playPrevChannel() { if(currentDisplayList.length === 0 || currentMode === 'MOVIE') return; let prevIdx = activeChannelIndex - 1; if (prevIdx < 0) prevIdx = currentDisplayList.length - 1; playStream(currentDisplayList[prevIdx], prevIdx); }

function initKeyboardControls() { 
  document.addEventListener('keydown', (e) => { 
    if(document.activeElement.tagName === 'INPUT') return; 
    switch(e.code) { 
      case 'Space': e.preventDefault(); if (video.paused) video.play(); else video.pause(); break; 
      case 'KeyF': e.preventDefault(); document.getElementById('fullscreen-btn').click(); break; 
      case 'ArrowUp': e.preventDefault(); playPrevChannel(); break; 
      case 'ArrowDown': e.preventDefault(); playNextChannel(); break; 
    } 
  }); 
}

document.getElementById('vcm-close-btn').onclick = (e) => { e.stopPropagation(); document.getElementById('video-channel-menu').classList.remove('open'); document.getElementById('video-container').classList.remove('menu-open'); };

function initPlayerControls() {
  const playBtn = document.getElementById('play-pause-btn'); const muteBtn = document.getElementById('mute-btn'); const fsBtn = document.getElementById('fullscreen-btn'); const pipBtn = document.getElementById('pip-btn'); const statsBtn = document.getElementById('stats-btn'); const statsPanel = document.getElementById('stats-panel'); const vContainer = document.getElementById('video-container');
  if (!document.pictureInPictureEnabled) pipBtn.style.display = 'none';
  
  function togglePlay() { if (video.paused) video.play(); else video.pause(); } 
  playBtn.onclick = (e) => { e.stopPropagation(); togglePlay(); }; video.onclick = togglePlay;
  
  video.addEventListener('waiting', () => { document.getElementById('loading-spinner').style.display = 'block'; }); 
  video.addEventListener('playing', () => { document.getElementById('loading-spinner').style.display = 'none'; fadeOverlay.classList.remove('active'); }); 
  video.addEventListener('error', () => { handleStreamError(); });
  video.addEventListener('play', () => { playBtn.innerHTML = '<i class="fas fa-pause"></i>'; }); 
  video.addEventListener('pause', () => { playBtn.innerHTML = '<i class="fas fa-play"></i>'; });
  
  muteBtn.onclick = (e) => { e.stopPropagation(); video.muted = !video.muted; muteBtn.innerHTML = video.muted ? '<i class="fas fa-volume-mute"></i>' : '<i class="fas fa-volume-up"></i>'; };
  video.addEventListener('loadedmetadata', () => { if(video.duration && video.duration !== Infinity) { seekBar.max = video.duration; document.getElementById('total-time').innerText = formatTime(video.duration); } });
  video.addEventListener('timeupdate', () => { if (!seekBar.active) seekBar.value = video.currentTime; document.getElementById('current-time').innerText = formatTime(video.currentTime); });
  
  seekBar.addEventListener('mousedown', () => seekBar.active = true); seekBar.addEventListener('touchstart', () => seekBar.active = true); 
  seekBar.addEventListener('change', () => { video.currentTime = seekBar.value; seekBar.active = false; }); 
  seekBar.addEventListener('touchend', () => { video.currentTime = seekBar.value; seekBar.active = false; });
  
  fsBtn.onclick = (e) => { 
    e.stopPropagation(); const isPseudoFS = vContainer.classList.contains('pseudo-fullscreen'); 
    if (!document.fullscreenElement && !isPseudoFS) { 
      if (vContainer.requestFullscreen) vContainer.requestFullscreen().catch(() => vContainer.classList.add('pseudo-fullscreen')); 
      else if (vContainer.webkitRequestFullscreen) vContainer.webkitRequestFullscreen(); else vContainer.classList.add('pseudo-fullscreen'); 
      if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(()=>{}); 
    } else { 
      if (document.exitFullscreen && document.fullscreenElement) document.exitFullscreen(); 
      else if (document.webkitExitFullscreen && document.fullscreenElement) document.webkitExitFullscreen(); 
      vContainer.classList.remove('pseudo-fullscreen'); if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); 
    } 
  };
  video.ondblclick = fsBtn.onclick; 
  pipBtn.onclick = async (e) => { e.stopPropagation(); try { if (document.pictureInPictureElement) await document.exitPictureInPicture(); else await video.requestPictureInPicture(); } catch (err) {} };
  
  statsBtn.onclick = (e) => { 
    e.stopPropagation(); 
    if (statsPanel.style.display === 'flex') { statsPanel.style.display = 'none'; clearInterval(statsInterval); } 
    else { statsPanel.style.display = 'flex'; statsInterval = setInterval(updateStats, 1000); updateStats(); } 
  };
  
  function updateStats() { 
    if (statsPanel.style.display !== 'flex') return; 
    document.getElementById('stat-res').innerText = video.videoWidth ? `${video.videoWidth} x ${video.videoHeight}` : 'Hesaplanıyor...'; 
    if (hls && hls.levels && hls.currentLevel >= 0) { 
      const level = hls.levels[hls.currentLevel]; 
      document.getElementById('stat-bit').innerText = level.bitrate ? (level.bitrate / 1000).toFixed(0) + ' kbps' : 'Otomatik'; 
      document.getElementById('stat-fps').innerText = level.frameRate ? level.frameRate + ' fps' : (video.videoWidth ? 'Stabilize Ediliyor' : 'Orijinal'); 
    } else { 
      document.getElementById('stat-bit').innerText = 'Doğrudan Akış'; document.getElementById('stat-fps').innerText = 'Orijinal'; 
    } 
  }
  
  let timeout; 
  function resetControls() { vContainer.classList.remove('idle'); clearTimeout(timeout); timeout = setTimeout(() => { if (!video.paused && !document.getElementById('video-channel-menu').classList.contains('open')) vContainer.classList.add('idle'); }, 3000); }
  vContainer.addEventListener('mousemove', resetControls); vContainer.addEventListener('touchstart', resetControls); 
  vContainer.addEventListener('mouseleave', () => { if (!video.paused) vContainer.classList.add('idle'); });
}
</script>
</body>
</html>
