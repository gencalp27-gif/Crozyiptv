function parseM3U(text, arr, cats, isSeries) {
  const seen = new Set(arr.map(x => x.url));
  let meta = null;
  for (const raw of text.split('\n')) {
    const line = raw.trim();
    if (!line || line.startsWith('#EXTM3U')) continue;
    if (line.startsWith('#EXTINF:')) {
      const group = (line.match(/group-title="([^"]*)"/) || [])[1] || 'Genel';
      const logo = (line.match(/tvg-logo="([^"]*)"/) || [])[1] || '';
      const comma = line.indexOf(',', line.lastIndexOf('"'));
      meta = { name: line.slice(comma + 1).trim() || 'İsimsiz', logo, group, kind: isSeries ? 'tv' : 'movie' };
    } else if (/^https?:/i.test(line) && meta) {
      if (!seen.has(line)) { seen.add(line); arr.push({ ...meta, url: line }); cats.add(meta.group); }
      meta = null;
    }
  }
}
async function loadList(m) {
  const L = LISTS[m];

  L.state = 'loading';
  try {
    const r = await fetchRetry(L.url, { cache: 'no-cache' });
    if (!r.ok) throw new Error(r.status);
    parseM3U(await r.text(), L.items, L.cats, m === 'SERIES');
    L.state = 'ok';
  } catch (e) { L.state = 'error'; console.error(e); }
  if (mode === m) { renderCategories(); renderList(true); }
}

const TMDB = 'https://api.themoviedb.org/3', IMG = 'https://image.tmdb.org/t/p/';

function saveTmdb() {

    const k = Object.keys(tmdbCache);

    store.set('ihs_tmdb', JSON.stringify(tmdbCache));

function splitTitle(name) {

    .replace(/\b(\d+\.?\s?(sezon|bölüm))\b/gi, '')

}

  const yp = item.kind === 'tv' ? '&first_air_date_year=' : '&year=';
  const q = y => fetchRetry(`${TMDB}/search/${item.kind}?api_key=${CONFIG.tmdbKey}&query=${encodeURIComponent(title)}&language=tr-TR${y ? yp + y : ''}`).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
  let d = await q(year);
  if (year && !(d.results && d.results.length)) d = await q('');
  const r = d.results && d.results[0];
  const info = r ? { id: r.id, poster: r.poster_path || '', rating: r.vote_average ? +r.vote_average.toFixed(1) : 0, year: (r.release_date || r.first_air_date || '').slice(0, 4) } : { id: 0 };
  tmdbCache[key] = info; saveTmdb();

}

}
function applyMeta(it, row) {
  if (it.poster) { const img = row.querySelector('img'); if (img) img.src = it.poster; }
  if ((it.rating || it.year) && !row.querySelector('.rr')) {
    const d = document.createElement('div'); d.className = 'rr';
    d.innerHTML = (it.rating ? '<i class="fas fa-star"></i> ' + it.rating : '') + (it.year ? '<span>' + it.year + '</span>' : '');

}
function processTmdb() {
  if (fetchingTmdb || !tmdbQueue.length) return;
  fetchingTmdb = true;

  tmdbFind(item).then(info => { adopt(item, info); applyMeta(item, row); })
    .catch(() => { item.fetched = false; })
    .finally(() => { fetchingTmdb = false; setTimeout(processTmdb, 120); });
}

const fmt = s => {
  if (!isFinite(s)) return '0:00';

  return h ? `${h}:${p(m)}:${p(sec)}` : `${m}:${p(sec)}`;
};

}

  video.addEventListener('play', () => pp.innerHTML = '<i class="fas fa-pause"></i>');
  video.addEventListener('pause', () => pp.innerHTML = '<i class="fas fa-play"></i>');
  video.addEventListener('playing', () => { spin.style.display = 'none'; $('err').style.display = 'none'; });
  video.addEventListener('waiting', () => { if (activeItem) spin.style.display = 'block'; });
  video.addEventListener('error', () => {

    const end = mediaEnd();
    if (end && +seek.max !== end) { seek.max = end; $('tot').textContent = fmt(end); }
    if (!seeking) seek.value = video.currentTime;
    $('cur').textContent = fmt(video.currentTime);
    const now = Date.now();
    if (video.currentTime > 5 && now - lastSave > 3000) { lastSave = now; store.set('ihs_resume_' + activeItem.url, video.currentTime); }
  });
  seek.addEventListener('input', () => { seeking = true; $('cur').textContent = fmt(+seek.value); });
  seek.addEventListener('change', () => { seeking = false; seekTo(+seek.value); });

  video.addEventListener('ended', () => {
    if (activeItem) store.set('ihs_resume_' + activeItem.url, 0);
    if (!display.length || activeIndex < 0) return;
    const nx = display[(activeIndex + 1) % display.length];
    $('an-name').textContent = nx.name; $('nov').style.display = 'flex';
    let n = 5; $('an-count').textContent = n;
    clearInterval(autoTimer);
    autoTimer = setInterval(() => { $('an-count').textContent = --n; if (n <= 0) { cancelAutoNext(); playStream(nx); } }, 1000);
  });

  const zone = (id, ind, dir) => {
    let last = 0, timer = null;
    $(id).addEventListener('click', () => {
      const now = Date.now();
      if (now - last < 300) { clearTimeout(timer); last = 0; seekBy(10 * dir); animateTap(ind); }
      else { last = now; timer = setTimeout(togglePlay, 300); }
    });
  };
  zone('tap-l', 'ind-l', -1); zone('tap-r', 'ind-r', 1);
  video.onclick = togglePlay;

  let idleT;
  const wake = () => { vc.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => { if (!video.paused) vc.classList.add('idle'); }, 2500); };
  vc.addEventListener('mousemove', wake); vc.addEventListener('touchstart', wake, { passive: true });
  vc.addEventListener('mouseleave', () => { if (!video.paused) vc.classList.add('idle'); });

  document.addEventListener('keydown', e => {
    const tag = document.activeElement.tagName;
    if (tag === 'INPUT' || tag === 'BUTTON' || $('modal').classList.contains('open')) return;
    const k = e.code;
    if (k === 'Space') { e.preventDefault(); togglePlay(); }
    else if (k === 'KeyF') { e.preventDefault(); toggleFullscreen(); }
    else if (k === 'ArrowLeft') { e.preventDefault(); seekBy(e.shiftKey ? -30 : -10); }
    else if (k === 'ArrowRight') { e.preventDefault(); seekBy(e.shiftKey ? 30 : 10); }
    else if (k === 'ArrowUp' || k === 'ArrowDown') {
      e.preventDefault();
      video.volume = Math.max(0, Math.min(1, video.volume + (k === 'ArrowUp' ? .1 : -.1)));
      vol.value = video.volume; video.muted = false; volIcon();
    }
  });
}

function setupExtras() {
  $('b-info').onclick = () => { if (activeItem) openDetail(activeItem); };
  $('mclose').onclick = closeDetail;
  $('modal').addEventListener('click', e => { if (e.target === $('modal')) closeDetail(); });
  $('md-play').onclick = () => { const it = detailItem; closeDetail(); if (it) playStream(it); };
  $('md-fav').onclick = () => {
    if (!detailItem) return;
    const i = favorites.indexOf(detailItem.url);
    if (i > -1) favorites.splice(i, 1); else favorites.push(detailItem.url);
    store.set('ihs_favorites', JSON.stringify(favorites)); favChanged = true; setDetailFav();
  };
  $('md-trailer').onclick = () => {
    const box = $('trailer');
    if (box.firstChild) { box.innerHTML = ''; box.classList.remove('show'); return; }
    if (!trailerKey) return;
    const f = document.createElement('iframe');
    f.src = 'https://www.youtube.com/embed/' + encodeURIComponent(trailerKey) + '?autoplay=1&rel=0';
    f.allow = 'autoplay; encrypted-media; fullscreen; picture-in-picture'; f.allowFullscreen = true;
    box.appendChild(f); box.classList.add('show');
  };
  $('cm-x').onclick = closeCatMenu;
  $('cm-s').addEventListener('input', fillCatMenu);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeCatMenu(); closeDetail(); } });
  window.addEventListener('offline', () => toast('İnternet bağlantısı kesildi'));
  window.addEventListener('online', () => toast('Bağlantı geri geldi'));
  if ('mediaSession' in navigator) {
    const set = (a, f) => { try { navigator.mediaSession.setActionHandler(a, f); } catch {} };
    set('play', () => video.play()); set('pause', () => video.pause());
    set('previoustrack', () => step(-1)); set('nexttrack', () => step(1));
    set('seekbackward', () => seekBy(-10)); set('seekforward', () => seekBy(10));
  }
}

/* ===== OYNATMA ===== */
function embedFor(url) {
  let m;
  if (url.includes('ok.ru/video/')) return 'https://ok.ru/videoembed/' + url.split('/video/')[1].split('?')[0];
  if ((m = url.match(/youtube\.com\/watch\?v=([^&]+)/)) || (m = url.match(/youtu\.be\/([^?]+)/))) return 'https://www.youtube.com/embed/' + m[1];
  if (url.includes('vixolity.com/vs/') || url.includes('/embed/') || url.includes('player.php')) return url;
  return null;
}
const proxyList = url => CONFIG.proxyBases.filter(Boolean).map(b => b + encodeURIComponent(url));
const needsProxy = url => ['daioncdn', 'turknet', 'token=', 'sid=', 'ercdn'].some(d => url.includes(d));

function playStream(item, forceProxy, startAt, proxyIndex = 0) {
  usedProxy = !!forceProxy;
  if (startAt === undefined) { const s = parseFloat(store.get('ihs_resume_' + item.url, '0')); startAt = s > 30 ? s : 0; }
  pendingStart = startAt || 0;
  stopPlayback();
  activeItem = item; activeIndex = display.indexOf(item);
  $('ptitle').textContent = item.name;
  if ('mediaSession' in navigator && window.MediaMetadata) navigator.mediaSession.metadata = new MediaMetadata({ title: item.name, artist: 'IHS' });
  spin.style.display = 'block'; updateActiveUI();

  const embed = embedFor(item.url);
  if (embed) {
    vc.classList.add('embed'); video.style.display = 'none'; $('controls').style.display = 'none';
    const f = document.createElement('iframe');
    f.id = 'ihs-iframe'; f.src = embed + (embed.includes('?') ? '&' : '?') + 'autoplay=1';
    f.allow = 'autoplay; encrypted-media; fullscreen; picture-in-picture'; f.allowFullscreen = true;
    f.style.cssText = 'width:100%;height:100%;border:0;position:absolute;inset:0;z-index:5';
    vc.appendChild(f); spin.style.display = 'none';
    return;
  }

  let src = item.url;
  const proxies = proxyList(item.url);
  const mixed = location.protocol === 'https:' && src.startsWith('http:');
  if (mixed || needsProxy(src) || forceProxy) { src = proxies[proxyIndex] || src; usedProxy = !!proxies[proxyIndex]; }

  const isHls = /\.m3u8(?:[?#].*)?$/i.test(item.url);
  if (isHls && window.Hls && Hls.isSupported()) {
    let netRetries = 0, mediaRetries = 0;
    hls = new Hls({
      enableWorker: true, lowLatencyMode: false, backBufferLength: 60, maxBufferLength: 60, maxMaxBufferLength: 300,
      maxBufferSize: 60 * 1024 * 1024, manifestLoadingTimeOut: 20000, manifestLoadingMaxRetry: 3,
      levelLoadingTimeOut: 20000, levelLoadingMaxRetry: 3, fragLoadingTimeOut: 30000, fragLoadingMaxRetry: 5
    });
    hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
    hls.on(Hls.Events.ERROR, (_, d) => {
      if (!d.fatal) return;
      if (d.type === Hls.ErrorTypes.NETWORK_ERROR) {
        if (netRetries++ < CONFIG.hlsRetries) { hls.startLoad(); return; }
        if (proxies[proxyIndex + 1]) { hls.destroy(); hls = null; toast('Yedek yol deneniyor…'); playStream(item, true, pendingStart, proxyIndex + 1); return; }
        if (!usedProxy && proxies[0]) { hls.destroy(); hls = null; toast('Alternatif proxy deneniyor…'); playStream(item, true, pendingStart, 0); return; }
      } else if (d.type === Hls.ErrorTypes.MEDIA_ERROR && mediaRetries++ < CONFIG.hlsRetries) { hls.recoverMediaError(); return; }
      showError('Bağlantı kurulamadı. Kaynak geçici olarak kapalı olabilir.');
    });
    hls.loadSource(src); hls.attachMedia(video);
  } else if (isHls && video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = src; video.play().catch(() => {});
  } else {
    video.src = src; video.play().catch(() => {});
  }
}

window.addEventListener('beforeunload', () => {
  if (activeItem && video.currentTime > 5) store.set('ihs_resume_' + activeItem.url, video.currentTime);
});
</script>
