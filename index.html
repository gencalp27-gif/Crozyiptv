    body { background-color: var(--bg-main); color: var(--text-main); font-family: system-ui, -apple-system, sans-serif; height: 100dvh; overflow: hidden; transition: background-color 0.5s; }

    body.cinema-mode { background-color: #000; }
    body.cinema-mode .sidebar-section { opacity: 0.05; pointer-events: none; filter: blur(3px); transition: 0.5s; }

    .security-screen, .ban-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; background: var(--bg-main); z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    .ban-screen { display: none; background: #050505; }
    .security-logo { width: 70px; height: 70px; background: linear-gradient(135deg, #ff4b4b, #8b0000); transform: rotate(45deg); box-shadow: 0 0 20px rgba(229, 9, 20, 0.5); border: 2px solid #ff7a7a; margin-bottom: 40px; }

    .password-input { background: var(--bg-card); border: 1px solid #333; border-radius: 8px; color: white; padding: 12px 20px; font-size: 16px; width: 250px; text-align: center; margin-bottom: 15px; letter-spacing: 2px; }
    .password-input:focus { border-color: var(--ihs-red); }
    .login-btn { background: var(--ihs-red); color: white; border: none; padding: 12px 40px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.2s; }

    .error-msg { color: var(--ihs-red); font-size: 13px; font-weight: bold; margin-top: 15px; display: none; }

    .app-wrapper { display: none; width: 100vw; height: 100dvh; overflow: hidden; }

    /* OYNATICI BÖLÜMÜ */
    .player-section { background: #000; z-index: 10; display: flex; flex-direction: column; position: relative; transition: 0.5s; }
    .video-container { width: 100%; height: 100%; background: #000; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }

    .smart-actions { position: absolute; top: 15px; right: 15px; display: flex; gap: 10px; z-index: 20; opacity: 1; transition: opacity 0.4s ease; }
    .sa-btn { background: rgba(10,10,10,0.6); backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.1); color: #fff; width: 38px; height: 38px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    .sa-btn:hover { background: var(--ihs-red); border-color: var(--ihs-red); transform: scale(1.1); }

    /* YENİ: ÖZEL KONTROL ÇUBUĞU (IHS Player) */
    .custom-controls { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0) 100%); display: flex; flex-direction: column; padding: 40px 20px 15px 20px; z-index: 20; opacity: 1; transition: opacity 0.4s ease; }
    
    /* Akıllı Gizlenme Sınıfı */
    .video-container.idle .custom-controls, .video-container.idle .smart-actions { opacity: 0 !important; pointer-events: none; }
    
    .progress-container { display: flex; align-items: center; gap: 15px; width: 100%; margin-bottom: 12px; }
    .time-text { font-size: 12px; font-family: monospace; color: #ddd; min-width: 45px; text-align: center; }
    .seek-bar { flex: 1; -webkit-appearance: none; background: rgba(255,255,255,0.2); height: 5px; border-radius: 5px; outline: none; cursor: pointer; transition: height 0.2s; }
    .seek-bar:hover { height: 7px; }
    .seek-bar::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 15px; height: 15px; border-radius: 50%; background: var(--ihs-red); cursor: pointer; transition: 0.2s; box-shadow: 0 0 10px rgba(229,9,20,0.5); }
    .seek-bar::-webkit-slider-thumb:hover { transform: scale(1.3); }

    .control-buttons { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    .controls-left, .controls-right { display: flex; align-items: center; gap: 20px; }
    .control-btn { background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; transition: 0.2s; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
    .control-btn:hover { color: var(--ihs-red); transform: scale(1.1); }

    .tap-zone { position: absolute; top: 0; width: 35%; height: 100%; z-index: 10; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }
    .tap-left { left: 0; } .tap-right { right: 0; }
    .tap-indicator { background: rgba(0,0,0,0.6); color: #fff; font-size: 24px; font-weight: bold; padding: 15px 25px; border-radius: 30px; display: flex; flex-direction: column; align-items: center; gap: 5px; opacity: 0; transform: scale(0.8); transition: 0.2s ease-out; pointer-events: none; }
    .tap-indicator.show { opacity: 1; transform: scale(1); animation: fadeOutTap 0.6s forwards; }

    .auto-next-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 25; display: none; flex-direction: column; align-items: center; justify-content: center; color: #fff; backdrop-filter: blur(5px); }
    .auto-next-spinner { width: 60px; height: 60px; border: 4px solid rgba(255,255,255,0.1); border-top-color: var(--ihs-red); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; position: relative; display: flex; align-items: center; justify-content: center; }
    .auto-next-count { position: absolute; font-size: 22px; font-weight: bold; }
    .auto-next-title { font-size: 16px; color: #aaa; margin-bottom: 5px; }
    .auto-next-name { font-size: 22px; font-weight: 800; max-width: 80%; text-align: center; }
    .cancel-next-btn { margin-top: 20px; background: transparent; border: 1px solid #555; color: #ccc; padding: 8px 20px; border-radius: 20px; cursor: pointer; transition: 0.2s; }
    .cancel-next-btn:hover { background: #333; color: #fff; }

    .loading-spinner { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.1); border-top-color: var(--ihs-red); border-radius: 50%; animation: spin 1s linear infinite; z-index: 15; display: none; }
    @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
    
    .error-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 16; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
    .error-overlay i { font-size: 45px; color: var(--ihs-red); margin-bottom: 15px; }
    .fallback-msg { color: #bbb; font-size: 14px; margin-top: 5px; font-weight: 600; }

    /* LİSTE BÖLÜMÜ */
    .sidebar-section { display: flex; flex-direction: column; background: var(--bg-card); overflow: hidden; flex: 1; position: relative; min-width: 0; transition: 0.5s; }
    .tab-container { display: flex; background: var(--bg-main); border-bottom: 1px solid var(--border-color); flex-shrink: 0; }

    .tab-btn.active { color: #fff; border-bottom-color: var(--ihs-red); background: rgba(255,255,255,0.02); }

    .search-container { padding: 12px 15px; background: var(--bg-card); flex-shrink: 0; }

    .channel-row-name { flex: 1; font-weight: 600; font-size: 13px; color: #eee; }
    .fav-icon { font-size: 16px; color: #444; padding: 8px; transition: 0.3s; z-index: 2; }
    .fav-icon:hover { transform: scale(1.2); }
    .fav-icon.active { color: var(--ihs-red); text-shadow: 0 0 10px rgba(229,9,20,0.5); }

    .netflix-row-container { margin-bottom: 20px; }
    .netflix-row-title { font-size: 14px; font-weight: 700; color: #fff; margin: 0 0 8px 8px; display: flex; justify-content: space-between; align-items: baseline; }
    
    .netflix-row { display: flex; gap: 10px; overflow-x: auto; padding: 5px 8px; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; align-items: flex-start; }
    .netflix-row::-webkit-scrollbar { height: 4px; }
    .netflix-row::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    .netflix-row .movie-card { flex: 0 0 110px; scroll-snap-align: start; }

    .movie-card { border-radius: 8px; overflow: hidden; position: relative; aspect-ratio: 2 / 3; background: #1a1a1a; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s, border 0.2s; border: 1px solid #333; flex-shrink: 0; }
    .movie-card:hover { transform: scale(1.03); z-index: 2; border-color: var(--ihs-red); box-shadow: 0 5px 15px rgba(229,9,20,0.5); }

    .movie-title-fallback { position: absolute; width: 100%; padding: 10px; text-align: center; font-size: 11px; font-weight: 700; color: #555; z-index: 0; }
    .movie-poster { width: 100%; height: 100%; object-fit: cover; object-position: center top; z-index: 1; transition: opacity 0.3s; opacity: 0; }

    /* İFRAME OYNATICI STİLLERİ */
    .iframe-wrapper { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 12; background: #000; }

    /* RESPONSIVE YERLEŞİM */
    @media (max-width: 899px) {

      .player-section { width: 100%; flex-shrink: 0; }

  </style>
</head>

function initApp() {
  parseM3UContent(tvData, tvChannels, tvCategories);
  fetch('https://raw.githubusercontent.com/gencalp27-gif/Crozyiptv/main/film.m3u')
    .then(res => res.text())
    .then(data => { parseFlexibleM3U(data, movies, movieCategories); if(currentMode === 'MOVIE') renderContentList(true); })
    .catch(e => console.log("Film yüklenemedi"));

  setupSmartFeatures();
  setupCustomControls();
  switchMode('TV'); 
}

function parseM3UContent(content, targetArray, targetCategories) {
  const lines = content.split('\n'); let currentObj = null;
  for (let i = 0; i < lines.length; i++) {
    let line = lines[i].trim(); if (!line) continue;
    if (line.startsWith('#EXTINF:')) {
      let group = (line.match(/group-title="([^"]+)"/) || [])[1] || 'Genel';
      let name = line.split(',').pop().trim();
      currentObj = { name, logo: (line.match(/tvg-logo="([^"]+)"/) || [])[1] || '', group }; 
      targetCategories.add(finalGroup);
    } else if (line.startsWith('http')) { 
      if (currentObj) { currentObj.url = line; targetArray.push(currentObj); currentObj = null; } 
    }
  }
}

function parseFlexibleM3U(content, targetArray, targetCategories) {
  const lines = content.split('\n'); let pendingMeta = null; let pendingUrl = null;
  for (let i = 0; i < lines.length; i++) {
    let line = lines[i].trim(); if (!line || line.startsWith('#EXTM3U')) continue;
    if (line.startsWith('#EXTINF:')) {
      let group = (line.match(/group-title="([^"]+)"/) || [])[1] || 'Genel';
      targetCategories.add(group);
      pendingMeta = { name: line.split(',').pop().trim(), logo: (line.match(/tvg-logo="([^"]+)"/) || [])[1] || '', group };
    } else if (line.startsWith('http')) { pendingUrl = line; }
    if (pendingMeta && pendingUrl) { targetArray.push({ ...pendingMeta, url: pendingUrl }); pendingMeta = null; pendingUrl = null; }
  }
}

function switchMode(mode) {
  if (!video.paused) video.pause(); 
  currentMode = mode;
  document.getElementById('tab-tv').className = mode === 'TV' ? 'tab-btn active' : 'tab-btn';
  document.getElementById('tab-movie').className = mode === 'MOVIE' ? 'tab-btn active' : 'tab-btn';
  document.getElementById('search-input').placeholder = mode === 'MOVIE' ? "Film ara..." : "Kanal ara...";
  currentCategory = 'Tümü'; document.getElementById('search-input').value = ''; 
  renderCategoriesOnly(); renderContentList(true);
}

function renderCategoriesOnly() {
  const catBar = document.getElementById('categories-bar'); catBar.innerHTML = '';
  const categoriesSet = currentMode === 'TV' ? tvCategories : movieCategories;
  if(currentMode === 'TV') {
      const createBtn = (txt, isFav=false) => { 
        const btn = document.createElement('button'); btn.className = 'cat-btn' + (isFav ? ' cat-btn-fav' : '') + (currentCategory===txt ? ' active' : ''); 
        btn.innerHTML = isFav ? `<i class="fas fa-heart"></i> ${txt}` : txt; btn.onclick = () => { selectCategory(txt); }; catBar.appendChild(btn); 
      };
      createBtn('Favorilerim', true); createBtn('Tümü'); 
      Array.from(categoriesSet).sort(new Intl.Collator('tr').compare).forEach(cat => createBtn(cat));
  } else {
      const btnAll = document.createElement('button'); btnAll.className = 'cat-btn movie-cat' + (currentCategory==='Tümü' ? ' active' : ''); 
      btnAll.innerText = 'Tümü'; btnAll.onclick = () => selectCategory('Tümü'); catBar.appendChild(btnAll);
      const btnMenu = document.createElement('button'); btnMenu.className = 'cat-btn movie-cat'; 
      btnMenu.innerHTML = `<i class="fas fa-list-ul"></i> Kategoriler`; btnMenu.onclick = openCategoryMenu; catBar.appendChild(btnMenu);
      if (currentCategory !== 'Tümü') { 
         const btnCurrent = document.createElement('button'); btnCurrent.className = 'cat-btn movie-cat active'; 
         btnCurrent.innerText = currentCategory; btnCurrent.onclick = () => openCategoryMenu(); catBar.appendChild(btnCurrent); 
      }
  }
}

function selectCategory(catName) { currentCategory = catName; document.getElementById('search-input').value = ''; renderCategoriesOnly(); renderContentList(true); }
function openCategoryMenu() { 
  const cmList = document.getElementById('cm-list'); cmList.innerHTML = ''; 
  Array.from(movieCategories).sort(new Intl.Collator('tr').compare).forEach(cat => { 
    const item = document.createElement('div'); item.className = 'cm-item' + (currentCategory === cat ? ' active' : ''); item.innerText = cat; 
    item.onclick = () => { selectCategory(cat); closeCategoryMenu(); }; cmList.appendChild(item); 
  }); 
  document.getElementById('category-menu').classList.add('open'); 
}
function closeCategoryMenu() { document.getElementById('category-menu').classList.remove('open'); }
function searchContent() { renderContentList(true); }
function toggleFavorite(e, channelName) { 
  e.stopPropagation(); const index = favorites.indexOf(channelName); 
  if (index > -1) favorites.splice(index, 1); else favorites.push(channelName); 
  localStorage.setItem('ihs_favorites', JSON.stringify(favorites)); renderContentList(true); 
}

function createMovieCard(c, index) {
    const safeName = c.name.replace(/</g, "&lt;").replace(/>/g, "&gt;"); 
    const card = document.createElement('div'); 
    card.className = 'movie-card' + (activeItemUrl === c.url ? ' active-movie' : ''); card.setAttribute('data-url', c.url);
    const initialPoster = c.logo && c.logo.startsWith('http') ? c.logo : '';
    card.innerHTML = `
      <div class="movie-poster-wrap">
        <div class="movie-title-fallback">${safeName}</div>
        <img class="movie-poster" src="${initialPoster}" loading="lazy" onload="this.style.opacity='1'" onerror="this.style.opacity='0'">
        <div class="movie-title-overlay">${safeName}</div>
        <div class="play-icon-overlay"><i class="fas fa-play-circle"></i></div>
      </div>
    `;
    card.onclick = (e) => { e.stopPropagation(); playStream(c, index); }; 
    if(initialPoster) { setTimeout(() => { const img = card.querySelector('.movie-poster'); if(img) img.style.opacity = '1'; }, 50); }
    return card;
}

function renderContentList(reset = false) {
  const contentArea = document.getElementById('content-area'); const dataset = currentMode === 'TV' ? tvChannels : movies; 
  const query = document.getElementById('search-input').value.toLocaleLowerCase('tr-TR');
  
  if (reset) { 
    currentRenderCount = 0; contentArea.innerHTML = ''; 
    if (currentCategory === 'Favorilerim') { currentDisplayList = dataset.filter(c => favorites.includes(c.name)); } 
    else { currentDisplayList = currentCategory === 'Tümü' ? dataset : dataset.filter(c => c.group === currentCategory); } 
    if (query) currentDisplayList = currentDisplayList.filter(c => c.name.toLocaleLowerCase('tr-TR').includes(query)); 
  }

  if (currentMode === 'MOVIE' && currentCategory === 'Tümü' && query === '') {
      contentArea.className = 'content-area'; if(!reset) return; 
      Array.from(movieCategories).sort(new Intl.Collator('tr').compare).forEach(cat => {
          const catMovies = movies.filter(m => m.group === cat); if(catMovies.length === 0) return;
          const rowCont = document.createElement('div'); rowCont.className = 'netflix-row-container'; 
          rowCont.innerHTML = `<div class="netflix-row-title">${cat} <span class="see-all" onclick="selectCategory('${cat}')">Tümünü Gör <i class="fas fa-chevron-right"></i></span></div>`;
          const row = document.createElement('div'); row.className = 'netflix-row'; 
          const limit = Math.min(catMovies.length, 30); 
          for(let i = 0; i < limit; i++) { row.appendChild(createMovieCard(catMovies[i], movies.indexOf(catMovies[i]))); } 
          rowCont.appendChild(row); contentArea.appendChild(rowCont);
      }); return;
  }

  contentArea.className = currentMode === 'TV' ? 'content-area' : 'content-area movie-grid'; 
  const fragment = document.createDocumentFragment(); const endIndex = Math.min(currentRenderCount + RENDER_CHUNK, currentDisplayList.length);
  for (let i = currentRenderCount; i < endIndex; i++) {
    const c = currentDisplayList[i]; const realIdx = dataset.indexOf(c); const safeName = c.name.replace(/</g, "&lt;").replace(/>/g, "&gt;"); 
    if(currentMode === 'TV') {
      const isFav = favorites.includes(c.name); 
      const row = document.createElement('div'); row.className = 'channel-row' + (activeItemUrl === c.url ? ' active-channel' : ''); row.setAttribute('data-url', c.url);
      row.innerHTML = `<img src="${c.logo}" loading="lazy" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'150\' height=\'150\' fill=\'%23222\'><rect width=\'150\' height=\'150\'/><text x=\'50%\' y=\'50%\' fill=\'%23aaa\' font-size=\'16\' font-family=\'sans-serif\' dominant-baseline=\'middle\' text-anchor=\'middle\'>TV</text></svg>'"><div class="channel-row-name">${safeName}</div><i class="${isFav ? 'fas' : 'far'} fa-heart fav-icon ${isFav ? 'active' : ''}" onclick="toggleFavorite(event, '${safeName.replace(/'/g, "\\'")}')"></i>`; 
      row.onclick = () => playStream(c, realIdx); fragment.appendChild(row);
    } else { fragment.appendChild(createMovieCard(c, realIdx)); }
  }
  contentArea.appendChild(fragment); currentRenderCount = endIndex;
}

function updateActiveCardUI() { 
  document.querySelectorAll('.channel-row, .movie-card').forEach(el => { 
    if(el.getAttribute('data-url') === activeItemUrl) el.classList.add(currentMode === 'TV' ? 'active-channel' : 'active-movie'); 
    else el.classList.remove('active-channel', 'active-movie'); 
  }); 
}

function setupCustomControls() {
    const playBtn = document.getElementById('play-pause-btn');
    const muteBtn = document.getElementById('mute-btn');
    const seekBar = document.getElementById('seek-bar');
    const vContainer = document.getElementById('video-container');
    
    // Play / Pause
    function togglePlay() { if(video.paused) video.play(); else video.pause(); }
    playBtn.onclick = (e) => { e.stopPropagation(); togglePlay(); };
    video.onclick = togglePlay;
    
    video.addEventListener('play', () => { playBtn.innerHTML = '<i class="fas fa-pause"></i>'; });
    video.addEventListener('pause', () => { playBtn.innerHTML = '<i class="fas fa-play"></i>'; });
    
    // Ses
    muteBtn.onclick = (e) => { e.stopPropagation(); video.muted = !video.muted; muteBtn.innerHTML = video.muted ? '<i class="fas fa-volume-mute"></i>' : '<i class="fas fa-volume-up"></i>'; };
    
    // Süre & Seekbar
    video.addEventListener('loadedmetadata', () => { 
        if(video.duration && video.duration !== Infinity) { 
            seekBar.max = video.duration; document.getElementById('total-time').innerText = formatTime(video.duration); 
        } 
    });
    video.addEventListener('timeupdate', () => { 
        if(!seekBar.active) seekBar.value = video.currentTime; 
        document.getElementById('current-time').innerText = formatTime(video.currentTime); 
    });
    
    seekBar.addEventListener('mousedown', () => seekBar.active = true);
    seekBar.addEventListener('touchstart', () => seekBar.active = true);
    seekBar.addEventListener('change', () => { video.currentTime = seekBar.value; seekBar.active = false; });
    seekBar.addEventListener('touchend', () => { video.currentTime = seekBar.value; seekBar.active = false; });

    // Fare hareketsizliğinde kontrolleri gizle
    let idleTimeout;
    function resetIdle() {
        vContainer.classList.remove('idle');
        clearTimeout(idleTimeout);
        idleTimeout = setTimeout(() => {
            if(!video.paused) vContainer.classList.add('idle');
        }, 2500);
    }
    vContainer.addEventListener('mousemove', resetIdle);
    vContainer.addEventListener('touchstart', resetIdle);
    vContainer.addEventListener('mouseleave', () => { if(!video.paused) vContainer.classList.add('idle'); });
}

// AKILLI ÖZELLİKLER (Hafıza, PiP, Çift Tık)
function setupSmartFeatures() {
    video.addEventListener('timeupdate', () => {
        if (currentMode === 'MOVIE' && activeItemUrl && video.currentTime > 5 && video.duration > 0) {
            localStorage.setItem('ihs_resume_' + activeItemUrl, video.currentTime);
        }
    });

    video.addEventListener('loadedmetadata', () => {
        if (currentMode === 'MOVIE') {
            const savedTime = localStorage.getItem('ihs_resume_' + activeItemUrl);
            if (savedTime && parseFloat(savedTime) < video.duration - 10) {
                isRestoringTime = true; video.currentTime = parseFloat(savedTime);
                setTimeout(() => { isRestoringTime = false; }, 1000);
            }
        }
    });

    video.addEventListener('ended', () => {
        if(currentDisplayList.length > 0 && activeChannelIndex > -1) {
            let nextIdx = activeChannelIndex + 1; if (nextIdx >= currentDisplayList.length) nextIdx = 0;
            const nextItem = currentDisplayList[nextIdx];
            document.getElementById('an-name').innerText = nextItem.name; document.getElementById('auto-next-overlay').style.display = 'flex';
            let count = 5; document.getElementById('an-count').innerText = count;
            autoNextTimer = setInterval(() => {
                count--; document.getElementById('an-count').innerText = count;
                if(count <= 0) { clearInterval(autoNextTimer); document.getElementById('auto-next-overlay').style.display = 'none'; playStream(nextItem, nextIdx); }
            }, 1000);
        }
    });

    let lastTapLeft = 0; let lastTapRight = 0;
    document.getElementById('tap-left').addEventListener('click', (e) => {
        const now = new Date().getTime(); if(now - lastTapLeft < 300) { seekVideo(-10); animateTap('ind-left'); } lastTapLeft = now;
    });
    document.getElementById('tap-right').addEventListener('click', (e) => {
        const now = new Date().getTime(); if(now - lastTapRight < 300) { seekVideo(10); animateTap('ind-right'); } lastTapRight = now;
    });
}

function seekVideo(amount) {
    if(video && video.duration) {
        let newTime = video.currentTime + amount;
        if(newTime < 0) newTime = 0; if(newTime > video.duration) newTime = video.duration;
        video.currentTime = newTime;
    }
}

function animateTap(id) {
    const el = document.getElementById(id); el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
}

function toggleCinema() { document.body.classList.toggle('cinema-mode'); }
function cancelAutoNext() { clearInterval(autoNextTimer); document.getElementById('auto-next-overlay').style.display = 'none'; }
function togglePip() {
    if (document.pictureInPictureElement) { document.exitPictureInPicture(); } 
    else if (document.pictureInPictureEnabled) { video.requestPictureInPicture().catch(()=>{}); } 
    else { alert("Tarayıcınız Yüzen Ekran (PiP) modunu desteklemiyor."); }
}
function requestCast() {
    if (video.remote && video.remote.state !== 'disconnected') { video.remote.prompt().catch(()=>{}); } 
    else if (video.webkitShowPlaybackTargetPicker) { video.webkitShowPlaybackTargetPicker(); } 
    else { alert("TV'ye Yansıtma donanımınız (Cast/AirPlay) bulunamadı."); }
}

// IŞIK HIZINDA DİREKT OYNATICI
function playStream(item, index) {
  activeItemUrl = item.url; activeChannelIndex = index; 
  cancelAutoNext();
  document.getElementById('error-overlay').style.display = 'none'; 
  document.getElementById('loading-spinner').style.display = 'block';
  
  if (hls) { hls.destroy(); hls = null; }
  const videoContainer = document.getElementById('video-container');
  let existingIframe = document.getElementById('ihs-iframe');
  if (existingIframe) existingIframe.remove();

  let embedUrl = item.url; let isEmbed = false;
  if (item.url) {
    if (item.url.includes('ok.ru/video/')) {
      embedUrl = `https://ok.ru/videoembed/${item.url.split('/video/')[1].split('?')[0]}`; isEmbed = true;
    } else if (item.url.includes('vixolity.com/vs/') || item.url.includes('/embed/') || item.url.includes('player.php')) {
      isEmbed = true;
    } else if (item.url.includes('youtube.com/watch?v=')) {
      embedUrl = `https://www.youtube.com/embed/${item.url.split('v=')[1].split('&')[0]}?autoplay=1`; isEmbed = true;
    } else if (item.url.includes('youtu.be/')) {
      embedUrl = `https://www.youtube.com/embed/${item.url.split('youtu.be/')[1].split('?')[0]}?autoplay=1`; isEmbed = true;
    }
  }

  if (isEmbed) {
    // İFRAME MODU (Orijinal site oynatıcısı ekranda kalır, bizim çubuk gizlenir)
    video.style.display = 'none';
    document.getElementById('custom-controls').style.display = 'none';
    embedUrl += (embedUrl.includes('?') ? '&' : '?') + 'autoplay=1'; 
    
    const iframe = document.createElement('iframe');
    iframe.id = 'ihs-iframe'; iframe.src = embedUrl;
    iframe.style.width = '100%'; iframe.style.height = '100%'; iframe.style.border = 'none'; iframe.style.position = 'absolute'; iframe.style.top = '0'; iframe.style.left = '0'; iframe.style.zIndex = '12';
    iframe.allow = 'autoplay; encrypted-media; fullscreen; picture-in-picture';
    
    videoContainer.appendChild(iframe);
    document.getElementById('loading-spinner').style.display = 'none';
  } else {
    // IHS ÖZEL KONTROL MODU (Tüm üst zeka eklentilerle birlikte çalışır)
    video.style.display = 'block';
    document.getElementById('custom-controls').style.display = 'flex';
    
    let targetUrl = item.url;
    let finalUrl = PROXY_BASE + encodeURIComponent(targetUrl);

    if (Hls.isSupported() && (targetUrl.includes('.m3u8') || targetUrl.includes('.ts') || currentMode === 'TV')) {
      hls = new Hls({ enableWorker: true, lowLatencyMode: true }); 
      hls.on(Hls.Events.ERROR, (e, data) => { 
        if (data.fatal) { 
           document.getElementById('loading-spinner').style.display = 'none'; 
           document.getElementById('error-overlay').style.display = 'flex'; 
        } 
      });
      hls.loadSource(targetUrl); // Direkt bağlantı
      hls.attachMedia(video); 
      hls.on(Hls.Events.MANIFEST_PARSED, () => { 
          video.play().catch(()=>{}); 
          document.getElementById('loading-spinner').style.display = 'none'; 
      });
    } else { 
      video.src = targetUrl; 
      video.play().catch(e => { document.getElementById('error-overlay').style.display = 'flex'; }); 
    }
  }
  updateActiveCardUI(); 
}

function formatTime(seconds) { 
  if(isNaN(seconds)) return "00:00"; 
  const m = Math.floor(seconds / 60); const s = Math.floor(seconds % 60); const h = Math.floor(m / 60); const mm = m % 60; 
  if(h > 0) return `${h}:${mm < 10 ? '0'+mm : mm}:${s < 10 ? '0'+s : s}`; 
  return `${m}:${s < 10 ? '0'+s : s}`; 
}
