<!DOCTYPE html>
<html lang="en" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PRO PLAYER</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #050505; 
      --bg-panel: #111;
      --primary-red: #e50914;
      --text-main: #f5f5f5; 
      --text-muted: #888;
      --border-color: #222;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
    
    body {
      background-color: var(--bg-dark); 
      color: var(--text-main);
      font-family: system-ui, sans-serif; 
      height: 100vh; 
      overflow: hidden; /* Sayfanın bütün olarak kaymasını engeller */
    }

    /* ANA EKRAN DÜZENİ */
    .app-wrapper {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* 1. ÜST SABİT ALAN (VİDEO + EPG + ARAMA) */
    .fixed-top {
      flex-shrink: 0;
      background: var(--bg-dark);
      z-index: 10;
      box-shadow: 0 5px 15px rgba(0,0,0,0.9);
      border-bottom: 1px solid var(--border-color);
    }

    .video-container { 
      width: 100%; 
      background: #000; 
    }
    .video-container video { 
      width: 100%; 
      aspect-ratio: 16/9; 
      object-fit: cover; 
      display: block;
    }

    /* Profesyonel EPG (Yayın Bilgi) Çubuğu */
    .epg-bar {
      display: none; 
      padding: 10px 15px;
      background: linear-gradient(to bottom, #1a1a1a, #050505);
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border-color);
    }
    .epg-logo {
      width: 35px; height: 35px;
      border-radius: 4px;
      background: #fff;
      padding: 2px;
      object-fit: contain;
    }
    .epg-info { flex: 1; }
    .epg-channel-name { font-weight: 700; font-size: 13px; margin-bottom: 4px; color: #fff;}
    .epg-program { font-size: 10px; color: var(--primary-red); margin-bottom: 5px; display: flex; justify-content: space-between; font-weight: bold;}
    .epg-progress-bg { width: 100%; height: 3px; background: #333; border-radius: 2px; overflow: hidden; }
    .epg-progress-fill { height: 100%; background: var(--primary-red); width: 0%; transition: width 1s; }

    /* Arama ve Geri Butonu Alanı */
    .toolbar {
      display: flex;
      align-items: center;
      padding: 10px 15px;
      gap: 10px;
      background: var(--bg-panel);
    }
    .back-btn { 
      background: #222; 
      color: var(--text-main); 
      border: 1px solid #333; 
      padding: 8px 15px; 
      border-radius: 6px; 
      font-weight: 600; 
      cursor: pointer; 
      display: none; 
    }
    .back-btn:active { background: var(--primary-red); }
    
    .search-box { 
      display: flex; align-items: center; flex: 1; 
      background: #000; border: 1px solid #333; border-radius: 6px; padding: 8px 12px; 
    }
    .search-box input { background: transparent; border: none; color: white; width: 100%; margin-left: 8px; font-size: 13px; }

    /* 2. ALT KAYAN ALAN (KATEGORİLER VE KANALLAR) */
    .scrollable-bottom {
      flex: 1;
      overflow-y: auto; 
      padding: 15px;
      background: var(--bg-dark);
    }

    .grid-layout { display: grid; grid-template-columns: repeat(auto-fill, minmax(105px, 1fr)); gap: 10px; }
    
    .folder-card, .channel-card { 
      background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 8px; 
      padding: 15px 10px; text-align: center; cursor: pointer; transition: 0.2s; 
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .folder-card:active, .channel-card:active { transform: scale(0.95); border-color: var(--primary-red); }
    
    .folder-card i { font-size: 28px; color: var(--text-muted); margin-bottom: 8px; }
    .folder-name { font-weight: 600; font-size: 12px; color: var(--text-main); }
    .folder-count { font-size: 10px; color: var(--text-muted); margin-top: 5px; }

    .channel-card { padding: 10px; }
    .channel-card img { width: 45px; height: 45px; object-fit: contain; margin-bottom: 8px; border-radius: 4px; background: #fff; padding: 3px; }
    .channel-name { font-weight: 600; font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; color: #ccc;}
  </style>
</head>
<body>

<div class="app-wrapper">
  
  <!-- ÜST SABİT KISIM (Asla hareket etmez) -->
  <div class="fixed-top">
    <div class="video-container">
      <video id="video-player" controls autoplay playsinline></video>
    </div>
    
    <div class="epg-bar" id="epg-bar">
      <img id="epg-logo" class="epg-logo" src="" alt="logo">
      <div class="epg-info">
        <div class="epg-channel-name" id="epg-channel-name">-</div>
        <div class="epg-program">
          <span>CANLI YAYIN</span>
          <span id="epg-time">--:--</span>
        </div>
        <div class="epg-progress-bg">
          <div class="epg-progress-fill" id="epg-progress"></div>
        </div>
      </div>
    </div>

    <div class="toolbar">
      <button class="back-btn" id="back-btn" onclick="showFolders()"><i class="fas fa-arrow-left"></i></button>
      <div class="search-box">
        <i class="fas fa-search" style="color: var(--text-muted);"></i>
        <input type="text" id="search-input" placeholder="Kanal ara..." onkeyup="searchChannels()">
      </div>
    </div>
  </div>

  <!-- ALT KAYAN KISIM (Sadece burası aşağı kayar) -->
  <div class="scrollable-bottom">
    <div id="error-box" style="color:red; font-weight:bold; padding:20px; display:none;"></div>
    <div class="grid-layout" id="folder-grid"></div>
    <div class="grid-layout" id="channels-grid" style="display: none;"></div>
  </div>

</div>

<script>
// HATALARI EKRANA YAZDIRAN KORUMA SİSTEMİ
window.onerror = function(msg, url, line) {
  const errBox = document.getElementById('error-box');
  errBox.style.display = 'block';
  errBox.innerHTML = "Sistem Hatası (Satır " + line + "): " + msg + "<br>Lütfen kodu kopyalarken eksik almadığına emin ol.";
};

// M3U LİSTESİ
const gomuluListe = `
#EXTM3U
#EXTINF:-1 tvg-logo="https://i.imgur.com/PexhKwp.png" group-title="Turkey",4U TV
https://hls.4utv.live/hls/stream.m3u8
#EXTINF:-1 tvg-logo="https://i.imgur.com/8FO41es.png" group-title="Turkey",24 TV
https://turkmedya-live.ercdn.net/tv24/tv24.m3u8
#EXTINF:-1 tvg-logo="https://i.imgur.com/agn47sQ.png" group-title="Turkey",360 TV
https://turkmedya-live.ercdn.net/tv360/tv360.m3u8
#EXTINF:-1 tvg-logo="https://iatv.tmgrup.com.tr/site/v2/a2tv/i/a2tv-logo.png" group-title="Turkey",A2TV
https://rnttwmjcin.turknet.ercdn.net/lcpmvefbyo/a2tv/a2tv.m3u8
#EXTINF:-1 tvg-logo="https://upload.wikimedia.org/wikipedia/commons/7/7c/Ahaber_Logo.png" group-title="Turkey",A Haber
https://rnttwmjcin.turknet.ercdn.net/lcpmvefbyo/ahaber/ahaber.m3u8
#EXTINF:-1 tvg-logo="https://i.imgur.com/ZhkZzLf.png" group-title="Turkey",A Spor
https://rnttwmjcin.turknet.ercdn.net/lcpmvefbyo/aspor/aspor.m3u8
#EXTINF:-1 tvg-logo="https://i.imgur.com/mgDCKiy.png" group-title="Turkey",Aksu TV
https://live.artidijitalmedya.com/artidijital_aksutv/aksutv/playlist.m3u8
#EXTINF:-1 tvg-logo="https://i.imgur.com/HyVUwFC.png" group-title="Turkey",ATV
https://rnttwmjcin.turknet.ercdn.net/lcpmvefbyo/atv/atv_1080p.m3u8
#EXTINF:-1 tvg-logo="https://upload.wikimedia.org/wikipedia/commons/thumb/4/43/Diyanet_TV_logo.svg/960px-Diyanet_TV_logo.svg.png" group-title="Turkey",Diyanet TV
https://eustr73.mediatriple.net/videoonlylive/mtikoimxnztxlive/broadcast_5e3bf95a47e07.smil/playlist.m3u8
#EXTINF:-1 tvg-logo="https://www.dsmart.com.tr/epg/images/0x60/5ffc18c6cfef0b15933a8b65" group-title="Turkey",Ekoturk
https://cdn.ekoturk.net/hls/master.m3u8
#EXTINF:-1 tvg-logo="https://upload.wikimedia.org/wikipedia/commons/thumb/e/ef/GZT_logo.svg/960px-GZT_logo.svg.png" group-title="Turkey",GZT
https://gzttv-live.lg.mncdn.com/gzttv/gzttv/playlist.m3u8
#EXTINF:-1 tvg-logo="https://i.imgur.com/xM0HA30.png" group-title="Turkey",Halk TV
https://halktv-live.daioncdn.net/halktv/halktv.m3u8
#EXTINF:-1 tvg-logo="https://www.htspor.com/images/manifest/social-share-logo.png" group-title="Turkey",HTSpor
https://ciner.daioncdn.net/ht-spor/ht-spor.m3u8?app=web
#EXTINF:-1 tvg-logo="https://i.imgur.com/9o1atM6.png" group-title="Turkey",Kanal D
https://demiroren.daioncdn.net/kanald/kanald.m3u8?app=kanald_web&ce=3
#EXTINF:-1 tvg-logo="https://uycyyuuzyh.turknet.ercdn.net/nphindgytw/nowtv/nowtv.m3u8" group-title="Turkey",NOW TV
https://uycyyuuzyh.turknet.ercdn.net/nphindgytw/nowtv/nowtv.m3u8
#EXTINF:-1 tvg-logo="https://upload.wikimedia.org/wikipedia/commons/thumb/0/0c/NTV_%28Turkey%29_logo.svg/960px-NTV_%28Turkey%29_logo.svg.png" group-title="Turkey",NTV
https://dogus.daioncdn.net/ntv/ntv.m3u8?app=ntv_web
#EXTINF:-1 tvg-logo="https://i.imgur.com/9O3DHRB.png" group-title="Turkey",Star TV
https://dogus.daioncdn.net/startv/startv_720p.m3u8?app=a20ac41e-bdc3-4aa1-934d-26b484480ac9&ce=3&sid=8l4w3lst4co5
#EXTINF:-1 tvg-logo="https://i.imgur.com/PrxwKDw.png" group-title="Turkey",TGRT Haber
https://canli.tgrthaber.com/tgrt.m3u8
#EXTINF:-1 tvg-logo="https://upload.wikimedia.org/wikipedia/commons/thumb/8/85/TRT_1_logo_%282021-%29.svg/960px-TRT_1_logo_%282021-%29.svg.png" group-title="Turkey",TRT 1
https://tv-trt1.medya.trt.com.tr/master.m3u8
#EXTINF:-1 tvg-logo="https://upload.wikimedia.org/wikipedia/commons/thumb/7/72/TRT_Haber_Eyl%C3%BCl_2020_Logo.svg/960px-TRT_Haber_Eyl%C3%BCl_2020_Logo.svg.png" group-title="Turkey",TRT Haber
https://tv-trthaber.medya.trt.com.tr/master.m3u8
`;

let allChannels = [];
let categories = new Set();
let currentCategory = '';
let hls = null;
const video = document.getElementById('video-player');

// Sayfa kodları okur okumaz sistemi başlatır
parseContent(gomuluListe);
updateFakeTime();

function updateFakeTime() {
  const now = new Date();
  let hour = now.getHours().toString().padStart(2, '0');
  let min = now.getMinutes().toString().padStart(2, '0');
  
  let endHour = (now.getHours() + 1).toString().padStart(2, '0');
  document.getElementById('epg-time').innerText = hour + ":" + min + " - " + endHour + ":00";
  
  const randomProgress = Math.floor(Math.random() * 70) + 15;
  document.getElementById('epg-progress').style.width = randomProgress + '%';
}

function parseContent(content) {
  const lines = content.split('\n');
  allChannels = []; 
  categories.clear(); 
  categories.add('Tüm Kanallar');

  let currentChannel = {};

  for (let i = 0; i < lines.length; i++) {
    let line = lines[i].trim();
    if (!line) continue;
    
    if (line.startsWith('#EXTINF:')) {
      const logoMatch = line.match(/tvg-logo="([^"]+)"/);
      const groupMatch = line.match(/group-title="([^"]+)"/);
      
      const logo = logoMatch ? logoMatch[1] : 'https://via.placeholder.com/150?text=TV';
      const group = groupMatch ? groupMatch[1] : 'Diğer';
      const name = line.split(',').pop().trim();
      
      currentChannel = { name: name, logo: logo, group: group };
      categories.add(group);
    } else if (line.startsWith('http')) {
      currentChannel.url = line;
      allChannels.push(currentChannel);
      currentChannel = {};
    }
  }
  showFolders(); 
}

function showFolders() {
  document.getElementById('folder-grid').style.display = 'grid';
  document.getElementById('channels-grid').style.display = 'none';
  document.getElementById('back-btn').style.display = 'none';
  document.getElementById('search-input').value = ''; 
  currentCategory = '';

  const grid = document.getElementById('folder-grid');
  grid.innerHTML = '';

  categories.forEach(cat => {
    const count = cat === 'Tüm Kanallar' ? allChannels.length : allChannels.filter(c => c.group === cat).length;
    const card = document.createElement('div');
    card.className = 'folder-card';
    card.innerHTML = '<i class="fas fa-folder"></i><div class="folder-name">' + cat + '</div><div class="folder-count">' + count + ' Kanal</div>';
    card.onclick = function() { openFolder(cat); };
    grid.appendChild(card);
  });
}

function openFolder(cat) {
  currentCategory = cat;
  document.getElementById('folder-grid').style.display = 'none';
  document.getElementById('channels-grid').style.display = 'grid';
  document.getElementById('back-btn').style.display = 'block';
  renderChannels();
}

function searchChannels() {
  const query = document.getElementById('search-input').value.toLowerCase();
  
  if(query.trim() === '') {
     if(currentCategory) openFolder(currentCategory);
     else showFolders();
     return;
  }
  
  document.getElementById('folder-grid').style.display = 'none';
  document.getElementById('channels-grid').style.display = 'grid';
  document.getElementById('back-btn').style.display = 'block';
  
  const grid = document.getElementById('channels-grid');
  grid.innerHTML = '';
  
  const filtered = allChannels.filter(c => c.name.toLowerCase().includes(query));
  
  filtered.forEach(c => {
    const card = document.createElement('div');
    card.className = 'channel-card';
    card.innerHTML = '<img src="' + c.logo + '"><div class="channel-name">' + c.name + '</div>';
    card.onclick = function() { playStream(c, c.url); };
    grid.appendChild(card);
  });
}

function renderChannels() {
  const grid = document.getElementById('channels-grid');
  grid.innerHTML = '';
  
  const filtered = currentCategory === 'Tüm Kanallar' ? allChannels : allChannels.filter(c => c.group === currentCategory);
  
  filtered.forEach(c => {
    const card = document.createElement('div');
    card.className = 'channel-card';
    card.innerHTML = '<img src="' + c.logo + '"><div class="channel-name">' + c.name + '</div>';
    card.onclick = function() { playStream(c, c.url); };
    grid.appendChild(card);
  });
}

function playStream(channelObj, url) {
  document.getElementById('epg-bar').style.display = 'flex';
  document.getElementById('epg-logo').src = channelObj.logo;
  document.getElementById('epg-channel-name').innerText = channelObj.name;
  updateFakeTime();

  if (hls) hls.destroy();
  if (Hls.isSupported() && url.includes('.m3u8')) {
    hls = new Hls();
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, function() { video.play(); });
  } else {
    video.src = url;
    video.play();
  }
}
</script>
</body>
</html>
