<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>IHS PRO PLAYER</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-main: #09090b; --panel-bg: rgba(24, 24, 27, 0.7);
      --ihs-red: #ff1e27; --ihs-dark-red: #8b0000;
      --glass-border: rgba(255, 255, 255, 0.05);
      --text-main: #ededed; --text-muted: #a1a1aa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
    body {
      background-color: var(--bg-main); color: var(--text-main);
      font-family: 'Segoe UI', system-ui, sans-serif; height: 100vh; overflow: hidden;
    }
    .glass-panel {
      background: var(--panel-bg); backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
    }
    .ihs-pro-dashboard { display: flex; flex-direction: column; height: 100vh; }
    
    /* Mobil Uyumlu Üst Bar */
    .brand-container { padding: 15px; display: flex; align-items: center; justify-content: center; gap: 10px; border-bottom: 1px solid var(--glass-border); }
    .crystal-logo {
      width: 25px; height: 25px; background: linear-gradient(135deg, #ff4b4b, var(--ihs-dark-red));
      transform: rotate(45deg); box-shadow: 0 0 15px rgba(255, 30, 39, 0.5); border: 1px solid #ff7a7a;
    }
    .brand-container h2 { font-size: 18px; font-weight: 800; letter-spacing: 2px; color: var(--ihs-red); }
    
    .top-bar { padding: 10px; display: flex; flex-direction: column; gap: 10px; z-index: 5; }
    .input-group { display: flex; gap: 10px; }
    .input-group input { flex: 1; background: rgba(0,0,0,0.5); border: 1px solid #333; color: white; padding: 10px; border-radius: 8px; font-size: 14px; }
    .glow-btn { background: linear-gradient(135deg, var(--ihs-red), var(--ihs-dark-red)); color: white; border: none; padding: 0 15px; border-radius: 8px; font-weight: bold; }
    
    .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
    
    /* Oynatıcı */
    .player-wrapper { padding: 10px; }
    .video-container { position: relative; width: 100%; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid #222; }
    .video-container video { width: 100%; aspect-ratio: 16/9; object-fit: cover; }
    
    /* Kanallar */
    .category-scroll { display: flex; overflow-x: auto; padding: 10px; gap: 10px; background: var(--panel-bg); }
    .category-scroll button { background: #222; color: #fff; border: 1px solid #333; padding: 8px 15px; border-radius: 20px; white-space: nowrap; }
    .category-scroll button.active { background: rgba(255, 30, 39, 0.2); border-color: var(--ihs-red); }
    
    .channels-grid { padding: 10px; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
    .channel-card {
      background: var(--panel-bg); border: 1px solid var(--glass-border); border-radius: 12px; padding: 15px;
      text-align: center; position: relative;
    }
    .channel-card img { width: 50px; height: 50px; object-fit: contain; margin-bottom: 10px; border-radius: 50%; background: #fff; padding: 5px; }
    .channel-name { font-weight: 600; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  </style>
</head>
<body>

<div class="ihs-pro-dashboard">
  <div class="brand-container glass-panel">
    <div class="crystal-logo"></div>
    <h2>IHS PRO</h2>
  </div>

  <header class="top-bar glass-panel">
    <div class="input-group">
      <input type="text" id="m3u-input" placeholder="M3U linkini yapıştır...">
      <button class="glow-btn" onclick="parseM3U()"><i class="fas fa-bolt"></i></button>
    </div>
  </header>

  <main class="main-content">
    <div class="player-wrapper">
      <div class="video-container">
        <video id="video-player" controls autoplay playsinline></video>
      </div>
    </div>
    
    <div class="category-scroll" id="dynamic-categories"></div>
    <div class="channels-grid" id="channels-grid"></div>
  </main>
</div>

<script>
let allChannels = [];
let categories = new Set();
let currentCategory = 'Tümü';
let hls = null;
const video = document.getElementById('video-player');

window.addEventListener('DOMContentLoaded', () => {
  const defaultUrl = 'https://streams.uzunmuhalefet.com/lists/tr.m3u';
  document.getElementById('m3u-input').value = defaultUrl;
  fetchM3U(defaultUrl);
});

async function fetchM3U(url) {
  try {
    const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url);
    const response = await fetch(proxyUrl);
    if (!response.ok) throw new Error("Ağ hatası");
    parseContent(await response.text());
  } catch (error) {
    alert("Yüklenemedi. Lütfen listeyi kutuya metin olarak yapıştırın.");
  }
}

function parseM3U() {
  const val = document.getElementById('m3u-input').value;
  val.startsWith('http') ? fetchM3U(val) : parseContent(val);
}

function parseContent(content) {
  const lines = content.split('\n');
  allChannels = []; categories.clear(); categories.add('Tümü');
  let currentChannel = {};

  for (let line of lines) {
    line = line.trim();
    if (!line) continue;
    if (line.startsWith('#EXTINF:')) {
      const logo = (line.match(/tvg-logo="([^"]+)"/) || [])[1] || 'https://via.placeholder.com/50?text=TV';
      const group = (line.match(/group-title="([^"]+)"/) || [])[1] || 'Diğer';
      const name = line.split(',').pop().trim();
      currentChannel = { name, logo, group: group.trim() };
      categories.add(currentChannel.group);
    } else if (line.startsWith('http')) {
      currentChannel.url = line;
      allChannels.push(currentChannel);
      currentChannel = {};
    }
  }
  renderCategories();
  filterByCategory('Tümü');
}

function renderCategories() {
  const list = document.getElementById('dynamic-categories');
  list.innerHTML = '';
  categories.forEach(cat => {
    const btn = document.createElement('button');
    btn.innerText = cat;
    btn.onclick = () => filterByCategory(cat);
    if(cat === currentCategory) btn.className = 'active';
    list.appendChild(btn);
  });
}

function filterByCategory(cat) {
  currentCategory = cat;
  renderCategories();
  const grid = document.getElementById('channels-grid');
  grid.innerHTML = '';
  
  const filtered = cat === 'Tümü' ? allChannels : allChannels.filter(c => c.group === cat);
  
  filtered.forEach(c => {
    const card = document.createElement('div');
    card.className = 'channel-card';
    card.innerHTML = `<img src="${c.logo}"><div class="channel-name">${c.name}</div>`;
    card.onclick = () => playStream(c.url);
    grid.appendChild(card);
  });
}

function playStream(url) {
  if (hls) hls.destroy();
  if (Hls.isSupported() && url.includes('.m3u8')) {
    hls = new Hls();
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
  } else {
    video.src = url;
    video.play();
  }
}
</script>
</body>
</html>
