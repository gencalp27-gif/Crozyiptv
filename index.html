<!DOCTYPE html>
<html lang="tr" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>IHS TV - PRIVATE</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-main: #000000; 
      --bg-card: #121212;
      --ihs-red: #e50914;
      --text-main: #ffffff; 
      --text-muted: #888888;
      --border-color: #262626;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; outline: none; -webkit-tap-highlight-color: transparent; }
    
    body {
      background-color: var(--bg-main); color: var(--text-main);
      font-family: system-ui, -apple-system, sans-serif; 
      height: 100vh; overflow: hidden; 
    }

    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg-main); }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--ihs-red); }

    /* =========================================
       GÜVENLİK VE GİRİŞ EKRANI
       ========================================= */
    .security-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg-main); z-index: 99999; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    .security-logo {
      width: 70px; height: 70px; background: linear-gradient(135deg, #ff4b4b, #8b0000);
      transform: rotate(45deg); box-shadow: 0 0 20px rgba(229, 9, 20, 0.5);
      border: 2px solid #ff7a7a; margin-bottom: 40px;
    }
    .security-title { font-size: 22px; font-weight: 900; letter-spacing: 3px; margin-bottom: 25px; }
    .password-input {
      background: var(--bg-card); border: 1px solid #333; border-radius: 8px;
      color: white; padding: 12px 20px; font-size: 16px; width: 250px; text-align: center;
      margin-bottom: 15px; letter-spacing: 2px;
    }
    .password-input:focus { border-color: var(--ihs-red); }
    .login-btn {
      background: var(--ihs-red); color: white; border: none; padding: 12px 40px;
      border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.2s;
    }
    .login-btn:active { transform: scale(0.95); }
    .error-msg { color: var(--ihs-red); font-size: 13px; font-weight: bold; margin-top: 15px; display: none; }

    /* BAN (ENGELLEME) EKRANI */
    .ban-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #050505; z-index: 100000; display: none; flex-direction: column;
      align-items: center; justify-content: center; text-align: center; padding: 20px;
    }
    .ban-screen i { font-size: 70px; color: var(--ihs-red); margin-bottom: 20px; }
    .ban-screen h1 { color: #fff; font-size: 24px; letter-spacing: 2px; margin-bottom: 10px;}
    .ban-screen p { color: var(--text-muted); font-size: 14px; }


    /* ANA UYGULAMA (Giriş Başarılı Olunca Görünür) */
    .app-wrapper { display: none; height: 100vh; flex-direction: column; }

    .player-section { background: var(--bg-main); z-index: 10; display: flex; flex-direction: column; }
    .video-container { width: 100%; background: #000; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .video-container video { width: 100%; height: 100%; object-fit: contain; display: block; cursor: pointer; }

    .custom-controls {
      position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
      display: flex; align-items: center; justify-content: space-between; padding: 20px 15px 10px 15px; z-index: 20; opacity: 1; transition: opacity 0.4s ease;
    }
    .video-container.idle .custom-controls { opacity: 0; pointer-events: none; }
    .controls-left, .controls-right { display: flex; align-items: center; gap: 18px; }
    .control-btn { background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; transition: 0.2s; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
    .control-btn:active { color: var(--ihs-red); transform: scale(1.1); }
    .control-btn.play-btn { font-size: 22px; }

    .now-playing-bar { display: none; padding: 10px 15px; align-items: center; gap: 12px; background: #0a0a0a; border-bottom: 1px solid var(--border-color); }
    .now-playing-logo { width: 35px; height: 35px; border-radius: 6px; background: #fff; padding: 2px; object-fit: contain; }
    .now-playing-info { flex: 1; }
    .now-playing-title { font-weight: 700; font-size: 14px; margin-bottom: 2px; }
    .live-badge { font-size: 10px; font-weight: bold; color: var(--ihs-red); display: flex; align-items: center; gap: 4px; }
    .live-dot { width: 6px; height: 6px; background: var(--ihs-red); border-radius: 50%; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

    .sidebar-section { display: flex; flex-direction: column; background: var(--bg-main); overflow: hidden; flex:1;}
    .search-container { padding: 10px 15px; background: var(--bg-main); }
    .search-box { display: flex; align-items: center; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 6px; padding: 8px 12px; }
    .search-box input { background: transparent; border: none; color: white; width: 100%; margin-left: 10px; font-size: 13px; }

    .categories-bar { display: flex; overflow-x: auto; padding: 0 15px 10px 15px; gap: 6px; border-bottom: 1px solid var(--border-color); -webkit-overflow-scrolling: touch; }
    .cat-btn { background: var(--bg-card); color: var(--text-muted); border: 1px solid var(--border-color); padding: 6px 12px; border-radius: 15px; font-weight: 600; font-size: 12px; white-space: nowrap; cursor: pointer; }
    .cat-btn.active { background: var(--ihs-red); color: #fff; border-color: var(--ihs-red); }
    .cat-btn-fav { color: #ffeb3b; border-color: #333; }
    .cat-btn-fav.active { background: #ffeb3b; color: #000; border-color: #ffeb3b; }

    /* ULTRA SIKI VE KÜÇÜK KANAL TASARIMI */
    .channel-list { flex: 1; overflow-y: auto; padding: 5px 10px; display: flex; flex-direction: column; gap: 4px; -webkit-overflow-scrolling: touch; }
    .channel-row { display: flex; align-items: center; background: transparent; padding: 6px 10px; border-radius: 6px; cursor: pointer; transition: 0.1s; }
    .channel-row:active { background: rgba(229, 9, 20, 0.15); }
    .channel-row img { width: 32px; height: 32px; object-fit: contain; background: #fff; border-radius: 4px; padding: 2px; margin-right: 12px; }
    .channel-row-name { flex: 1; font-weight: 500; font-size: 13px; color: #ddd; }
    
    .fav-icon { font-size: 15px; color: #333; padding: 8px; }
    .fav-icon.active { color: var(--ihs-red); }

    /* RESPONSIVE */
    @media (max-width: 899px) {
      .player-section { flex-shrink: 0; box-shadow: 0 4px 10px rgba(0,0,0,0.5); border-bottom: 1px solid #222;}
      .video-container { aspect-ratio: 16/9; }
    }
    @media (min-width: 900px) {
      .app-wrapper { flex-direction: row; }
      .player-section { flex: 1; border-right: 1px solid var(--border-color); }
      .video-container { flex: 1; overflow: hidden; background: #000; }
      .sidebar-section { width: 350px; flex-shrink: 0; }
      .channel-row:hover { background: #111; }
    }
  </style>
</head>
<body>

  <!-- BAN EKRANI (Şifre 2 kez yanlış girilirse buraya kilitlenir) -->
  <div class="ban-screen" id="ban-screen">
    <i class="fas fa-ban"></i>
    <h1>ERİŞİM ENGELLENDİ</h1>
    <p>Güvenlik ihlali sebebiyle bu cihaz engellendi.</p>
  </div>

  <!-- GÜVENLİK GİRİŞ EKRANI -->
  <div class="security-screen" id="security-screen">
    <div class="security-logo"></div>
    <div class="security-title">IHS PRIVATE</div>
    <input type="password" id="pass-input" class="password-input" placeholder="Şifrenizi Girin">
    <button class="login-btn" onclick="checkPassword()">GİRİŞ YAP</button>
    <div class="error-msg" id="error-msg"></div>
  </div>

  <!-- ANA UYGULAMA (Girişten sonra açılır) -->
  <div class="app-wrapper" id="app-wrapper">
    <div class="player-section">
      <div class="video-container" id="video-container">
        <video id="video-player" playsinline></video>
        <div class="custom-controls" id="custom-controls">
          <div class="controls-left">
            <button class="control-btn play-btn" id="play-pause-btn"><i class="fas fa-play"></i></button>
            <button class="control-btn" id="mute-btn"><i class="fas fa-volume-up"></i></button>
          </div>
          <div class="controls-right">
            <button class="control-btn" id="pip-btn"><i class="fas fa-clone"></i></button>
            <button class="control-btn" id="fullscreen-btn"><i class="fas fa-expand"></i></button>
          </div>
        </div>
      </div>
      <div class="now-playing-bar" id="now-playing-bar">
        <img id="np-logo" class="now-playing-logo" src="" alt="logo">
        <div class="now-playing-info">
          <div class="now-playing-title" id="np-title">-</div>
          <div class="live-badge"><div class="live-dot"></div> CANLI YAYIN</div>
        </div>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="search-container">
        <div class="search-box">
          <i class="fas fa-search" style="color: var(--text-muted);"></i>
          <input type="text" id="search-input" placeholder="Kanal ara..." oninput="searchChannels()">
        </div>
      </div>
      <div class="categories-bar" id="categories-bar"></div>
      <div class="channel-list" id="channel-list"></div>
    </div>
  </div>

<script>
// =========================================
// GÜVENLİK VE ŞİFRE YÖNETİMİ
// =========================================
const GECERLI_SIFRE = "ihspro"; // <-- ŞİFREYİ BURADAN DEĞİŞTİREBİLİRSİN

let hataliGirisSayisi = parseInt(localStorage.getItem('ihs_hata') || '0');
const isBanned = localStorage.getItem('ihs_banned') === 'true';

// Sayfa ilk açıldığında ban kontrolü yap
window.addEventListener('DOMContentLoaded', () => {
  if (isBanned) {
    document.getElementById('security-screen').style.display = 'none';
    document.getElementById('ban-screen').style.display = 'flex';
  }
});

// Şifre Kutusu Enter Tuşu Desteği
document.getElementById("pass-input").addEventListener("keypress", function(event) {
  if (event.key === "Enter") { checkPassword(); }
});

function checkPassword() {
  if (isBanned) return;

  const girilenSifre = document.getElementById('pass-input').value;
  const errorText = document.getElementById('error-msg');

  if (girilenSifre === GECERLI_SIFRE) {
    // ŞİFRE DOĞRU! Sistemi Başlat
    localStorage.setItem('ihs_hata', '0'); // Hata sayıcısını sıfırla
    document.getElementById('security-screen').style.display = 'none';
    document.getElementById('app-wrapper').style.display = 'flex';
    initIptvApp(); // Ağır sistemi sadece giriş yapıldıktan sonra yükle (Tasarruf)
  } else {
    // ŞİFRE YANLIŞ!
    hataliGirisSayisi++;
    localStorage.setItem('ihs_hata', hataliGirisSayisi.toString());

    if (hataliGirisSayisi >= 2) {
      localStorage.setItem('ihs_banned', 'true');
      document.getElementById('security-screen').style.display = 'none';
      document.getElementById('ban-screen').style.display = 'flex';
    } else {
      errorText.innerText = "Hatalı şifre! Son 1 hakkınız kaldı.";
      errorText.style.display = 'block';
    }
  }
}

// =========================================
// IPTV MOTORU (Sadece giriş yapıldığında çalışır)
// =========================================
let allChannels = []; let categories = new Set(); let currentCategory = 'Tüm Kanallar';
let hls = null; let favorites = JSON.parse(localStorage.getItem('ihs_favorites')) || [];
const video = document.getElementById('video-player');

const gomuluListe = `
#EXTM3U
#EXTINF:-1 tvg-logo="https://i.imgur.com/PexhKwp.png" group-title="Turkey",4U TV
https://hls.4utv.live/hls/stream.m3u8
#EXTINF:-1 tvg-logo="https://i.imgur.com/8FO41es.png" group-title="Turkey",24 TV
https://turkmedya-live.ercdn.net/tv24/tv24.m3u8
#EXTINF:-1 tvg-logo="https://i.imgur.com/agn47sQ.png" group-title="Turkey",360 TV
https://turkmedya-live.ercdn.net/tv360/tv360.m3u8
#EXTINF:-1 tvg-logo="https://iatv.tmgrup.com.tr/site/v2/a2tv/i/a2tv-logo.png" group-title="Turkey",A2TV
https://rnttwmjcin.turknet.ercdn.net/lcpmvefbyo/a2tv/a2tv.m3u8
#EXTINF:-1 tvg-logo="https://upload.wikimedia.org/wikipedia/commons/7/7c/Ahaber_Logo.png" group-title="Turkey",A Haber
https://rnttwmjcin.turknet.ercdn.net/lcpmvefbyo/ahaber/ahaber.m3u8
#EXTINF:-1 tvg-logo="https://i.imgur.com/ZhkZzLf.png" group-title="Turkey",A Spor
https://rnttwmjcin.turknet.ercdn.net/lcpmvefbyo/aspor/aspor.m3u8
#EXTINF:-1 tvg-logo="https://i.imgur.com/mgDCKiy.png" group-title="Turkey",Aksu TV
https://live.artidijitalmedya.com/artidijital_aksutv/aksutv/playlist.m3u8
#EXTINF:-1 tvg-logo="https://i.imgur.com/HyVUwFC.png" group-title="Turkey",ATV
https://rnttwmjcin.turknet.ercdn.net/lcpmvefbyo/atv/atv_1080p.m3u8
#EXTINF:-1 tvg-logo="https://upload.wikimedia.org/wikipedia/commons/thumb/4/43/Diyanet_TV_logo.svg/960px-Diyanet_TV_logo.svg.png" group-title="Turkey",Diyanet TV
https://eustr73.mediatriple.net/videoonlylive/mtikoimxnztxlive/broadcast_5e3bf95a47e07.smil/playlist.m3u8
#EXTINF:-1 tvg-logo="https://www.dsmart.com.tr/epg/images/0x60/5ffc18c6cfef0b15933a8b65" group-title="Turkey",Ekoturk
https://cdn.ekoturk.net/hls/master.m3u8
#EXTINF:-1 tvg-logo="https://upload.wikimedia.org/wikipedia/commons/thumb/e/ef/GZT_logo.svg/960px-GZT_logo.svg.png" group-title="Turkey",GZT
https://gzttv-live.lg.mncdn.com/gzttv/gzttv/playlist.m3u8
#EXTINF:-1 tvg-logo="https://i.imgur.com/xM0HA30.png" group-title="Turkey",Halk TV
https://halktv-live.daioncdn.net/halktv/halktv.m3u8
#EXTINF:-1 tvg-logo="https://www.htspor.com/images/manifest/social-share-logo.png" group-title="Turkey",HTSpor
https://ciner.daioncdn.net/ht-spor/ht-spor.m3u8?app=web
#EXTINF:-1 tvg-logo="https://i.imgur.com/9o1atM6.png" group-title="Turkey",Kanal D
https://demiroren.daioncdn.net/kanald/kanald.m3u8?app=kanald_web&ce=3
#EXTINF:-1 tvg-logo="https://uycyyuuzyh.turknet.ercdn.net/nphindgytw/nowtv/nowtv.m3u8" group-title="Turkey",NOW TV
https://uycyyuuzyh.turknet.ercdn.net/nphindgytw/nowtv/nowtv.m3u8
#EXTINF:-1 tvg-logo="https://upload.wikimedia.org/wikipedia/commons/thumb/0/0c/NTV_%28Turkey%29_logo.svg/960px-NTV_%28Turkey%29_logo.svg.png" group-title="Turkey",NTV
https://dogus.daioncdn.net/ntv/ntv.m3u8?app=ntv_web
#EXTINF:-1 tvg-logo="https://i.imgur.com/9O3DHRB.png" group-title="Turkey",Star TV
https://dogus.daioncdn.net/startv/startv_720p.m3u8?app=a20ac41e-bdc3-4aa1-934d-26b484480ac9&ce=3&sid=8l4w3lst4co5
#EXTINF:-1 tvg-logo="https://i.imgur.com/PrxwKDw.png" group-title="Turkey",TGRT Haber
https://canli.tgrthaber.com/tgrt.m3u8
#EXTINF:-1 tvg-logo="https://upload.wikimedia.org/wikipedia/commons/thumb/8/85/TRT_1_logo_%282021-%29.svg/960px-TRT_1_logo_%282021-%29.svg.png" group-title="Turkey",TRT 1
https://tv-trt1.medya.trt.com.tr/master.m3u8
#EXTINF:-1 tvg-logo="https://upload.wikimedia.org/wikipedia/commons/thumb/7/72/TRT_Haber_Eyl%C3%BCl_2020_Logo.svg/960px-TRT_Haber_Eyl%C3%BCl_2020_Logo.svg.png" group-title="Turkey",TRT Haber
https://tv-trthaber.medya.trt.com.tr/master.m3u8
`;

function initIptvApp() {
  const lines = gomuluListe.split('\n');
  allChannels = []; categories.clear(); 
  let currentChannel = {};

  for (let i = 0; i < lines.length; i++) {
    let line = lines[i].trim();
    if (!line) continue;
    if (line.startsWith('#EXTINF:')) {
      const logo = (line.match(/tvg-logo="([^"]+)"/) || [])[1] || 'https://via.placeholder.com/150?text=TV';
      const group = (line.match(/group-title="([^"]+)"/) || [])[1] || 'Diğer';
      currentChannel = { name: line.split(',').pop().trim(), logo, group };
      categories.add(group);
    } else if (line.startsWith('http')) {
      currentChannel.url = line;
      allChannels.push(currentChannel);
      currentChannel = {};
    }
  }
  renderCategories(); renderChannels(); initPlayerControls();
}

function renderCategories() {
  const bar = document.getElementById('categories-bar');
  bar.innerHTML = '';
  const fragment = document.createDocumentFragment();
  
  const favBtn = document.createElement('button');
  favBtn.className = 'cat-btn cat-btn-fav' + (currentCategory==='Favorilerim'?' active':'');
  favBtn.innerHTML = '<i class="fas fa-heart"></i> Favoriler';
  favBtn.onclick = () => { setCategory('Favorilerim'); };
  fragment.appendChild(favBtn);

  const allBtn = document.createElement('button');
  allBtn.className = 'cat-btn' + (currentCategory==='Tüm Kanallar'?' active':'');
  allBtn.innerText = 'Tüm Kanallar';
  allBtn.onclick = () => { setCategory('Tüm Kanallar'); };
  fragment.appendChild(allBtn);
  
  categories.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn' + (currentCategory===cat?' active':'');
    btn.innerText = cat;
    btn.onclick = () => { setCategory(cat); };
    fragment.appendChild(btn);
  });
  bar.appendChild(fragment);
}

function setCategory(cat) { currentCategory = cat; document.getElementById('search-input').value = ''; renderCategories(); renderChannels(); }
function searchChannels() { renderChannels(document.getElementById('search-input').value.toLowerCase()); }

function toggleFavorite(e, channelName) {
  e.stopPropagation(); 
  const index = favorites.indexOf(channelName);
  if (index > -1) favorites.splice(index, 1); else favorites.push(channelName);
  localStorage.setItem('ihs_favorites', JSON.stringify(favorites));
  renderChannels(document.getElementById('search-input').value.toLowerCase()); 
}

function renderChannels(searchQuery = '') {
  const list = document.getElementById('channel-list');
  list.innerHTML = '';
  
  let filtered = currentCategory === 'Favorilerim' ? allChannels.filter(c => favorites.includes(c.name)) 
               : currentCategory === 'Tüm Kanallar' ? allChannels : allChannels.filter(c => c.group === currentCategory);
  if (searchQuery) filtered = filtered.filter(c => c.name.toLowerCase().includes(searchQuery));
  
  const fragment = document.createDocumentFragment();
  if (filtered.length === 0 && currentCategory === 'Favorilerim') { list.innerHTML = '<div style="text-align:center; padding:20px; color:#666; font-size:12px;">Henüz favori yok.</div>'; return; }

  filtered.forEach(c => {
    const isFav = favorites.includes(c.name);
    const row = document.createElement('div');
    row.className = 'channel-row';
    row.innerHTML = `
      <img src="${c.logo}" loading="lazy" onerror="this.src='https://via.placeholder.com/150?text=TV'">
      <div class="channel-row-name">${c.name}</div>
      <i class="${isFav ? 'fas' : 'far'} fa-heart fav-icon ${isFav ? 'active' : ''}" onclick="toggleFavorite(event, '${c.name.replace(/'/g, "\\'")}')"></i>
    `;
    row.onclick = () => playStream(c, c.url);
    fragment.appendChild(row);
  });
  list.appendChild(fragment);
}

function playStream(channelObj, url) {
  document.getElementById('now-playing-bar').style.display = 'flex';
  document.getElementById('np-logo').src = channelObj.logo;
  document.getElementById('np-title').innerText = channelObj.name;

  if (hls) hls.destroy();
  if (Hls.isSupported() && url.includes('.m3u8')) {
    hls = new Hls({enableWorker: true, lowLatencyMode: true});
    hls.loadSource(url); hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, function() { video.play(); });
  } else { video.src = url; video.play(); }
}

function initPlayerControls() {
  const playBtn = document.getElementById('play-pause-btn');
  const muteBtn = document.getElementById('mute-btn');
  const fsBtn = document.getElementById('fullscreen-btn');
  const pipBtn = document.getElementById('pip-btn');
  const vContainer = document.getElementById('video-container');

  if (!document.pictureInPictureEnabled) pipBtn.style.display = 'none';

  function togglePlay() { if (video.paused) video.play(); else video.pause(); }
  playBtn.onclick = togglePlay; video.onclick = togglePlay;

  muteBtn.onclick = () => { video.muted = !video.muted; muteBtn.innerHTML = video.muted ? '<i class="fas fa-volume-mute"></i>' : '<i class="fas fa-volume-up"></i>'; };

  fsBtn.onclick = () => {
    if (!document.fullscreenElement) { if (vContainer.requestFullscreen) vContainer.requestFullscreen(); else if (vContainer.webkitRequestFullscreen) vContainer.webkitRequestFullscreen(); } 
    else { if (document.exitFullscreen) document.exitFullscreen(); else if (document.webkitExitFullscreen) document.webkitExitFullscreen(); }
  };
  video.ondblclick = fsBtn.onclick;

  pipBtn.onclick = async () => { try { if (document.pictureInPictureElement) await document.exitPictureInPicture(); else await video.requestPictureInPicture(); } catch (err) {} };

  video.addEventListener('play', () => { playBtn.innerHTML = '<i class="fas fa-pause"></i>'; });
  video.addEventListener('pause', () => { playBtn.innerHTML = '<i class="fas fa-play"></i>'; });

  let timeout;
  function resetControls() {
    vContainer.classList.remove('idle'); clearTimeout(timeout);
    timeout = setTimeout(() => { if (!video.paused) vContainer.classList.add('idle'); }, 3000);
  }
  vContainer.addEventListener('mousemove', resetControls); vContainer.addEventListener('touchstart', resetControls);
  vContainer.addEventListener('mouseleave', () => { if (!video.paused) vContainer.classList.add('idle'); });
}
</script>
</body>
</html>
