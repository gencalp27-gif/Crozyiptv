function initApp() {
  parseM3UContent(tvData, tvChannels, tvCategories);
  fetch('https://raw.githubusercontent.com/Zerk1903/zerkfilm/refs/heads/main/Filmler.m3u').then(res => res.text()).then(data => { parseM3UContent(data, movies, movieCategories); if(currentMode==='MOVIE') renderUI(); }).catch(e => console.log(e));
  initPlayerControls(); initKeyboardControls(); startClock(); switchMode('TV'); 
}

function startClock() { const clockEl = document.getElementById('osd-clock'); clockInterval = setInterval(() => { clockEl.innerText = new Date().toLocaleTimeString('tr-TR', { hour:'2-digit', minute:'2-digit' }); }, 1000); }

function parseM3UContent(content, targetArray, targetCategories) {
  const lines = content.split('\n'); let currentObj = null;
  for (let i = 0; i < lines.length; i++) {
    let line = lines[i].trim(); if (!line) continue;
    if (line.startsWith('#EXTINF:')) {
      const logoMatch = line.match(/tvg-logo="([^"]+)"/); const groupMatch = line.match(/group-title="([^"]+)"/);
      let finalGroup = (groupMatch ? groupMatch[1] : 'Diğer').trim().toUpperCase();
      finalGroup = finalGroup.charAt(0).toUpperCase() + finalGroup.slice(1).toLocaleLowerCase('tr-TR');
      if(finalGroup === "Muzik" || finalGroup === "Müzik") finalGroup = "Müzik"; 
      if(finalGroup === "Haber" || finalGroup === "Haberler") finalGroup = "Haberler"; 
      currentObj = { name: line.split(',').pop().trim(), logo: logoMatch ? logoMatch[1] : '', group: finalGroup }; targetCategories.add(finalGroup);
    } else if (line.startsWith('http')) { if (currentObj) { currentObj.url = line; targetArray.push(currentObj); currentObj = null; } }
  }
}

function switchMode(mode) {
  if (!video.paused) video.pause(); currentMode = mode;
  document.getElementById('tab-tv').className = mode === 'TV' ? 'tab-btn active' : 'tab-btn'; document.getElementById('tab-movie').className = mode === 'MOVIE' ? 'tab-btn active' : 'tab-btn';
  if(mode === 'MOVIE') {
    document.getElementById('progress-container').style.display = 'flex'; document.getElementById('epg-container').style.display = 'none';
    document.getElementById('osd-badge').innerHTML = '<i class="fas fa-film"></i> VOD'; document.getElementById('osd-badge').style.color = '#fff';
    document.getElementById('search-input').placeholder = "Film ara...";
  } else {
    document.getElementById('progress-container').style.display = 'none'; document.getElementById('epg-container').style.display = 'flex';
    document.getElementById('osd-badge').innerHTML = '<i class="fas fa-circle" style="font-size:8px;"></i> CANLI'; document.getElementById('osd-badge').style.color = 'var(--ihs-red)';
    document.getElementById('search-input').placeholder = "Kanal ara...";
  }
  currentCategory = 'Tümü'; document.getElementById('search-input').value = ''; renderCategoriesOnly(); renderContentList(true);
}

function renderCategoriesOnly() {
  const catBar = document.getElementById('categories-bar'); catBar.innerHTML = '';
  const categoriesSet = currentMode === 'TV' ? tvCategories : movieCategories;
  if(currentMode === 'TV') {
      const createBtn = (txt, isFav=false) => { const btn = document.createElement('button'); btn.className = 'cat-btn' + (isFav ? ' cat-btn-fav' : '') + (currentCategory===txt ? ' active' : ''); btn.innerHTML = isFav ? `<i class="fas fa-heart"></i> ${txt}` : txt; btn.onclick = () => { selectCategory(txt); }; catBar.appendChild(btn); };
      createBtn('Favorilerim', true); createBtn('Tümü'); Array.from(categoriesSet).sort(new Intl.Collator('tr').compare).forEach(cat => createBtn(cat));
  } else {
      const btnAll = document.createElement('button'); btnAll.className = 'cat-btn movie-cat' + (currentCategory==='Tümü' ? ' active' : ''); btnAll.innerText = 'Tümü'; btnAll.onclick = () => selectCategory('Tümü'); catBar.appendChild(btnAll);
      const btnMenu = document.createElement('button'); btnMenu.className = 'cat-btn movie-cat'; btnMenu.innerHTML = `<i class="fas fa-list-ul"></i> Kategoriler`; btnMenu.onclick = openCategoryMenu; catBar.appendChild(btnMenu);
      if (currentCategory !== 'Tümü') { const btnCurrent = document.createElement('button'); btnCurrent.className = 'cat-btn movie-cat active'; btnCurrent.innerText = currentCategory; btnCurrent.onclick = () => openCategoryMenu(); catBar.appendChild(btnCurrent); }
  }
}

function selectCategory(catName) { currentCategory = catName; document.getElementById('search-input').value = ''; renderCategoriesOnly(); renderContentList(true); if(currentMode === 'TV') { const buttons = document.querySelectorAll('.cat-btn'); for(let b of buttons) { if(b.innerText === catName || b.innerText.includes(catName)) { b.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' }); break; } } } }
function openCategoryMenu() { const cmList = document.getElementById('cm-list'); cmList.innerHTML = ''; Array.from(movieCategories).sort(new Intl.Collator('tr').compare).forEach(cat => { const item = document.createElement('div'); item.className = 'cm-item' + (currentCategory === cat ? ' active' : ''); item.innerText = cat; item.onclick = () => { selectCategory(cat); closeCategoryMenu(); }; cmList.appendChild(item); }); document.getElementById('category-menu').classList.add('open'); }
function closeCategoryMenu() { document.getElementById('category-menu').classList.remove('open'); }
function searchContent() { renderContentList(true); }
function toggleFavorite(e, channelName) { e.stopPropagation(); const index = favorites.indexOf(channelName); if (index > -1) favorites.splice(index, 1); else favorites.push(channelName); localStorage.setItem('ihs_favorites', JSON.stringify(favorites)); renderContentList(true); }

function createMovieCard(c, index) {
    const safeName = c.name.replace(/</g, "&lt;").replace(/>/g, "&gt;"); const card = document.createElement('div'); card.className = 'movie-card' + (activeItemUrl === c.url ? ' active-movie' : ''); card.setAttribute('data-url', c.url);
    card.innerHTML = `<div class="movie-poster-wrap"><div class="movie-title-fallback">${safeName}</div><img class="movie-poster" src="${c.logo}" loading="lazy" onerror="this.style.opacity=0"><div class="movie-title-overlay">${safeName}</div><div class="play-icon-overlay"><i class="fas fa-play-circle"></i></div></div>`;
    card.onclick = () => playStream(c, index); return card;
}

function renderContentList(reset = false) {
  const contentArea = document.getElementById('content-area'); const dataset = currentMode === 'TV' ? tvChannels : movies; const query = document.getElementById('search-input').value.toLocaleLowerCase('tr-TR');
  if (reset) { currentRenderCount = 0; contentArea.innerHTML = ''; if (currentCategory === 'Favorilerim') { currentDisplayList = dataset.filter(c => favorites.includes(c.name)); } else { currentDisplayList = currentCategory === 'Tümü' ? dataset : dataset.filter(c => c.group === currentCategory); } if (query) currentDisplayList = currentDisplayList.filter(c => c.name.toLocaleLowerCase('tr-TR').includes(query)); populateVideoChannelMenu(); }
  if (currentMode === 'MOVIE' && currentCategory === 'Tümü' && query === '') {
      contentArea.className = 'content-area'; if(!reset) return; 
      Array.from(movieCategories).sort(new Intl.Collator('tr').compare).forEach(cat => {
          const catMovies = movies.filter(m => m.group === cat); if(catMovies.length === 0) return;
          const rowCont = document.createElement('div'); rowCont.className = 'netflix-row-container'; rowCont.innerHTML = `<div class="netflix-row-title">${cat} <span class="see-all" onclick="selectCategory('${cat}')">Tümünü Gör <i class="fas fa-chevron-right"></i></span></div>`;
          const row = document.createElement('div'); row.className = 'netflix-row'; const limit = Math.min(catMovies.length, 30); for(let i = 0; i < limit; i++) { row.appendChild(createMovieCard(catMovies[i], movies.indexOf(catMovies[i]))); } rowCont.appendChild(row); contentArea.appendChild(rowCont);
      }); return;
  }
  contentArea.className = currentMode === 'TV' ? 'content-area' : 'content-area movie-grid'; const fragment = document.createDocumentFragment(); const endIndex = Math.min(currentRenderCount + RENDER_CHUNK, currentDisplayList.length);
  for (let i = currentRenderCount; i < endIndex; i++) {
    const c = currentDisplayList[i]; const safeName = c.name.replace(/</g, "&lt;").replace(/>/g, "&gt;"); 
    if(currentMode === 'TV') {
      const isFav = favorites.includes(c.name); const row = document.createElement('div'); row.className = 'channel-row' + (activeItemUrl === c.url ? ' active-channel' : ''); row.setAttribute('data-url', c.url);
      row.innerHTML = `<img src="${c.logo}" loading="lazy" onerror="this.src='https://via.placeholder.com/150?text=TV'"><div class="channel-row-name">${safeName}</div><i class="${isFav ? 'fas' : 'far'} fa-heart fav-icon ${isFav ? 'active' : ''}" onclick="toggleFavorite(event, '${safeName.replace(/'/g, "\\'")}')"></i>`; row.onclick = () => playStream(c, i); fragment.appendChild(row);
    } else { fragment.appendChild(createMovieCard(c, i)); }
  }
  contentArea.appendChild(fragment); currentRenderCount = endIndex;
  if (currentRenderCount < currentDisplayList.length) { if (currentObserver) currentObserver.disconnect(); const observerTarget = document.createElement('div'); observerTarget.style.width = "100%"; observerTarget.style.height = "20px"; contentArea.appendChild(observerTarget); currentObserver = new IntersectionObserver((entries) => { if (entries[0].isIntersecting) { currentObserver.disconnect(); observerTarget.remove(); renderContentList(false); } }); currentObserver.observe(observerTarget); }
}

function updateActiveCardUI() { document.querySelectorAll('.channel-row, .movie-card').forEach(el => { if(el.getAttribute('data-url') === activeItemUrl) el.classList.add(currentMode === 'TV' ? 'active-channel' : 'active-movie'); else el.classList.remove('active-channel', 'active-movie'); }); }

function populateVideoChannelMenu() {
  const vList = document.getElementById('vcm-list'); vList.innerHTML = ''; const fragment = document.createDocumentFragment(); const limit = Math.min(currentDisplayList.length, 100); 
  for(let i = 0; i < limit; i++) {
    const c = currentDisplayList[i]; const safeName = c.name.replace(/</g, "&lt;").replace(/>/g, "&gt;");
    const row = document.createElement('div'); row.className = 'channel-row' + ((activeItemUrl === c.url) ? ' active-channel' : ''); row.innerHTML = `<img src="${c.logo}" loading="lazy" onerror="this.style.display='none'"><div class="channel-row-name">${safeName}</div>`; row.onclick = (e) => { e.stopPropagation(); playStream(c, i); document.getElementById('video-channel-menu').classList.remove('open'); document.getElementById('video-container').classList.remove('menu-open'); }; fragment.appendChild(row);
  } vList.appendChild(fragment);
}

function playStream(item, index) {
  fadeOverlay.classList.add('active');
  setTimeout(() => {
    activeItemUrl = item.url; activeChannelIndex = index; document.getElementById('error-overlay').style.display = 'none'; document.getElementById('loading-spinner').style.display = 'block';
    const safeName = item.name.replace(/</g, "&lt;").replace(/>/g, "&gt;"); const osd = document.getElementById('tv-osd'); document.getElementById('osd-logo').src = item.logo; document.getElementById('osd-title').innerText = safeName;
    if(currentMode === 'TV') { const randProg = Math.floor(Math.random() * 60) + 20; document.getElementById('epg-title').innerText = "Şu An Oynayan: " + safeName + " Canlı Yayını"; document.getElementById('epg-progress').style.width = randProg + "%"; }
    osd.classList.add('show'); clearTimeout(osdTimeout); osdTimeout = setTimeout(() => { osd.classList.remove('show'); }, 4000);
    if (hls) hls.destroy(); 
    
    let finalUrl = item.url;
    if (currentMode === 'MOVIE' || item.url.includes('lord.mariuannastluisborg')) { finalUrl = PROXY_BASE + item.url; }

    if (Hls.isSupported() && item.url.includes('.m3u8')) {
      hls = new Hls({enableWorker: true}); hls.on(Hls.Events.ERROR, (e, data) => { if (data.fatal) handleStreamError(); });
      hls.loadSource(finalUrl); hls.attachMedia(video); hls.on(Hls.Events.MANIFEST_PARSED, () => { video.play().catch(e => console.log(e)); });
    } else { video.src = finalUrl; video.play().catch(e => { console.error(e); handleStreamError(); }); }
    updateActiveCardUI(); 
  }, 400); 
}

function handleStreamError() { document.getElementById('loading-spinner').style.display = 'none'; fadeOverlay.classList.remove('active'); document.getElementById('error-overlay').style.display = 'flex'; document.getElementById('fallback-msg').innerText = "CORS engeli veya sunucu yanıt vermiyor."; }
function formatTime(seconds) { if(isNaN(seconds)) return "00:00"; const m = Math.floor(seconds / 60); const s = Math.floor(seconds % 60); const h = Math.floor(m / 60); const mm = m % 60; if(h > 0) return `${h}:${mm < 10 ? '0'+mm : mm}:${s < 10 ? '0'+s : s}`; return `${m}:${s < 10 ? '0'+s : s}`; }
function playNextChannel() { if(currentDisplayList.length === 0 || currentMode === 'MOVIE') return; let nextIdx = activeChannelIndex + 1; if (nextIdx >= currentDisplayList.length) nextIdx = 0; playStream(currentDisplayList[nextIdx], nextIdx); }
function playPrevChannel() { if(currentDisplayList.length === 0 || currentMode === 'MOVIE') return; let prevIdx = activeChannelIndex - 1; if (prevIdx < 0) prevIdx = currentDisplayList.length - 1; playStream(currentDisplayList[prevIdx], prevIdx); }

function initKeyboardControls() { document.addEventListener('keydown', (e) => { if(document.activeElement.tagName === 'INPUT') return; switch(e.code) { case 'Space': e.preventDefault(); if (video.paused) video.play(); else video.pause(); break; case 'KeyF': e.preventDefault(); document.getElementById('fullscreen-btn').click(); break; case 'ArrowUp': e.preventDefault(); playPrevChannel(); break; case 'ArrowDown': e.preventDefault(); playNextChannel(); break; } }); }
document.getElementById('channel-menu-btn').onclick = (e) => { e.stopPropagation(); populateVideoChannelMenu(); document.getElementById('video-channel-menu').classList.add('open'); document.getElementById('video-container').classList.add('menu-open'); };
document.getElementById('vcm-close-btn').onclick = (e) => { e.stopPropagation(); document.getElementById('video-channel-menu').classList.remove('open'); document.getElementById('video-container').classList.remove('menu-open'); };

function initPlayerControls() {
  const playBtn = document.getElementById('play-pause-btn'); const muteBtn = document.getElementById('mute-btn'); const fsBtn = document.getElementById('fullscreen-btn'); const pipBtn = document.getElementById('pip-btn'); const statsBtn = document.getElementById('stats-btn'); const statsPanel = document.getElementById('stats-panel'); const vContainer = document.getElementById('video-container');
  if (!document.pictureInPictureEnabled) pipBtn.style.display = 'none';
  function togglePlay() { if (video.paused) video.play(); else video.pause(); } playBtn.onclick = (e) => { e.stopPropagation(); togglePlay(); }; video.onclick = togglePlay;
  video.addEventListener('waiting', () => { document.getElementById('loading-spinner').style.display = 'block'; }); video.addEventListener('playing', () => { document.getElementById('loading-spinner').style.display = 'none'; fadeOverlay.classList.remove('active'); }); video.addEventListener('error', () => { handleStreamError(); });
  video.addEventListener('play', () => { playBtn.innerHTML = '<i class="fas fa-pause"></i>'; }); video.addEventListener('pause', () => { playBtn.innerHTML = '<i class="fas fa-play"></i>'; });
  muteBtn.onclick = (e) => { e.stopPropagation(); video.muted = !video.muted; muteBtn.innerHTML = video.muted ? '<i class="fas fa-volume-mute"></i>' : '<i class="fas fa-volume-up"></i>'; };
  video.addEventListener('loadedmetadata', () => { if(video.duration && video.duration !== Infinity) { seekBar.max = video.duration; document.getElementById('total-time').innerText = formatTime(video.duration); } });
  video.addEventListener('timeupdate', () => { if (!seekBar.active) seekBar.value = video.currentTime; document.getElementById('current-time').innerText = formatTime(video.currentTime); });
  seekBar.addEventListener('mousedown', () => seekBar.active = true); seekBar.addEventListener('touchstart', () => seekBar.active = true); seekBar.addEventListener('change', () => { video.currentTime = seekBar.value; seekBar.active = false; }); seekBar.addEventListener('touchend', () => { video.currentTime = seekBar.value; seekBar.active = false; });
  fsBtn.onclick = (e) => { e.stopPropagation(); const isPseudoFS = vContainer.classList.contains('pseudo-fullscreen'); if (!document.fullscreenElement && !isPseudoFS) { if (vContainer.requestFullscreen) vContainer.requestFullscreen().catch(() => vContainer.classList.add('pseudo-fullscreen')); else if (vContainer.webkitRequestFullscreen) vContainer.webkitRequestFullscreen(); else vContainer.classList.add('pseudo-fullscreen'); if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(()=>{}); } else { if (document.exitFullscreen && document.fullscreenElement) document.exitFullscreen(); else if (document.webkitExitFullscreen && document.fullscreenElement) document.webkitExitFullscreen(); vContainer.classList.remove('pseudo-fullscreen'); if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } };
  video.ondblclick = fsBtn.onclick; pipBtn.onclick = async (e) => { e.stopPropagation(); try { if (document.pictureInPictureElement) await document.exitPictureInPicture(); else await video.requestPictureInPicture(); } catch (err) {} };
  statsBtn.onclick = (e) => { e.stopPropagation(); if (statsPanel.style.display === 'flex') { statsPanel.style.display = 'none'; clearInterval(statsInterval); } else { statsPanel.style.display = 'flex'; statsInterval = setInterval(updateStats, 1000); updateStats(); } };
  function updateStats() { if (statsPanel.style.display !== 'flex') return; document.getElementById('stat-res').innerText = video.videoWidth ? `${video.videoWidth} x ${video.videoHeight}` : 'Hesaplanıyor...'; if (hls && hls.levels && hls.currentLevel >= 0) { const level = hls.levels[hls.currentLevel]; document.getElementById('stat-bit').innerText = level.bitrate ? (level.bitrate / 1000).toFixed(0) + ' kbps' : 'Otomatik'; document.getElementById('stat-fps').innerText = level.frameRate ? level.frameRate + ' fps' : (video.videoWidth ? 'Stabilize Ediliyor' : 'Orijinal'); } else { document.getElementById('stat-bit').innerText = 'Doğrudan Akış'; document.getElementById('stat-fps').innerText = 'Orijinal'; } }
  let timeout; function resetControls() { vContainer.classList.remove('idle'); clearTimeout(timeout); timeout = setTimeout(() => { if (!video.paused && !document.getElementById('video-channel-menu').classList.contains('open')) vContainer.classList.add('idle'); }, 3000); }
  vContainer.addEventListener('mousemove', resetControls); vContainer.addEventListener('touchstart', resetControls); vContainer.addEventListener('mouseleave', () => { if (!video.paused) vContainer.classList.add('idle'); });
}
