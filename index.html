<!DOCTYPE html>
<html lang="tr" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>IHS MOBİL TV</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-main: #000000; 
      --bg-card: #121212;
      --ihs-red: #e50914;
      --text-main: #ffffff; 
      --text-muted: #888888;
      --border-color: #262626;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; outline: none; -webkit-tap-highlight-color: transparent; }
    
    body {
      background-color: var(--bg-main); 
      color: var(--text-main);
      font-family: system-ui, -apple-system, sans-serif; 
      height: 100vh; 
      display: flex;
      flex-direction: column;
      overflow: hidden; 
    }

    /* 1. ÜST SABİT OYNATICI VE BİLGİ ALANI */
    .player-section {
      flex-shrink: 0;
      background: var(--bg-main);
      z-index: 10;
      border-bottom: 1px solid var(--border-color);
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .video-container { 
      width: 100%; 
      background: #000; 
      aspect-ratio: 16/9;
    }
    .video-container video { 
      width: 100%; 
      height: 100%;
      object-fit: cover; 
      display: block;
    }

    /* Şu An Oynatılan Kanal Bilgisi (Gerçekçi ve Temiz) */
    .now-playing-bar {
      display: none; 
      padding: 12px 15px;
      align-items: center;
      gap: 12px;
      background: #0a0a0a;
    }
    .now-playing-logo {
      width: 38px; height: 38px;
      border-radius: 6px;
      background: #fff;
      padding: 2px;
      object-fit: contain;
    }
    .now-playing-info { flex: 1; }
    .now-playing-title { font-weight: 700; font-size: 15px; margin-bottom: 2px; }
    .live-badge { 
      font-size: 11px; font-weight: bold; color: var(--ihs-red); 
      display: flex; align-items: center; gap: 4px;
    }
    .live-dot { width: 6px; height: 6px; background: var(--ihs-red); border-radius: 50%; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

    /* Arama Kutusu */
    .search-container {
      padding: 10px 15px;
      background: var(--bg-main);
    }
    .search-box { 
      display: flex; align-items: center; 
      background: var(--bg-card); border: 1px solid var(--border-color); 
      border-radius: 8px; padding: 10px 12px; 
    }
    .search-box input { background: transparent; border: none; color: white; width: 100%; margin-left: 10px; font-size: 14px; }

    /* 2. KAYDIRILABİLİR ALT ALAN (Kategoriler ve Kanallar) */
    .content-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Yatay Kaydırılabilir Kategoriler (Mobil TV Tarzı) */
    .categories-bar {
      display: flex;
      overflow-x: auto;
      padding: 5px 15px 10px 15px;
      gap: 8px;
      border-bottom: 1px solid var(--border-color);
    }
    .categories-bar::-webkit-scrollbar { display: none; }
    .cat-btn {
      background: var(--bg-card);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 13px;
      white-space: nowrap;
      cursor: pointer;
      transition: 0.2s;
    }
    .cat-btn.active {
      background: var(--ihs-red);
      color: #fff;
      border-color: var(--ihs-red);
    }

    /* Dikey Kanal Listesi (Telefonda okuması en kolay yapı) */
    .channel-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .channel-row {
      display: flex;
      align-items: center;
      background: var(--bg-card);
      padding: 10px;
      border-radius: 10px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: 0.2s;
    }
    .channel-row:active {
      background: rgba(229, 9, 20, 0.1);
      border-color: var(--ihs-red);
      transform: scale(0.98);
    }
    .channel-row img {
      width: 45px; height: 45px;
      object-fit: contain;
      background: #fff;
      border-radius: 6px;
      padding: 3px;
      margin-right: 15px;
    }
    .channel-row-name {
      flex: 1;
      font-weight: 600;
      font-size: 14px;
      color: var(--text-main);
    }
    .channel-row i {
      color: var(--text-muted);
      font-size: 14px;
    }
  </style>
</head>
<body>

  <!-- SABİT OYNATICI ALANI -->
  <div class="player-section">
    <div class="video-container">
      <video id="video-player" controls autoplay playsinline></video>
    </div>
    
    <!-- Aktif Kanal Bilgisi (Sahte EPG Yok, Sadece Canlı İbaresi) -->
    <div class="now-playing-bar" id="now-playing-bar">
      <img id="np-logo" class="now-playing-logo" src="" alt="logo">
      <div class="now-playing-info">
        <div class="now-playing-title" id="np-title">-</div>
        <div class="live-badge">
          <div class="live-dot"></div> CANLI
        </div>
      </div>
    </div>

    <!-- Arama -->
    <div class="search-container">
      <div class="search-box">
        <i class="fas fa-search" style="color: var(--text-muted);"></i>
        <input type="text" id="search-input" placeholder="Kanal ara..." onkeyup="searchChannels()">
      </div>
    </div>
  </div>

  <!-- KAYDIRILABİLİR KANAL VE KATEGORİ ALANI -->
  <div class="content-section">
    <!-- Yatay Kategoriler -->
    <div class="categories-bar" id="categories-bar"></div>
    
    <!-- Dikey Kanal Listesi -->
    <div class="channel-list" id="channel-list"></div>
  </div>


<script>
// M3U LİSTESİ
const gomuluListe = `

#EXTINF:-1 tvg-logo="https://upload.wikimedia.org/wikipedia/commons/thumb/4/43/Diyanet_TV_logo.svg/960px-Diyanet_TV_logo.svg.png" group-title="Turkey",Diyanet TV
https://eustr73.mediatriple.net/videoonlylive/mtikoimxnztxlive/broadcast_5e3bf95a47e07.smil/playlist.m3u8

https://gzttv-live.lg.mncdn.com/gzttv/gzttv/playlist.m3u8

https://halktv-live.daioncdn.net/halktv/halktv.m3u8

https://ciner.daioncdn.net/ht-spor/ht-spor.m3u8?app=web

https://demiroren.daioncdn.net/kanald/kanald.m3u8?app=kanald_web&ce=3

https://uycyyuuzyh.turknet.ercdn.net/nphindgytw/nowtv/nowtv.m3u8
#EXTINF:-1 tvg-logo="https://upload.wikimedia.org/wikipedia/commons/thumb/0/0c/NTV_%28Turkey%29_logo.svg/960px-NTV_%28Turkey%29_logo.svg.png" group-title="Turkey",NTV
https://dogus.daioncdn.net/ntv/ntv.m3u8?app=ntv_web
#EXTINF:-1 tvg-logo="https://i.imgur.com/9O3DHRB.png" group-title="Turkey",Star TV
https://dogus.daioncdn.net/startv/startv_720p.m3u8?app=a20ac41e-bdc3-4aa1-934d-26b484480ac9&ce=3&sid=8l4w3lst4co5
#EXTINF:-1 tvg-logo="https://i.imgur.com/PrxwKDw.png" group-title="Turkey",TGRT Haber
https://canli.tgrthaber.com/tgrt.m3u8
#EXTINF:-1 tvg-logo="https://upload.wikimedia.org/wikipedia/commons/thumb/8/85/TRT_1_logo_%282021-%29.svg/960px-TRT_1_logo_%282021-%29.svg.png" group-title="Turkey",TRT 1
https://tv-trt1.medya.trt.com.tr/master.m3u8
#EXTINF:-1 tvg-logo="https://upload.wikimedia.org/wikipedia/commons/thumb/7/72/TRT_Haber_Eyl%C3%BCl_2020_Logo.svg/960px-TRT_Haber_Eyl%C3%BCl_2020_Logo.svg.png" group-title="Turkey",TRT Haber
https://tv-trthaber.medya.trt.com.tr/master.m3u8
`;

let allChannels = [];
let categories = new Set();
let currentCategory = 'Tüm Kanallar';
let hls = null;
const video = document.getElementById('video-player');

window.addEventListener('DOMContentLoaded', () => {
  parseContent(gomuluListe);
});

function parseContent(content) {
  const lines = content.split('\n');
  allChannels = []; 
  categories.clear(); 
  categories.add('Tüm Kanallar');

  let currentChannel = {};

  for (let i = 0; i < lines.length; i++) {
    let line = lines[i].trim();
    if (!line) continue;
    
    if (line.startsWith('#EXTINF:')) {
      const logoMatch = line.match(/tvg-logo="([^"]+)"/);
      const groupMatch = line.match(/group-title="([^"]+)"/);
      
      const logo = logoMatch ? logoMatch[1] : 'https://via.placeholder.com/150?text=TV';
      const group = groupMatch ? groupMatch[1] : 'Diğer';
      const name = line.split(',').pop().trim();
      
      currentChannel = { name: name, logo: logo, group: group };
      categories.add(group);
    } else if (line.startsWith('http')) {
      currentChannel.url = line;
      allChannels.push(currentChannel);
      currentChannel = {};
    }
  }
  
  renderCategories();
  renderChannels();
}

function renderCategories() {
  const bar = document.getElementById('categories-bar');
  bar.innerHTML = '';
  
  categories.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn';
    if(cat === currentCategory) btn.classList.add('active');
    btn.innerText = cat;
    btn.onclick = () => {
      currentCategory = cat;
      document.getElementById('search-input').value = ''; // Arama kutusunu sıfırla
      renderCategories(); // Aktif butonu güncellemek için
      renderChannels();
    };
    bar.appendChild(btn);
  });
}

function searchChannels() {
  const query = document.getElementById('search-input').value.toLowerCase();
  renderChannels(query);
}

function renderChannels(searchQuery = '') {
  const list = document.getElementById('channel-list');
  list.innerHTML = '';
  
  let filtered = currentCategory === 'Tüm Kanallar' ? allChannels : allChannels.filter(c => c.group === currentCategory);
  
  if (searchQuery) {
    filtered = allChannels.filter(c => c.name.toLowerCase().includes(searchQuery));
  }
  
  filtered.forEach(c => {
    const row = document.createElement('div');
    row.className = 'channel-row';
    row.innerHTML = `
      <img src="${c.logo}" onerror="this.src='https://via.placeholder.com/150?text=TV'">
      <div class="channel-row-name">${c.name}</div>
      <i class="fas fa-play"></i>
    `;
    row.onclick = () => playStream(c, c.url);
    list.appendChild(row);
  });
}

function playStream(channelObj, url) {
  // Aktif Kanal Bilgisini Göster
  document.getElementById('now-playing-bar').style.display = 'flex';
  document.getElementById('np-logo').src = channelObj.logo;
  document.getElementById('np-title').innerText = channelObj.name;

  if (hls) hls.destroy();
  if (Hls.isSupported() && url.includes('.m3u8')) {
    hls = new Hls();
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, function() { video.play(); });
  } else {
    video.src = url;
    video.play();
  }
}
</script>
</body>
</html>
