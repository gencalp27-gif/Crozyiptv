<!DOCTYPE html>
<html lang="tr" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>IHS TV - PRO MEDIA PLAYER</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-main: #000000; 
      --bg-card: #121212;
      --ihs-red: #e50914;
      --text-main: #ffffff; 
      --text-muted: #888888;
      --border-color: #262626;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; outline: none; -webkit-tap-highlight-color: transparent; }
    
    body {
      background-color: var(--bg-main); color: var(--text-main);
      font-family: system-ui, -apple-system, sans-serif; 
      height: 100vh; overflow: hidden; 
    }

    /* SPLASH SCREEN */
    .splash-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #000; z-index: 9999; display: flex; flex-direction: column;
      align-items: center; justify-content: center; transition: opacity 0.5s ease;
    }
    .splash-diamond {
      width: 80px; height: 80px; background: linear-gradient(135deg, #ff4b4b, #8b0000);
      transform: rotate(45deg); box-shadow: 0 0 30px rgba(229, 9, 20, 0.6);
      border: 2px solid #ff7a7a; animation: breathe 2s infinite ease-in-out; margin-bottom: 40px;
    }
    .splash-text { font-size: 28px; font-weight: 900; letter-spacing: 5px; color: var(--text-main); }
    .splash-text span { color: var(--ihs-red); }
    @keyframes breathe { 0% { transform: rotate(45deg) scale(1); box-shadow: 0 0 20px rgba(229,9,20,0.4); } 50% { transform: rotate(45deg) scale(1.1); box-shadow: 0 0 50px rgba(229,9,20,0.8); } 100% { transform: rotate(45deg) scale(1); box-shadow: 0 0 20px rgba(229,9,20,0.4); } }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-main); }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--ihs-red); }

    .app-wrapper { display: flex; height: 100vh; flex-direction: column; }

    /* =========================================
       GELİŞMİŞ ÖZEL VİDEO OYNATICI (CUSTOM PLAYER)
       ========================================= */
    .player-section { background: var(--bg-main); z-index: 10; display: flex; flex-direction: column; transform: translateZ(0); }
    
    .video-container { 
      width: 100%; background: #000; position: relative; display: flex; 
      align-items: center; justify-content: center; overflow: hidden;
    }
    .video-container video { 
      width: 100%; height: 100%; object-fit: contain; display: block; cursor: pointer;
    }

    /* Oynatıcı Kontrol Çubuğu (Netflix Tarzı) */
    .custom-controls {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 15px 10px 15px; z-index: 20;
      opacity: 1; transition: opacity 0.4s ease;
    }
    .video-container.idle .custom-controls { opacity: 0; pointer-events: none; }
    
    .controls-left, .controls-right { display: flex; align-items: center; gap: 18px; }
    
    .control-btn {
      background: none; border: none; color: #fff; font-size: 18px;
      cursor: pointer; transition: 0.2s; text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }
    .control-btn:hover { color: var(--ihs-red); transform: scale(1.1); }
    .control-btn.play-btn { font-size: 22px; }

    /* Yükleniyor (Buffering) Animasyonu */
    .loading-spinner {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.2);
      border-top-color: var(--ihs-red); border-radius: 50%;
      animation: spin 1s linear infinite; z-index: 15; display: none;
    }
    @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }

    /* Hata Ekranı */
    .error-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); z-index: 16; display: none; 
      flex-direction: column; align-items: center; justify-content: center; text-align: center;
    }
    .error-overlay i { font-size: 40px; color: var(--ihs-red); margin-bottom: 10px; }
    .error-overlay p { color: #fff; font-weight: bold; font-size: 14px; }

    /* Aktif Kanal Bilgisi Barı */
    .now-playing-bar { display: none; padding: 12px 15px; align-items: center; gap: 15px; background: #0a0a0a; border-bottom: 1px solid var(--border-color); }
    .now-playing-logo { width: 40px; height: 40px; border-radius: 8px; background: #fff; padding: 3px; object-fit: contain; }
    .now-playing-info { flex: 1; }
    .now-playing-title { font-weight: 700; font-size: 15px; margin-bottom: 2px; }
    .live-badge { font-size: 11px; font-weight: bold; color: var(--ihs-red); display: flex; align-items: center; gap: 5px; }
    .live-dot { width: 8px; height: 8px; background: var(--ihs-red); border-radius: 50%; animation: pulse 1.5s infinite; }

    /* MENÜ VE LİSTE ALANI */
    .sidebar-section { display: flex; flex-direction: column; background: var(--bg-main); overflow: hidden; flex:1;}
    .search-container { padding: 12px 15px; background: var(--bg-main); }
    .search-box { display: flex; align-items: center; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px 15px; }
    .search-box input { background: transparent; border: none; color: white; width: 100%; margin-left: 10px; font-size: 14px; }
    .search-box:focus-within { border-color: var(--ihs-red); }

    .categories-bar { display: flex; overflow-x: auto; padding: 0 15px 12px 15px; gap: 8px; border-bottom: 1px solid var(--border-color); -webkit-overflow-scrolling: touch; }
    .cat-btn { background: var(--bg-card); color: var(--text-muted); border: 1px solid var(--border-color); padding: 8px 16px; border-radius: 20px; font-weight: 600; font-size: 13px; white-space: nowrap; cursor: pointer; transition: 0.15s; }
    .cat-btn.active { background: var(--ihs-red); color: #fff; border-color: var(--ihs-red); }
    .cat-btn-fav { color: #ffeb3b; border-color: #333; }
    .cat-btn-fav.active { background: #ffeb3b; color: #000; border-color: #ffeb3b; }

    .channel-list { flex: 1; overflow-y: auto; padding: 10px 15px; display: flex; flex-direction: column; gap: 8px; -webkit-overflow-scrolling: touch; }
    .channel-row { display: flex; align-items: center; background: var(--bg-card); padding: 10px 15px; border-radius: 10px; border: 1px solid transparent; cursor: pointer; transition: 0.15s; }
    .channel-row:active { background: rgba(229, 9, 20, 0.15); border-color: var(--ihs-red); transform: scale(0.97); }
    .channel-row img { width: 45px; height: 45px; object-fit: contain; background: #fff; border-radius: 6px; padding: 3px; margin-right: 15px; }
    .channel-row-name { flex: 1; font-weight: 600; font-size: 14px; color: var(--text-main); }
    
    .fav-icon { font-size: 18px; color: #444; padding: 10px; transition: 0.2s; }
    .fav-icon.active { color: var(--ihs-red); }
    .fav-icon:hover { transform: scale(1.2); }

    /* RESPONSIVE */
    @media (max-width: 899px) {
      .player-section { flex-shrink: 0; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
      .video-container { aspect-ratio: 16/9; }
    }
    @media (min-width: 900px) {
      .app-wrapper { flex-direction: row; }
      .player-section { flex: 1; border-right: 1px solid var(--border-color); }
      .video-container { flex: 1; overflow: hidden; background: #000; }
      .sidebar-section { width: 400px; flex-shrink: 0; }
      .now-playing-bar { border-bottom: none; border-top: 1px solid var(--border-color); }
      .channel-row:hover { background: #1a1a1a; border-color: #333; }
    }
  </style>
</head>
<body>

  <!-- SPLASH SCREEN -->
  <div class="splash-screen" id="splash">
    <div class="splash-diamond"></div>
    <div class="splash-text"><span>IHS</span> PRO</div>
  </div>

  <div class="app-wrapper">
    
    <!-- GELİŞMİŞ OYNATICI -->
    <div class="player-section">
      <div class="video-container" id="video-container">
        
        <!-- Yükleniyor ve Hata Katmanları -->
        <div class="loading-spinner" id="loading-spinner"></div>
        <div class="error-overlay" id="error-overlay">
          <i class="fas fa-exclamation-triangle"></i>
          <p>Yayın Bağlantısı Koptu</p>
        </div>

        <!-- Video (controls parametresi silindi, custom yapıldı) -->
        <video id="video-player" playsinline></video>
        
        <!-- Özel Kontrol Çubuğu -->
        <div class="custom-controls" id="custom-controls">
          <div class="controls-left">
            <button class="control-btn play-btn" id="play-pause-btn"><i class="fas fa-play"></i></button>
            <button class="control-btn" id="mute-btn"><i class="fas fa-volume-up"></i></button>
          </div>
          <div class="controls-right">
            <button class="control-btn" id="pip-btn" title="Resim İçinde Resim"><i class="fas fa-clone"></i></button>
            <button class="control-btn" id="fullscreen-btn" title="Tam Ekran"><i class="fas fa-expand"></i></button>
          </div>
        </div>
      </div>

      <div class="now-playing-bar" id="now-playing-bar">
        <img id="np-logo" class="now-playing-logo" src="" alt="logo">
        <div class="now-playing-info">
          <div class="now-playing-title" id="np-title">-</div>
          <div class="live-badge">
            <div class="live-dot"></div> CANLI YAYIN
          </div>
        </div>
      </div>
    </div>

    <!-- YAN MENÜ -->
    <div class="sidebar-section">
      <div class="search-container">
        <div class="search-box">
          <i class="fas fa-search" style="color: var(--text-muted);"></i>
          <input type="text" id="search-input" placeholder="Kanal ara..." oninput="searchChannels()">
        </div>
      </div>
      <div class="categories-bar" id="categories-bar"></div>
      <div class="channel-list" id="channel-list"></div>
    </div>
  </div>

<script>
// AÇILIŞ ANİMASYONU
setTimeout(() => {
  const splash = document.getElementById('splash');
  splash.style.opacity = '0';
  setTimeout(() => { splash.style.display = 'none'; }, 500);
}, 2000);

const gomuluListe = `

https://uycyyuuzyh.turknet.ercdn.net/nphindgytw/nowtv/nowtv.m3u8

https://dogus.daioncdn.net/ntv/ntv.m3u8?app=ntv_web

https://tv-trt1.medya.trt.com.tr/master.m3u8
#EXTINF:-1 tvg-logo="https://upload.wikimedia.org/wikipedia/commons/thumb/7/72/TRT_Haber_Eyl%C3%BCl_2020_Logo.svg/960px-TRT_Haber_Eyl%C3%BCl_2020_Logo.svg.png" group-title="Turkey",TRT Haber

let allChannels = [];
let categories = new Set();
let currentCategory = 'Tüm Kanallar';
let hls = null;
let favorites = JSON.parse(localStorage.getItem('ihs_favorites')) || [];

const video = document.getElementById('video-player');
const videoContainer = document.getElementById('video-container');
const playPauseBtn = document.getElementById('play-pause-btn');
const muteBtn = document.getElementById('mute-btn');
const fullscreenBtn = document.getElementById('fullscreen-btn');
const pipBtn = document.getElementById('pip-btn');
const spinner = document.getElementById('loading-spinner');
const errorOverlay = document.getElementById('error-overlay');

const hlsConfig = { enableWorker: true, lowLatencyMode: true, backBufferLength: 90 };

// =========================================
// ÖZEL OYNATICI (CUSTOM PLAYER) SCRIPTLERİ
// =========================================

// PiP Desteği Kontrolü
if (!document.pictureInPictureEnabled) { pipBtn.style.display = 'none'; }

// Play/Pause Fonksiyonu
function togglePlay() {
  if (video.paused) { video.play(); } else { video.pause(); }
}
playPauseBtn.onclick = togglePlay;
video.onclick = togglePlay;

// Ses Aç/Kapat
muteBtn.onclick = () => {
  video.muted = !video.muted;
  muteBtn.innerHTML = video.muted ? '<i class="fas fa-volume-mute"></i>' : '<i class="fas fa-volume-up"></i>';
};

// Tam Ekran
fullscreenBtn.onclick = () => {
  if (!document.fullscreenElement) {
    if (videoContainer.requestFullscreen) videoContainer.requestFullscreen();
    else if (videoContainer.webkitRequestFullscreen) videoContainer.webkitRequestFullscreen();
  } else {
    if (document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
  }
};
video.ondblclick = fullscreenBtn.onclick;

// PiP (Resim İçinde Resim)
pipBtn.onclick = async () => {
  try {
    if (document.pictureInPictureElement) await document.exitPictureInPicture();
    else await video.requestPictureInPicture();
  } catch (err) { console.error("PiP Hatası:", err); }
};

// Video Eventleri (Durum Güncellemeleri)
video.addEventListener('play', () => { playPauseBtn.innerHTML = '<i class="fas fa-pause"></i>'; });
video.addEventListener('pause', () => { playPauseBtn.innerHTML = '<i class="fas fa-play"></i>'; });
video.addEventListener('waiting', () => { spinner.style.display = 'block'; });
video.addEventListener('playing', () => { spinner.style.display = 'none'; errorOverlay.style.display = 'none'; });

// Akıllı Kontrol Gizleme (3 Saniye Hareketsizlik)
let timeout;
function resetControlsTimeout() {
  videoContainer.classList.remove('idle');
  clearTimeout(timeout);
  timeout = setTimeout(() => {
    if (!video.paused) videoContainer.classList.add('idle');
  }, 3000);
}
videoContainer.addEventListener('mousemove', resetControlsTimeout);
videoContainer.addEventListener('touchstart', resetControlsTimeout);
videoContainer.addEventListener('mouseleave', () => { if (!video.paused) videoContainer.classList.add('idle'); });

// =========================================
// IPTV LİSTE VE KANAL YÖNETİMİ
// =========================================
window.addEventListener('DOMContentLoaded', () => { parseContent(gomuluListe); });

function parseContent(content) {
  const lines = content.split('\n');
  allChannels = []; categories.clear(); 
  let currentChannel = {};

  for (let i = 0; i < lines.length; i++) {
    let line = lines[i].trim();
    if (!line) continue;
    if (line.startsWith('#EXTINF:')) {
      const logoMatch = line.match(/tvg-logo="([^"]+)"/);
      const groupMatch = line.match(/group-title="([^"]+)"/);
      const logo = logoMatch ? logoMatch[1] : 'https://via.placeholder.com/150?text=TV';
      const group = groupMatch ? groupMatch[1] : 'Diğer';
      const name = line.split(',').pop().trim();
      currentChannel = { name, logo, group };
      categories.add(group);
    } else if (line.startsWith('http')) {
      currentChannel.url = line;
      allChannels.push(currentChannel);
      currentChannel = {};
    }
  }
  renderCategories(); renderChannels();
}

function renderCategories() {
  const bar = document.getElementById('categories-bar');
  bar.innerHTML = '';
  const fragment = document.createDocumentFragment();
  
  const favBtn = document.createElement('button');
  favBtn.className = 'cat-btn cat-btn-fav';
  if(currentCategory === 'Favorilerim') favBtn.classList.add('active');
  favBtn.innerHTML = '<i class="fas fa-heart"></i> Favoriler';
  favBtn.onclick = () => { setCategory('Favorilerim'); };
  fragment.appendChild(favBtn);

  const allBtn = document.createElement('button');
  allBtn.className = 'cat-btn';
  if(currentCategory === 'Tüm Kanallar') allBtn.classList.add('active');
  allBtn.innerText = 'Tüm Kanallar';
  allBtn.onclick = () => { setCategory('Tüm Kanallar'); };
  fragment.appendChild(allBtn);
  
  categories.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn';
    if(cat === currentCategory) btn.classList.add('active');
    btn.innerText = cat;
    btn.onclick = () => { setCategory(cat); };
    fragment.appendChild(btn);
  });
  bar.appendChild(fragment);
}

function setCategory(cat) {
  currentCategory = cat;
  document.getElementById('search-input').value = ''; 
  renderCategories(); renderChannels();
}

function searchChannels() { renderChannels(document.getElementById('search-input').value.toLowerCase()); }

function toggleFavorite(e, channelName) {
  e.stopPropagation(); 
  const index = favorites.indexOf(channelName);
  if (index > -1) favorites.splice(index, 1); else favorites.push(channelName);
  localStorage.setItem('ihs_favorites', JSON.stringify(favorites));
  renderChannels(document.getElementById('search-input').value.toLowerCase()); 
}

function renderChannels(searchQuery = '') {
  const list = document.getElementById('channel-list');
  list.innerHTML = '';
  
  let filtered = currentCategory === 'Favorilerim' ? allChannels.filter(c => favorites.includes(c.name)) 
               : currentCategory === 'Tüm Kanallar' ? allChannels : allChannels.filter(c => c.group === currentCategory);
  if (searchQuery) filtered = filtered.filter(c => c.name.toLowerCase().includes(searchQuery));
  
  const fragment = document.createDocumentFragment();
  
  if (filtered.length === 0 && currentCategory === 'Favorilerim') {
     list.innerHTML = '<div style="text-align:center; padding:30px; color:#666;">Henüz favori kanalın yok.</div>';
     return;
  }

  filtered.forEach(c => {
    const isFav = favorites.includes(c.name);
    const row = document.createElement('div');
    row.className = 'channel-row';
    row.innerHTML = `
      <img src="${c.logo}" loading="lazy" onerror="this.src='https://via.placeholder.com/150?text=TV'">
      <div class="channel-row-name">${c.name}</div>
      <i class="${isFav ? 'fas' : 'far'} fa-heart fav-icon ${isFav ? 'active' : ''}" onclick="toggleFavorite(event, '${c.name.replace(/'/g, "\\'")}')"></i>
    `;
    row.onclick = () => playStream(c, c.url);
    fragment.appendChild(row);
  });
  list.appendChild(fragment);
}

function playStream(channelObj, url) {
  document.getElementById('now-playing-bar').style.display = 'flex';
  document.getElementById('np-logo').src = channelObj.logo;
  document.getElementById('np-title').innerText = channelObj.name;
  errorOverlay.style.display = 'none';
  spinner.style.display = 'block';

  if (hls) hls.destroy();
  
  if (Hls.isSupported() && url.includes('.m3u8')) {
    hls = new Hls(hlsConfig);
    
    // HATA YAKALAMA (STREAM KOPARSA)
    hls.on(Hls.Events.ERROR, function (event, data) {
      if (data.fatal) {
        spinner.style.display = 'none';
        errorOverlay.style.display = 'flex';
        switch (data.type) {
          case Hls.ErrorTypes.NETWORK_ERROR:
            hls.startLoad(); // Ağı tekrar dene
            break;
          default:
            hls.destroy();
            break;
        }
      }
    });

    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, function() { video.play(); });
  } else {
    video.src = url;
    video.play();
  }
}
</script>
</body>
