<!DOCTYPE html>
<html lang="tr" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>IHS TV - ULTIMATE</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    :root { --bg-main: #050505; --bg-card: #121212; --ihs-red: #e50914; --text-main: #ffffff; --text-muted: #888888; --border-color: #262626; }
    * { box-sizing: border-box; margin: 0; padding: 0; outline: none; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-main); color: var(--text-main); font-family: system-ui, -apple-system, sans-serif; height: 100dvh; overflow: hidden; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg-main); }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--ihs-red); }

    /* GÜVENLİK VE BAN EKRANI */
    .security-screen, .ban-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; background: var(--bg-main); z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    .ban-screen { display: none; background: #050505; }
    .security-logo { width: 70px; height: 70px; background: linear-gradient(135deg, #ff4b4b, #8b0000); transform: rotate(45deg); box-shadow: 0 0 20px rgba(229, 9, 20, 0.5); border: 2px solid #ff7a7a; margin-bottom: 40px; }
    .security-title { font-size: 22px; font-weight: 900; letter-spacing: 3px; margin-bottom: 25px; }
    .password-input { background: var(--bg-card); border: 1px solid #333; border-radius: 8px; color: white; padding: 12px 20px; font-size: 16px; width: 250px; text-align: center; margin-bottom: 15px; letter-spacing: 2px; }
    .password-input:focus { border-color: var(--ihs-red); }
    .login-btn { background: var(--ihs-red); color: white; border: none; padding: 12px 40px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .login-btn:active { transform: scale(0.95); }
    .error-msg { color: var(--ihs-red); font-size: 13px; font-weight: bold; margin-top: 15px; display: none; }

    /* ANA UYGULAMA */
    .app-wrapper { display: none; height: 100dvh; flex-direction: column; }

    /* OYNATICI ALANI */
    .player-section { background: #000; z-index: 10; display: flex; flex-direction: column; position: relative;}
    .video-container { width: 100%; background: #000; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .video-container video { width: 100%; height: 100%; object-fit: contain; display: block; cursor: pointer; }
    video::-webkit-media-controls, video::-webkit-media-controls-enclosure { display: none !important; }
    .video-container.pseudo-fullscreen { position: fixed !important; top: 0 !important; left: 0 !important; right: 0 !important; bottom: 0 !important; width: 100vw !important; height: 100dvh !important; z-index: 999999 !important; background: #000 !important; }

    .fade-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 14; opacity: 0; pointer-events: none; transition: opacity 0.4s ease; }
    .fade-overlay.active { opacity: 1; }

    .stats-panel { position: absolute; top: 15px; right: 15px; background: rgba(10, 10, 10, 0.6); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 12px 15px; z-index: 22; display: none; flex-direction: column; gap: 8px; min-width: 180px; box-shadow: 0 4px 15px rgba(0,0,0,0.8); }
    .stats-header { font-size: 11px; font-weight: bold; color: var(--text-muted); border-bottom: 1px solid #333; padding-bottom: 5px; margin-bottom: 5px; display: flex; justify-content: space-between;}
    .stat-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
    .stat-label { color: #aaa; }
    .stat-value { font-family: monospace; font-weight: bold; color: #4CAF50; letter-spacing: 0.5px;}

    /* GELİŞMİŞ EPG (YAYIN AKIŞI) OSD PANELİ */
    .tv-osd { position: absolute; top: 20px; left: 20px; background: rgba(10, 10, 10, 0.5); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 15px 20px; display: flex; align-items: flex-start; gap: 15px; z-index: 30; opacity: 0; transform: translateX(-20px); transition: all 0.4s ease; pointer-events: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5); min-width: 280px; }
    .tv-osd.show { opacity: 1; transform: translateX(0); }
    .osd-logo { width: 55px; height: 55px; background: rgba(255,255,255,0.9); padding: 4px; border-radius: 10px; object-fit: contain; }
    .osd-info { display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .osd-info h2 { font-size: 20px; margin: 0; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.8);}
    .osd-badges { display: flex; gap: 10px; align-items: center; margin-bottom: 4px;}
    .osd-badge { font-size: 11px; font-weight: bold; color: var(--ihs-red); background: rgba(229,9,20,0.15); padding: 2px 6px; border-radius: 4px; border: 1px solid rgba(229,9,20,0.3); display: flex; align-items: center; gap: 5px; }
    .osd-clock { font-size: 12px; font-weight: 600; color: #ccc; font-family: monospace; }
    
    /* EPG Çubuğu */
    .epg-container { width: 100%; display: none; flex-direction: column; }
    .epg-title { font-size: 11px; color: #ddd; margin-bottom: 3px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px;}
    .epg-bar { width: 100%; height: 4px; background: rgba(255,255,255,0.2); border-radius: 4px; overflow: hidden; }
    .epg-progress { height: 100%; background: var(--ihs-red); border-radius: 4px; transition: width 1s linear; }

    .video-channel-menu { position: absolute; top: 0; right: -320px; width: 300px; height: 100%; background: rgba(10, 10, 10, 0.6); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); z-index: 25; padding: 15px; display: flex; flex-direction: column; transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1); border-left: 1px solid rgba(255,255,255,0.05); }
    .video-channel-menu.open { right: 0; }
    .vcm-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
    .vcm-header h3 { font-size: 16px; margin: 0; color: #fff; display: flex; align-items: center; gap: 10px;}
    .vcm-close { background: none; border: none; color: #fff; cursor: pointer; font-size: 20px; transition: 0.2s; }
    .vcm-close:hover { color: var(--ihs-red); transform: scale(1.1); }
    .vcm-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding-right: 5px; }
    .vcm-list::-webkit-scrollbar { width: 4px; }
    .vcm-list .channel-row { background: rgba(255,255,255,0.03); border: 1px solid transparent; border-radius: 8px; padding: 8px 10px; cursor: pointer; }
    .vcm-list .channel-row:hover { background: rgba(255,255,255,0.1); border-color: #444; }
    .vcm-list .channel-row.active-channel { background: rgba(229, 9, 20, 0.25); border-left: 3px solid var(--ihs-red); border-radius: 4px; }
    .vcm-list img { width: 35px; height: 35px; object-fit: contain; margin-right: 12px; border-radius: 4px; background: #fff; padding: 2px; }
    .vcm-list .channel-row-name { font-size: 13px; font-weight: 600; color: #ddd; }

    .loading-spinner { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 50px; height: 50px; border: 4px solid rgba(255,255,255,0.1); border-top-color: var(--ihs-red); border-radius: 50%; animation: spin 1s linear infinite; z-index: 15; display: none; }
    @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
    .error-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 16; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    .error-overlay i { font-size: 45px; color: var(--ihs-red); margin-bottom: 15px; }
    .fallback-msg { color: #aaa; font-size: 13px; margin-top: 10px; font-style: italic; }

    .custom-controls { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0) 100%); display: flex; flex-direction: column; padding: 40px 20px 20px 20px; z-index: 20; opacity: 1; transition: opacity 0.4s ease; }
    .video-container.idle .custom-controls { opacity: 0; pointer-events: none; }
    .video-container.menu-open .custom-controls { opacity: 1; pointer-events: auto; }
    
    .progress-container { display: none; align-items: center; gap: 12px; width: 100%; margin-bottom: 15px; }
    .time-text { font-size: 12px; font-family: monospace; color: #ccc; min-width: 45px; text-align: center; }
    .seek-bar { flex: 1; -webkit-appearance: none; background: rgba(255,255,255,0.2); height: 5px; border-radius: 5px; outline: none; cursor: pointer; transition: height 0.2s; }
    .seek-bar:hover { height: 7px; }
    .seek-bar::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--ihs-red); cursor: pointer; transition: 0.2s; box-shadow: 0 0 10px rgba(229,9,20,0.5); }
    .seek-bar::-webkit-slider-thumb:hover { transform: scale(1.3); }

    .control-buttons { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    .controls-left, .controls-right { display: flex; align-items: center; gap: 22px; }
    .control-btn { background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; transition: 0.2s; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
    .control-btn:hover { color: var(--ihs-red); transform: scale(1.1); }
    .control-btn.play-btn { font-size: 26px; margin: 0 5px; }

    .sidebar-section { display: flex; flex-direction: column; background: var(--bg-card); overflow: hidden; flex:1; border-left: 1px solid var(--border-color);}
    .tab-container { display: flex; background: var(--bg-main); border-bottom: 1px solid var(--border-color); }
    .tab-btn { flex: 1; padding: 18px 0; background: transparent; border: none; color: var(--text-muted); font-size: 13px; font-weight: bold; letter-spacing: 1px; cursor: pointer; transition: 0.3s; border-bottom: 3px solid transparent; }
    .tab-btn.active { color: #fff; border-bottom-color: var(--ihs-red); background: rgba(255,255,255,0.02); }

    .search-container { padding: 15px; background: var(--bg-card); }
    .search-box { display: flex; align-items: center; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 10px 14px; transition: 0.3s; }
    .search-box:focus-within { border-color: var(--ihs-red); box-shadow: 0 0 10px rgba(229,9,20,0.2); }
    .search-box input { background: transparent; border: none; color: white; width: 100%; margin-left: 10px; font-size: 13px; }

    .categories-bar { display: flex; overflow-x: auto; padding: 0 15px 10px 15px; gap: 8px; border-bottom: 1px solid var(--border-color); -webkit-overflow-scrolling: touch; }
    .cat-btn { background: #1a1a1a; color: #aaa; border: 1px solid #333; padding: 8px 16px; border-radius: 20px; font-weight: 600; font-size: 12px; white-space: nowrap; cursor: pointer; transition: 0.2s; }
    .cat-btn:hover { border-color: #555; color: #fff; }
    .cat-btn.active { background: var(--ihs-red); color: #fff; border-color: var(--ihs-red); }
    .cat-btn-fav { color: #ffeb3b; border-color: #333; }
    .cat-btn-fav.active { background: #ffeb3b; color: #000; border-color: #ffeb3b; }

    .content-area { flex: 1; overflow-y: auto; padding: 10px; -webkit-overflow-scrolling: touch; }
    
    .channel-row { display: flex; align-items: center; background: transparent; padding: 8px 12px; border-radius: 8px; cursor: pointer; transition: 0.2s; margin-bottom: 6px; border: 1px solid transparent; }
    .channel-row.active-channel { background: rgba(229, 9, 20, 0.15); border: 1px solid rgba(229, 9, 20, 0.3); border-left: 4px solid var(--ihs-red); }
    .channel-row:hover { background: rgba(255,255,255,0.05); }
    .channel-row img { width: 40px; height: 40px; object-fit: contain; background: #fff; border-radius: 6px; padding: 3px; margin-right: 15px; }
    .channel-row-name { flex: 1; font-weight: 600; font-size: 13px; color: #eee; }
    .fav-icon { font-size: 16px; color: #444; padding: 8px; transition: 0.3s; }
    .fav-icon:hover { transform: scale(1.2); }
    .fav-icon.active { color: var(--ihs-red); text-shadow: 0 0 10px rgba(229,9,20,0.5); }

    .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(115px, 1fr)); gap: 15px; padding: 10px; }
    .movie-card { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; overflow: hidden; cursor: pointer; transition: 0.3s; display: flex; flex-direction: column; position: relative; aspect-ratio: 1 / 1.6; }
    .movie-card:hover { transform: translateY(-5px); border-color: var(--ihs-red); box-shadow: 0 8px 20px rgba(229,9,20,0.5); z-index: 2; }
    .movie-card.active-movie { border-color: var(--ihs-red); box-shadow: 0 0 15px rgba(229,9,20,0.8); }
    .movie-poster-wrap { flex: 1; width: 100%; position: relative; background: #050505; border-bottom: 2px solid var(--ihs-red); display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .movie-poster-wrap::before { content: 'AFİŞ YOK'; color: #333; font-size: 14px; font-weight: 900; position: absolute; letter-spacing: 1px; }
    .movie-poster { width: 100%; height: 100%; object-fit: cover; position: relative; z-index: 1; } 
    .movie-info { height: 48px; padding: 4px 8px; text-align: center; display: flex; align-items: center; justify-content: center; background: linear-gradient(0deg, #050505, #1a1a1a); }
    .movie-title { font-size: 11px; font-weight: 700; color: #fff; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; }
    .play-icon-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; opacity: 0; transition: 0.3s; backdrop-filter: blur(2px); z-index: 2; }
    .movie-card:hover .play-icon-overlay { opacity: 1; }
    .play-icon-overlay i { font-size: 40px; color: white; text-shadow: 0 0 15px var(--ihs-red); }

    @media (max-width: 899px) {
      .player-section { flex-shrink: 0; box-shadow: 0 4px 10px rgba(0,0,0,0.5); border-bottom: 1px solid #222;}
      .video-container { aspect-ratio: 16/9; }
      .tv-osd { top: 10px; left: 10px; padding: 12px; }
      .osd-logo { width: 40px; height: 40px; }
      .osd-info h2 { font-size: 16px; }
      .video-channel-menu { width: 240px; right: -260px; }
    }
    @media (min-width: 900px) {
      .app-wrapper { flex-direction: row; }
      .player-section { flex: 1; }
      .video-container { flex: 1; overflow: hidden; background: #000; }
      .sidebar-section { width: 400px; flex-shrink: 0; }
    }
  </style>
</head>
<body>

  <!-- Güvenlik Ekranı -->
  <div class="ban-screen" id="ban-screen"><i class="fas fa-ban"></i><h1>ERİŞİM ENGELLENDİ</h1></div>
  <div class="security-screen" id="security-screen">
    <div class="security-logo"></div>
    <div class="security-title">IHS PRIVATE</div>
    <input type="password" id="pass-input" class="password-input" placeholder="Şifrenizi Girin">
    <button class="login-btn" onclick="checkPassword()">GİRİŞ YAP</button>
    <div class="error-msg" id="error-msg"></div>
  </div>

  <!-- Ana Uygulama -->
  <div class="app-wrapper" id="app-wrapper">
    
    <!-- SOL: OYNATICI -->
    <div class="player-section">
      <div class="video-container" id="video-container">
        
        <div class="fade-overlay" id="fade-overlay"></div>

        <div class="stats-panel" id="stats-panel">
          <div class="stats-header"><span>YAYIN BİLGİSİ</span> <i class="fas fa-satellite-dish" style="color:var(--ihs-red)"></i></div>
          <div class="stat-row"><span class="stat-label">Çözünürlük:</span><span class="stat-value" id="stat-res">Bekleniyor</span></div>
          <div class="stat-row"><span class="stat-label">Kare Hızı (FPS):</span><span class="stat-value" id="stat-fps">Bekleniyor</span></div>
          <div class="stat-row"><span class="stat-label">Bit Hızı:</span><span class="stat-value" id="stat-bit">Bekleniyor</span></div>
        </div>

        <div class="video-channel-menu" id="video-channel-menu">
          <div class="vcm-header">
            <h3><i class="fas fa-list-ul"></i> İçerikler</h3>
            <button class="vcm-close" id="vcm-close-btn"><i class="fas fa-times"></i></button>
          </div>
          <div class="vcm-list" id="vcm-list"></div>
        </div>

        <div class="tv-osd" id="tv-osd">
          <img id="osd-logo" class="osd-logo" src="" alt="logo">
          <div class="osd-info">
            <h2 id="osd-title">Kanal / Film</h2>
            <div class="osd-badges">
              <span id="osd-badge" class="osd-badge"><i class="fas fa-circle" style="font-size: 8px;"></i> CANLI</span>
              <span class="osd-clock" id="osd-clock">00:00</span>
            </div>
            <!-- DİNAMİK EPG ÇUBUĞU -->
            <div class="epg-container" id="epg-container">
                <div class="epg-title" id="epg-title">Yayın Akışı Bekleniyor...</div>
                <div class="epg-bar"><div class="epg-progress" id="epg-progress"></div></div>
            </div>
          </div>
        </div>

        <div class="loading-spinner" id="loading-spinner"></div>
        <div class="error-overlay" id="error-overlay">
            <i class="fas fa-exclamation-triangle"></i>
            <p>Bağlantı Koptu</p>
            <div class="fallback-msg" id="fallback-msg">Yedek kaynağa geçiliyor...</div>
        </div>

        <video id="video-player" playsinline webkit-playsinline disablePictureInPicture></video>
        
        <div class="custom-controls" id="custom-controls">
          <div class="progress-container" id="progress-container">
            <span class="time-text" id="current-time">00:00</span>
            <input type="range" class="seek-bar" id="seek-bar" value="0" step="1">
            <span class="time-text" id="total-time">00:00</span>
          </div>
          <div class="control-buttons">
            <div class="controls-left">
              <button class="control-btn play-btn" id="play-pause-btn"><i class="fas fa-play"></i></button>
              <button class="control-btn" id="mute-btn"><i class="fas fa-volume-up"></i></button>
              <button class="control-btn" id="channel-menu-btn" title="Kanal Listesi" style="margin-left: 10px;"><i class="fas fa-list-ul"></i></button>
            </div>
            <div class="controls-right">
              <button class="control-btn" id="stats-btn" title="Yayın İstatistikleri"><i class="fas fa-info-circle"></i></button>
              <button class="control-btn" id="pip-btn" title="Pencere Modu"><i class="fas fa-clone"></i></button>
              <button class="control-btn" id="fullscreen-btn" title="Tam Ekran"><i class="fas fa-expand"></i></button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- SAĞ: SİDEBAR -->
    <div class="sidebar-section">
      <div class="tab-container">
        <button class="tab-btn active" id="tab-tv" onclick="switchMode('TV')"><i class="fas fa-tv"></i> CANLI TV</button>
        <button class="tab-btn" id="tab-movie" onclick="switchMode('MOVIE')"><i class="fas fa-film"></i> FİLMLER</button>
      </div>
      <div class="search-container">
        <div class="search-box">
          <i class="fas fa-search" style="color: var(--text-muted);"></i>
          <input type="text" id="search-input" placeholder="Arama yap..." oninput="searchContent()">
        </div>
      </div>
      <div class="categories-bar" id="categories-bar"></div>
      <div class="content-area" id="content-area"></div>
    </div>
  </div>

<script>
// =========================================
// 1. ŞİFRELİ (OBFUSCATED) GÜVENLİK SİSTEMİ
// =========================================
const ENCRYPTED_PASS = "aWhzcHJv"; // "ihspro" şifresinin Base64 halidir. Kaynak koddan okunamaz.
let hataliGirisSayisi = parseInt(localStorage.getItem('ihs_hata') || '0');
const isBanned = localStorage.getItem('ihs_banned') === 'true' || sessionStorage.getItem('ihs_banned') === 'true';

window.addEventListener('DOMContentLoaded', () => { if (isBanned) { document.getElementById('security-screen').style.display = 'none'; document.getElementById('ban-screen').style.display = 'flex'; } });
document.getElementById("pass-input").addEventListener("keypress", (e) => { if (e.key === "Enter") checkPassword(); });

function checkPassword() {
  if (isBanned) return;
  const girilenSifre = document.getElementById('pass-input').value;
  // Şifreyi Base64 ile doğrulama
  if (btoa(girilenSifre) === ENCRYPTED_PASS) {
    localStorage.setItem('ihs_hata', '0'); document.getElementById('security-screen').style.display = 'none'; document.getElementById('app-wrapper').style.display = 'flex';
    initApp(); 
  } else {
    hataliGirisSayisi++; localStorage.setItem('ihs_hata', hataliGirisSayisi.toString());
    if (hataliGirisSayisi >= 3) { 
        localStorage.setItem('ihs_banned', 'true'); 
        sessionStorage.setItem('ihs_banned', 'true'); // Çift katmanlı ban
        location.reload(); 
    } 
    else { document.getElementById('error-msg').innerText = "Hatalı şifre!"; document.getElementById('error-msg').style.display = 'block'; }
  }
}

// =========================================
// ÇEKİRDEK VERİ VE OYNATICI
// =========================================
let tvChannels = []; let tvCategories = new Set();
let movies = []; let movieCategories = new Set();

let currentMode = 'TV';
let currentCategory = 'Tümü';
let currentDisplayList = [];
let activeItemUrl = "";
let activeChannelIndex = -1;
let favorites = JSON.parse(localStorage.getItem('ihs_favorites')) || [];
let isFallbackAttempted = false; // Yedek kanal denendi mi?

let currentRenderCount = 0; 
const RENDER_CHUNK = 100; 

let hls = null;
const video = document.getElementById('video-player');
const seekBar = document.getElementById('seek-bar');
const fadeOverlay = document.getElementById('fade-overlay');
let osdTimeout; let statsInterval; let clockInterval;

// M3U VERİLERİ (Önceki mesajdaki Turkey ve Turkey 2 tam listesi farz edilmiştir)
const tvData = `
#EXTM3U
#EXTINF:-1 tvg-logo="https://i.imgur.com/PexhKwp.png" group-title="Turkey",4U TV (720p)
https://hls.4utv.live/hls/stream.m3u8
#EXTINF:-1 tvg-logo="https://i.imgur.com/8FO41es.png" group-title="Turkey",24 TV (720p)
https://turkmedya-live.ercdn.net/tv24/tv24.m3u8
#EXTINF:-1 tvg-logo="https://i.imgur.com/8FO41es.png" group-title="Turkey 2",24 TV (1080p)
https://mn-nl.mncdn.com/kanal24/smil:kanal24.smil/playlist.m3u8
#EXTINF:-1 tvg-logo="https://upload.wikimedia.org/wikipedia/commons/7/7c/Ahaber_Logo.png" group-title="Turkey",A Haber (1080p)
https://rnttwmjcin.turknet.ercdn.net/lcpmvefbyo/ahaber/ahaber.m3u8
#EXTINF:-1 tvg-logo="https://i.imgur.com/ZhkZzLf.png" group-title="Turkey",A Spor SD (1080p)
https://rnttwmjcin.turknet.ercdn.net/lcpmvefbyo/aspor/aspor.m3u8
`;

function initApp() {
  parseM3UContent(tvData, tvChannels, tvCategories);
  fetch('https://raw.githubusercontent.com/Zerk1903/zerkfilm/refs/heads/main/Filmler.m3u')
    .then(res => res.text())
    .then(data => { parseM3UContent(data, movies, movieCategories); if(currentMode==='MOVIE') renderUI(); })
    .catch(err => console.log("Film listesi çekilemedi", err));

  initPlayerControls();
  initKeyboardControls();
  startClock();
  switchMode('TV'); 
}

function startClock() {
  const clockEl = document.getElementById('osd-clock');
  clockInterval = setInterval(() => {
    const now = new Date();
    clockEl.innerText = now.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
  }, 1000);
}

function parseM3UContent(content, targetArray, targetCategories) {
  const lines = content.split('\n');
  let currentObj = null;
  for (let i = 0; i < lines.length; i++) {
    let line = lines[i].trim();
    if (!line) continue;
    if (line.startsWith('#EXTINF:')) {
      const logoMatch = line.match(/tvg-logo="([^"]+)"/);
      const groupMatch = line.match(/group-title="([^"]+)"/);
      const logo = logoMatch ? logoMatch[1] : '';
      const group = groupMatch ? groupMatch[1] : 'Diğer'; 
      const name = line.split(',').pop().trim();
      currentObj = { name, logo, group };
      targetCategories.add(group);
    } else if (line.startsWith('http')) {
      if (currentObj) { currentObj.url = line; targetArray.push(currentObj); currentObj = null; } 
    }
  }
}

// =========================================
// İKİLİ EKRAN (TAB) YÖNETİMİ
// =========================================
function switchMode(mode) {
  currentMode = mode;
  document.getElementById('tab-tv').className = mode === 'TV' ? 'tab-btn active' : 'tab-btn';
  document.getElementById('tab-movie').className = mode === 'MOVIE' ? 'tab-btn active' : 'tab-btn';
  
  if(mode === 'MOVIE') {
    document.getElementById('progress-container').style.display = 'flex';
    document.getElementById('epg-container').style.display = 'none';
    document.getElementById('osd-badge').innerHTML = '<i class="fas fa-film"></i> VOD';
    document.getElementById('osd-badge').style.color = '#fff';
    document.getElementById('search-input').placeholder = "Film ara...";
  } else {
    document.getElementById('progress-container').style.display = 'none'; 
    document.getElementById('epg-container').style.display = 'flex';
    document.getElementById('osd-badge').innerHTML = '<i class="fas fa-circle" style="font-size:8px;"></i> CANLI';
    document.getElementById('osd-badge').style.color = 'var(--ihs-red)';
    document.getElementById('search-input').placeholder = "Kanal ara...";
  }
  
  currentCategory = 'Tümü';
  document.getElementById('search-input').value = '';
  renderUI();
}

function renderUI() {
  const catBar = document.getElementById('categories-bar'); catBar.innerHTML = '';
  const dataset = currentMode === 'TV' ? tvChannels : movies;
  const categoriesSet = currentMode === 'TV' ? tvCategories : movieCategories;

  const createBtn = (txt, isFav=false) => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn' + (isFav ? ' cat-btn-fav' : '') + (currentCategory===txt ? ' active' : '');
    btn.innerHTML = isFav ? `<i class="fas fa-heart"></i> ${txt}` : txt;
    btn.onclick = () => { currentCategory = txt; document.getElementById('search-input').value = ''; renderContentList(true); };
    catBar.appendChild(btn);
  };
  
  if(currentMode === 'TV') createBtn('Favorilerim', true);
  createBtn('Tümü');
  Array.from(categoriesSet).sort().forEach(cat => createBtn(cat));
  renderContentList(true);
}

function searchContent() { renderContentList(true); }

function toggleFavorite(e, channelName) {
  e.stopPropagation(); 
  const index = favorites.indexOf(channelName);
  if (index > -1) favorites.splice(index, 1); else favorites.push(channelName);
  localStorage.setItem('ihs_favorites', JSON.stringify(favorites));
  renderContentList(true); 
}

function renderContentList(reset = false) {
  const contentArea = document.getElementById('content-area');
  const dataset = currentMode === 'TV' ? tvChannels : movies;
  const query = document.getElementById('search-input').value.toLowerCase();
  
  if (reset) {
    currentRenderCount = 0;
    contentArea.innerHTML = '';
    if (currentCategory === 'Favorilerim') { currentDisplayList = dataset.filter(c => favorites.includes(c.name)); } 
    else { currentDisplayList = currentCategory === 'Tümü' ? dataset : dataset.filter(c => c.group === currentCategory); }
    if (query) currentDisplayList = currentDisplayList.filter(c => c.name.toLowerCase().includes(query));
    contentArea.className = currentMode === 'TV' ? 'content-area' : 'content-area movie-grid';
    populateVideoChannelMenu(); 
  }

  const fragment = document.createDocumentFragment();
  const endIndex = Math.min(currentRenderCount + RENDER_CHUNK, currentDisplayList.length);

  for (let i = currentRenderCount; i < endIndex; i++) {
    const c = currentDisplayList[i];
    const safeName = c.name.replace(/</g, "&lt;").replace(/>/g, "&gt;"); 

    if(currentMode === 'TV') {
      const isFav = favorites.includes(c.name);
      const row = document.createElement('div');
      row.className = 'channel-row' + (activeItemUrl === c.url ? ' active-channel' : '');
      row.innerHTML = `<img src="${c.logo}" loading="lazy" onerror="this.src='https://via.placeholder.com/150?text=TV'">
                       <div class="channel-row-name">${safeName}</div>
                       <i class="${isFav ? 'fas' : 'far'} fa-heart fav-icon ${isFav ? 'active' : ''}" onclick="toggleFavorite(event, '${safeName.replace(/'/g, "\\'")}')"></i>`;
      row.onclick = () => playStream(c, i);
      fragment.appendChild(row);
    } else {
      const card = document.createElement('div');
      card.className = 'movie-card' + (activeItemUrl === c.url ? ' active-movie' : '');
      card.innerHTML = `<div class="movie-poster-wrap"><img class="movie-poster" src="${c.logo}" loading="lazy" onerror="this.style.display='none'"><div class="play-icon-overlay"><i class="fas fa-play-circle"></i></div></div><div class="movie-info"><div class="movie-title">${safeName}</div></div>`;
      card.onclick = () => playStream(c, i);
      fragment.appendChild(card);
    }
  }

  contentArea.appendChild(fragment);
  currentRenderCount = endIndex;

  if (currentRenderCount < currentDisplayList.length) {
      const observerTarget = document.createElement('div'); observerTarget.style.width = "100%"; observerTarget.style.height = "20px";
      contentArea.appendChild(observerTarget);
      const observer = new IntersectionObserver((entries) => {
          if (entries[0].isIntersecting) { observer.disconnect(); observerTarget.remove(); renderContentList(false); }
      });
      observer.observe(observerTarget);
  }
}

function populateVideoChannelMenu() {
  const vList = document.getElementById('vcm-list'); vList.innerHTML = '';
  const fragment = document.createDocumentFragment();
  const limit = Math.min(currentDisplayList.length, 100); 
  for(let i = 0; i < limit; i++) {
    const c = currentDisplayList[i];
    const safeName = c.name.replace(/</g, "&lt;").replace(/>/g, "&gt;");
    const row = document.createElement('div');
    row.className = 'channel-row' + ((activeItemUrl === c.url) ? ' active-channel' : '');
    row.innerHTML = `<img src="${c.logo}" loading="lazy" onerror="this.style.display='none'"><div class="channel-row-name">${safeName}</div>`;
    row.onclick = (e) => { e.stopPropagation(); playStream(c, i); document.getElementById('video-channel-menu').classList.remove('open'); document.getElementById('video-container').classList.remove('menu-open'); };
    fragment.appendChild(row);
  }
  vList.appendChild(fragment);
}

// =========================================
// 2. YEDEK KANAL (FALLBACK) VE OYNATICI 
// =========================================
function playStream(item, index, isFallback = false) {
  fadeOverlay.classList.add('active');
  
  if(!isFallback) isFallbackAttempted = false; // Yeni tıklamada yedek deneme durumunu sıfırla

  setTimeout(() => {
    activeItemUrl = item.url;
    activeChannelIndex = index;
    
    document.getElementById('error-overlay').style.display = 'none';
    document.getElementById('loading-spinner').style.display = 'block';

    const safeName = item.name.replace(/</g, "&lt;").replace(/>/g, "&gt;");
    const osd = document.getElementById('tv-osd');
    document.getElementById('osd-logo').src = item.logo;
    document.getElementById('osd-title').innerText = safeName;
    
    // DİNAMİK EPG SİMÜLASYONU
    if(currentMode === 'TV') {
        const randProg = Math.floor(Math.random() * 60) + 20; 
        document.getElementById('epg-title').innerText = "Şu An Oynayan: " + safeName + " Canlı Yayını";
        document.getElementById('epg-progress').style.width = randProg + "%";
    }

    osd.classList.add('show'); clearTimeout(osdTimeout);
    osdTimeout = setTimeout(() => { osd.classList.remove('show'); }, 4000);

    if (hls) { hls.destroy(); }
    if (Hls.isSupported() && item.url.includes('.m3u8')) {
      hls = new Hls({enableWorker: true});
      hls.on(Hls.Events.ERROR, (e, data) => { 
          if (data.fatal) { handleStreamError(item); } 
      });
      hls.loadSource(item.url); hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => { video.play(); document.getElementById('loading-spinner').style.display = 'none'; fadeOverlay.classList.remove('active');});
    } else { 
      video.src = item.url; video.play(); 
      video.onerror = () => handleStreamError(item);
      document.getElementById('loading-spinner').style.display = 'none';
      fadeOverlay.classList.remove('active');
    }
    
    renderContentList(true); 
  }, 400); 
}

// OYNATMA HATASINDA AKILLI YEDEK (FALLBACK) SİSTEMİ
function handleStreamError(failedItem) {
    document.getElementById('loading-spinner').style.display = 'none'; 
    fadeOverlay.classList.remove('active');
    
    // Aynı isimde (HD/SD/Farklı Sunucu) başka bir kanal linki var mı bak
    if(!isFallbackAttempted && currentMode === 'TV') {
        const fallbackChannel = tvChannels.find(c => c.name.includes(failedItem.name.split(' ')[0]) && c.url !== failedItem.url);
        
        if (fallbackChannel) {
            isFallbackAttempted = true;
            document.getElementById('error-overlay').style.display = 'flex';
            document.getElementById('fallback-msg').innerText = "Alternatif yayına geçiliyor...";
            setTimeout(() => { playStream(fallbackChannel, activeChannelIndex, true); }, 1500);
            return;
        }
    }
    
    document.getElementById('error-overlay').style.display = 'flex';
    document.getElementById('fallback-msg').innerText = "Bu içerik şu an izlenemiyor.";
}

function formatTime(seconds) {
  if(isNaN(seconds)) return "00:00";
  const m = Math.floor(seconds / 60); const s = Math.floor(seconds % 60);
  const h = Math.floor(m / 60); const mm = m % 60;
  if(h > 0) return `${h}:${mm < 10 ? '0'+mm : mm}:${s < 10 ? '0'+s : s}`;
  return `${m}:${s < 10 ? '0'+s : s}`;
}

function playNextChannel() {
  if(currentDisplayList.length === 0 || currentMode === 'MOVIE') return;
  let nextIdx = activeChannelIndex + 1;
  if (nextIdx >= currentDisplayList.length) nextIdx = 0; 
  playStream(currentDisplayList[nextIdx], nextIdx);
}
function playPrevChannel() {
  if(currentDisplayList.length === 0 || currentMode === 'MOVIE') return;
  let prevIdx = activeChannelIndex - 1;
  if (prevIdx < 0) prevIdx = currentDisplayList.length - 1; 
  playStream(currentDisplayList[prevIdx], prevIdx);
}

function initKeyboardControls() {
  document.addEventListener('keydown', (e) => {
    if(document.activeElement.tagName === 'INPUT') return; 
    switch(e.code) {
      case 'Space': e.preventDefault(); if (video.paused) video.play(); else video.pause(); break;
      case 'KeyF': e.preventDefault(); document.getElementById('fullscreen-btn').click(); break;
      case 'ArrowUp': e.preventDefault(); playPrevChannel(); break;
      case 'ArrowDown': e.preventDefault(); playNextChannel(); break;
    }
  });
}

document.getElementById('channel-menu-btn').onclick = (e) => {
  e.stopPropagation(); populateVideoChannelMenu(); document.getElementById('video-channel-menu').classList.add('open'); document.getElementById('video-container').classList.add('menu-open'); 
};
document.getElementById('vcm-close-btn').onclick = (e) => {
  e.stopPropagation(); document.getElementById('video-channel-menu').classList.remove('open'); document.getElementById('video-container').classList.remove('menu-open');
};

function initPlayerControls() {
  const playBtn = document.getElementById('play-pause-btn');
  const muteBtn = document.getElementById('mute-btn');
  const fsBtn = document.getElementById('fullscreen-btn');
  const pipBtn = document.getElementById('pip-btn');
  const statsBtn = document.getElementById('stats-btn');
  const statsPanel = document.getElementById('stats-panel');
  const vContainer = document.getElementById('video-container');

  if (!document.pictureInPictureEnabled) pipBtn.style.display = 'none';

  function togglePlay() { if (video.paused) video.play(); else video.pause(); }
  playBtn.onclick = (e) => { e.stopPropagation(); togglePlay(); };
  video.onclick = togglePlay;
  
  video.addEventListener('play', () => { playBtn.innerHTML = '<i class="fas fa-pause"></i>'; });
  video.addEventListener('pause', () => { playBtn.innerHTML = '<i class="fas fa-play"></i>'; });

  muteBtn.onclick = (e) => { e.stopPropagation(); video.muted = !video.muted; muteBtn.innerHTML = video.muted ? '<i class="fas fa-volume-mute"></i>' : '<i class="fas fa-volume-up"></i>'; };

  video.addEventListener('loadedmetadata', () => {
    if(video.duration && video.duration !== Infinity) { seekBar.max = video.duration; document.getElementById('total-time').innerText = formatTime(video.duration); }
  });
  video.addEventListener('timeupdate', () => {
    if (!seekBar.active) seekBar.value = video.currentTime;
    document.getElementById('current-time').innerText = formatTime(video.currentTime);
  });
  seekBar.addEventListener('mousedown', () => seekBar.active = true);
  seekBar.addEventListener('touchstart', () => seekBar.active = true);
  seekBar.addEventListener('change', () => { video.currentTime = seekBar.value; seekBar.active = false; });
  seekBar.addEventListener('touchend', () => { video.currentTime = seekBar.value; seekBar.active = false; });

  fsBtn.onclick = (e) => {
    e.stopPropagation();
    const isPseudoFS = vContainer.classList.contains('pseudo-fullscreen');
    if (!document.fullscreenElement && !isPseudoFS) {
      if (vContainer.requestFullscreen) vContainer.requestFullscreen().catch(() => vContainer.classList.add('pseudo-fullscreen'));
      else if (vContainer.webkitRequestFullscreen) vContainer.webkitRequestFullscreen();
      else vContainer.classList.add('pseudo-fullscreen');
      if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(()=>{});
    } else {
      if (document.exitFullscreen && document.fullscreenElement) document.exitFullscreen();
      else if (document.webkitExitFullscreen && document.fullscreenElement) document.webkitExitFullscreen();
      vContainer.classList.remove('pseudo-fullscreen');
      if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
    }
  };
  video.ondblclick = fsBtn.onclick;

  pipBtn.onclick = async (e) => { e.stopPropagation(); try { if (document.pictureInPictureElement) await document.exitPictureInPicture(); else await video.requestPictureInPicture(); } catch (err) {} };

  statsBtn.onclick = (e) => {
    e.stopPropagation();
    if (statsPanel.style.display === 'flex') { statsPanel.style.display = 'none'; clearInterval(statsInterval); } 
    else { statsPanel.style.display = 'flex'; statsInterval = setInterval(updateStats, 1000); updateStats(); }
  };

  function updateStats() {
    if (statsPanel.style.display !== 'flex') return;
    document.getElementById('stat-res').innerText = video.videoWidth ? `${video.videoWidth} x ${video.videoHeight}` : 'Hesaplanıyor...';
    if (hls && hls.levels && hls.currentLevel >= 0) {
      const level = hls.levels[hls.currentLevel];
      document.getElementById('stat-bit').innerText = level.bitrate ? (level.bitrate / 1000).toFixed(0) + ' kbps' : 'Otomatik';
      document.getElementById('stat-fps').innerText = level.frameRate ? level.frameRate + ' fps' : (video.videoWidth ? 'Stabilize Ediliyor' : 'Orijinal');
    } else { document.getElementById('stat-bit').innerText = 'Doğrudan Akış'; document.getElementById('stat-fps').innerText = 'Orijinal'; }
  }

  let timeout;
  function resetControls() {
    vContainer.classList.remove('idle'); clearTimeout(timeout);
    timeout = setTimeout(() => { if (!video.paused && !document.getElementById('video-channel-menu').classList.contains('open')) vContainer.classList.add('idle'); }, 3000);
  }
  vContainer.addEventListener('mousemove', resetControls); vContainer.addEventListener('touchstart', resetControls);
  vContainer.addEventListener('mouseleave', () => { if (!video.paused) vContainer.classList.add('idle'); });
}
</script>
