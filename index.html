<!DOCTYPE html>
<html lang="tr" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>IHS TV - PRO</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-main: #000000; 
      --bg-card: #121212;
      --ihs-red: #e50914;
      --text-main: #ffffff; 
      --text-muted: #888888;
      --border-color: #262626;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; outline: none; -webkit-tap-highlight-color: transparent; }
    
    body {
      background-color: var(--bg-main); 
      color: var(--text-main);
      font-family: system-ui, -apple-system, sans-serif; 
      height: 100vh; 
      overflow: hidden; 
    }

    /* PC İÇİN ÖZEL SCROLLBAR (KAYDIRMA ÇUBUĞU) */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-main); }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--ihs-red); }

    /* ANA EKRAN DÜZENİ */
    .app-wrapper {
      display: flex;
      height: 100vh;
      flex-direction: column; /* Mobilde alt alta */
    }

    /* 1. OYNATICI ALANI (SOL/ÜST) */
    .player-section {
      background: var(--bg-main);
      z-index: 10;
      display: flex;
      flex-direction: column;
    }

    .video-container { 
      width: 100%; 
      background: #000; 
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    /* PC'de tam sığması, mobilde 16:9 olması için ayar */
    .video-container video { 
      width: 100%; 
      height: 100%;
      object-fit: contain; /* Masaüstünde haber alt yazılarının kesilmesini engeller */
      display: block;
    }

    /* Aktif Kanal Bilgisi (Canlı İbaresi) */
    .now-playing-bar {
      display: none; 
      padding: 15px 20px;
      align-items: center;
      gap: 15px;
      background: #0a0a0a;
      border-bottom: 1px solid var(--border-color);
    }
    .now-playing-logo {
      width: 45px; height: 45px;
      border-radius: 8px;
      background: #fff;
      padding: 3px;
      object-fit: contain;
    }
    .now-playing-info { flex: 1; }
    .now-playing-title { font-weight: 700; font-size: 16px; margin-bottom: 4px; }
    .live-badge { 
      font-size: 12px; font-weight: bold; color: var(--ihs-red); 
      display: flex; align-items: center; gap: 5px;
    }
    .live-dot { width: 8px; height: 8px; background: var(--ihs-red); border-radius: 50%; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }


    /* 2. KANAL LİSTESİ VE MENÜ ALANI (SAĞ/ALT) */
    .sidebar-section {
      display: flex;
      flex-direction: column;
      background: var(--bg-main);
      overflow: hidden;
    }

    /* Arama Kutusu */
    .search-container { padding: 15px; background: var(--bg-main); }
    .search-box { 
      display: flex; align-items: center; 
      background: var(--bg-card); border: 1px solid var(--border-color); 
      border-radius: 8px; padding: 10px 15px; 
    }
    .search-box input { background: transparent; border: none; color: white; width: 100%; margin-left: 10px; font-size: 14px; }
    .search-box:focus-within { border-color: var(--ihs-red); }

    /* Kategoriler */
    .categories-bar {
      display: flex; overflow-x: auto; padding: 0 15px 15px 15px; gap: 8px;
      border-bottom: 1px solid var(--border-color);
    }
    .cat-btn {
      background: var(--bg-card); color: var(--text-muted);
      border: 1px solid var(--border-color); padding: 8px 16px; border-radius: 20px;
      font-weight: 600; font-size: 13px; white-space: nowrap; cursor: pointer; transition: 0.2s;
    }
    .cat-btn:hover { color: #fff; border-color: #555; }
    .cat-btn.active { background: var(--ihs-red); color: #fff; border-color: var(--ihs-red); }

    /* Dikey Kanal Listesi */
    .channel-list {
      flex: 1; overflow-y: auto; padding: 10px 15px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .channel-row {
      display: flex; align-items: center; background: var(--bg-card);
      padding: 10px 15px; border-radius: 10px; border: 1px solid transparent;
      cursor: pointer; transition: 0.2s;
    }
    .channel-row:hover { background: #1a1a1a; border-color: #333; }
    .channel-row:active { background: rgba(229, 9, 20, 0.15); border-color: var(--ihs-red); transform: scale(0.98); }
    .channel-row img {
      width: 45px; height: 45px; object-fit: contain; background: #fff;
      border-radius: 6px; padding: 3px; margin-right: 15px;
    }
    .channel-row-name { flex: 1; font-weight: 600; font-size: 14px; color: var(--text-main); }
    .channel-row i { color: var(--text-muted); font-size: 14px; transition: 0.2s; }
    .channel-row:hover i { color: var(--ihs-red); }


    /* =========================================
       RESPONSIVE (PC VE MOBİL AYRIMI) 
       ========================================= */
       
    /* MOBİL GÖRÜNÜM (Genişlik 899px'den küçükse) */
    @media (max-width: 899px) {
      .player-section { flex-shrink: 0; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
      .video-container { aspect-ratio: 16/9; }
      .sidebar-section { flex: 1; }
    }

    /* MASAÜSTÜ / PC GÖRÜNÜMÜ (Genişlik 900px ve üzeriyse) */
    @media (min-width: 900px) {
      .app-wrapper { flex-direction: row; }
      
      /* Sol Taraf: Video Alanı Genişler */
      .player-section { 
        flex: 1; /* Kalan tüm boşluğu doldur */
        border-right: 1px solid var(--border-color); 
        box-shadow: none;
      }
      .video-container { flex: 1; overflow: hidden; background: #000; }
      
      /* Sağ Taraf: Yan Menü (Sidebar) Sabit Genişlik Alır */
      .sidebar-section { 
        width: 400px; /* PC'de menü genişliği */
        flex-shrink: 0; 
      }
      .now-playing-bar { border-bottom: none; border-top: 1px solid var(--border-color); }
    }
  </style>
</head>
<body>

  <div class="app-wrapper">
    
    <!-- OYNATICI ALANI (Mobilde üstte, PC'de solda) -->
    <div class="player-section">
      <div class="video-container">
        <video id="video-player" controls autoplay playsinline></video>
      </div>
      
      <div class="now-playing-bar" id="now-playing-bar">
        <img id="np-logo" class="now-playing-logo" src="" alt="logo">
        <div class="now-playing-info">
          <div class="now-playing-title" id="np-title">-</div>
          <div class="live-badge">
            <div class="live-dot"></div> CANLI YAYIN
          </div>
        </div>
      </div>
    </div>

    <!-- KANAL LİSTESİ VE MENÜ (Mobilde altta, PC'de sağda) -->
    <div class="sidebar-section">
      
      <div class="search-container">
        <div class="search-box">
          <i class="fas fa-search" style="color: var(--text-muted);"></i>
          <input type="text" id="search-input" placeholder="Kanal ara..." onkeyup="searchChannels()">
        </div>
      </div>

      <div class="categories-bar" id="categories-bar"></div>
      <div class="channel-list" id="channel-list"></div>
      
    </div>

  </div>


<script>
// M3U LİSTESİ
const gomuluListe = `
#EXTM3U
#EXTINF:-1 tvg-logo="https://i.imgur.com/PexhKwp.png" group-title="Turkey",4U TV
https://hls.4utv.live/hls/stream.m3u8
#EXTINF:-1 tvg-logo="https://i.imgur.com/8FO41es.png" group-title="Turkey",24 TV
https://turkmedya-live.ercdn.net/tv24/tv24.m3u8
#EXTINF:-1 tvg-logo="https://i.imgur.com/agn47sQ.png" group-title="Turkey",360 TV
https://turkmedya-live.ercdn.net/tv360/tv360.m3u8
#EXTINF:-1 tvg-logo="https://iatv.tmgrup.com.tr/site/v2/a2tv/i/a2tv-logo.png" group-title="Turkey",A2TV
https://rnttwmjcin.turknet.ercdn.net/lcpmvefbyo/a2tv/a2tv.m3u8
#EXTINF:-1 tvg-logo="https://upload.wikimedia.org/wikipedia/commons/7/7c/Ahaber_Logo.png" group-title="Turkey",A Haber
https://rnttwmjcin.turknet.ercdn.net/lcpmvefbyo/ahaber/ahaber.m3u8
#EXTINF:-1 tvg-logo="https://i.imgur.com/ZhkZzLf.png" group-title="Turkey",A Spor
https://rnttwmjcin.turknet.ercdn.net/lcpmvefbyo/aspor/aspor.m3u8
#EXTINF:-1 tvg-logo="https://i.imgur.com/mgDCKiy.png" group-title="Turkey",Aksu TV
https://live.artidijitalmedya.com/artidijital_aksutv/aksutv/playlist.m3u8
#EXTINF:-1 tvg-logo="https://i.imgur.com/HyVUwFC.png" group-title="Turkey",ATV
https://rnttwmjcin.turknet.ercdn.net/lcpmvefbyo/atv/atv_1080p.m3u8
#EXTINF:-1 tvg-logo="https://upload.wikimedia.org/wikipedia/commons/thumb/4/43/Diyanet_TV_logo.svg/960px-Diyanet_TV_logo.svg.png" group-title="Turkey",Diyanet TV
https://eustr73.mediatriple.net/videoonlylive/mtikoimxnztxlive/broadcast_5e3bf95a47e07.smil/playlist.m3u8
#EXTINF:-1 tvg-logo="https://www.dsmart.com.tr/epg/images/0x60/5ffc18c6cfef0b15933a8b65" group-title="Turkey",Ekoturk
https://cdn.ekoturk.net/hls/master.m3u8
#EXTINF:-1 tvg-logo="https://upload.wikimedia.org/wikipedia/commons/thumb/e/ef/GZT_logo.svg/960px-GZT_logo.svg.png" group-title="Turkey",GZT
https://gzttv-live.lg.mncdn.com/gzttv/gzttv/playlist.m3u8
#EXTINF:-1 tvg-logo="https://i.imgur.com/xM0HA30.png" group-title="Turkey",Halk TV
https://halktv-live.daioncdn.net/halktv/halktv.m3u8
#EXTINF:-1 tvg-logo="https://www.htspor.com/images/manifest/social-share-logo.png" group-title="Turkey",HTSpor
https://ciner.daioncdn.net/ht-spor/ht-spor.m3u8?app=web
#EXTINF:-1 tvg-logo="https://i.imgur.com/9o1atM6.png" group-title="Turkey",Kanal D
https://demiroren.daioncdn.net/kanald/kanald.m3u8?app=kanald_web&ce=3
#EXTINF:-1 tvg-logo="https://uycyyuuzyh.turknet.ercdn.net/nphindgytw/nowtv/nowtv.m3u8" group-title="Turkey",NOW TV
https://uycyyuuzyh.turknet.ercdn.net/nphindgytw/nowtv/nowtv.m3u8
#EXTINF:-1 tvg-logo="https://upload.wikimedia.org/wikipedia/commons/thumb/0/0c/NTV_%28Turkey%29_logo.svg/960px-NTV_%28Turkey%29_logo.svg.png" group-title="Turkey",NTV
https://dogus.daioncdn.net/ntv/ntv.m3u8?app=ntv_web
#EXTINF:-1 tvg-logo="https://i.imgur.com/9O3DHRB.png" group-title="Turkey",Star TV
https://dogus.daioncdn.net/startv/startv_720p.m3u8?app=a20ac41e-bdc3-4aa1-934d-26b484480ac9&ce=3&sid=8l4w3lst4co5
#EXTINF:-1 tvg-logo="https://i.imgur.com/PrxwKDw.png" group-title="Turkey",TGRT Haber
https://canli.tgrthaber.com/tgrt.m3u8
#EXTINF:-1 tvg-logo="https://upload.wikimedia.org/wikipedia/commons/thumb/8/85/TRT_1_logo_%282021-%29.svg/960px-TRT_1_logo_%282021-%29.svg.png" group-title="Turkey",TRT 1
https://tv-trt1.medya.trt.com.tr/master.m3u8
#EXTINF:-1 tvg-logo="https://upload.wikimedia.org/wikipedia/commons/thumb/7/72/TRT_Haber_Eyl%C3%BCl_2020_Logo.svg/960px-TRT_Haber_Eyl%C3%BCl_2020_Logo.svg.png" group-title="Turkey",TRT Haber
https://tv-trthaber.medya.trt.com.tr/master.m3u8
`;

let allChannels = [];
let categories = new Set();
let currentCategory = 'Tüm Kanallar';
let hls = null;
const video = document.getElementById('video-player');

window.addEventListener('DOMContentLoaded', () => {
  parseContent(gomuluListe);
});

function parseContent(content) {
  const lines = content.split('\n');
  allChannels = []; 
  categories.clear(); 
  categories.add('Tüm Kanallar');

  let currentChannel = {};

  for (let i = 0; i < lines.length; i++) {
    let line = lines[i].trim();
    if (!line) continue;
    
    if (line.startsWith('#EXTINF:')) {
      const logoMatch = line.match(/tvg-logo="([^"]+)"/);
      const groupMatch = line.match(/group-title="([^"]+)"/);
      
      const logo = logoMatch ? logoMatch[1] : 'https://via.placeholder.com/150?text=TV';
      const group = groupMatch ? groupMatch[1] : 'Diğer';
      const name = line.split(',').pop().trim();
      
      currentChannel = { name: name, logo: logo, group: group };
      categories.add(group);
    } else if (line.startsWith('http')) {
      currentChannel.url = line;
      allChannels.push(currentChannel);
      currentChannel = {};
    }
  }
  
  renderCategories();
  renderChannels();
}

function renderCategories() {
  const bar = document.getElementById('categories-bar');
  bar.innerHTML = '';
  
  categories.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn';
    if(cat === currentCategory) btn.classList.add('active');
    btn.innerText = cat;
    btn.onclick = () => {
      currentCategory = cat;
      document.getElementById('search-input').value = ''; 
      renderCategories(); 
      renderChannels();
    };
    bar.appendChild(btn);
  });
}

function searchChannels() {
  const query = document.getElementById('search-input').value.toLowerCase();
  renderChannels(query);
}

function renderChannels(searchQuery = '') {
  const list = document.getElementById('channel-list');
  list.innerHTML = '';
  
  let filtered = currentCategory === 'Tüm Kanallar' ? allChannels : allChannels.filter(c => c.group === currentCategory);
  
  if (searchQuery) {
    filtered = allChannels.filter(c => c.name.toLowerCase().includes(searchQuery));
  }
  
  filtered.forEach(c => {
    const row = document.createElement('div');
    row.className = 'channel-row';
    row.innerHTML = `
      <img src="${c.logo}" onerror="this.src='https://via.placeholder.com/150?text=TV'">
      <div class="channel-row-name">${c.name}</div>
      <i class="fas fa-play"></i>
    `;
    row.onclick = () => playStream(c, c.url);
    list.appendChild(row);
  });
}

function playStream(channelObj, url) {
  document.getElementById('now-playing-bar').style.display = 'flex';
  document.getElementById('np-logo').src = channelObj.logo;
  document.getElementById('np-title').innerText = channelObj.name;

  if (hls) hls.destroy();
  if (Hls.isSupported() && url.includes('.m3u8')) {
    hls = new Hls();
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, function() { video.play(); });
  } else {
    video.src = url;
    video.play();
  }
}
</script>
</body>
</html>
